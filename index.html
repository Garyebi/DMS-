const M6 = ["Main-d'œuvre", "Méthode", "Matière", "Machine", "Milieu", "Mesure"];
const PA_ST = [["afaire", "À faire"], ["cours", "En cours"], ["bloque", "Bloquée"], ["fait", "Faite"], ["annule", "Annulée"]];
function acOuvrirA3(id) { closeModal(); ui.acProjet = id; if (route() === "projet") render(); else location.hash = "projet"; window.scrollTo(0, 0); }
function acGantt(j) {
  const acts = j.actions.filter(a => a.statut !== "annule"); if (!acts.length) return "";
  const debJ = String(j.creeLe).slice(0, 10), auj = isoToday();
  const dates = acts.flatMap(a => [a.debut, a.echeance]).filter(Boolean).concat([debJ, auj]);
  const d0 = dates.reduce((a, b) => a < b ? a : b), d1 = isoPlusFrom(dates.reduce((a, b) => a > b ? a : b), 7);
  const span = Math.max(7, (new Date(d1) - new Date(d0)) / 864e5), x = d => 100 * ((new Date(d) - new Date(d0)) / 864e5) / span;
  const ticks = []; for (let d = d0; d <= d1; d = isoPlusFrom(d, 7)) ticks.push(d);
  return `<div class="gantt" role="img" aria-label="Ligne de temps des sous-actions"><div class="gantt-row gantt-head"><span></span><div class="gantt-track">${ticks.map(t => `<span class="gantt-tick" style="left:${x(t)}%">${fmtD(t)}</span>`).join("")}</div></div>
    ${acts.map(a => { const s = a.debut || (a.echeance && a.echeance < debJ ? a.echeance : debJ), e = a.echeance || s;
      const etat = a.statut === "fait" ? "fait" : a.enRetard ? "retard" : a.statut;
      return `<div class="gantt-row"><span class="gantt-lab" title="${esc(a.texte)}">${esc(a.texte)}</span><div class="gantt-track"><span class="gantt-today" style="left:${x(auj)}%"></span>
        ${a.echeance ? `<span class="gantt-bar" data-e="${etat}" style="left:${x(s)}%;width:${Math.max(1.2, x(e) - x(s))}%" title="${a.debut ? fmtD(a.debut) + " → " : ""}${fmtD(a.echeance)} · ${esc(a.responsable || "")}"></span>` : `<span class="small muted" style="position:absolute;left:4px;top:2px">sans échéance</span>`}</div></div>`; }).join("")}
    <div class="small muted" style="margin-top:4px">Trait jaune : aujourd'hui · vert : faite · rouge : en retard · orange : bloquée · bleu : en cours · gris : à faire</div></div>`;
}
function acCourbe(j, ecarts) {
  if (!j.causeTypeId) return `<div class="small muted">Choisissez la cause précise visée pour suivre son évolution ici.</div>`;
  const mois = []; const d = new Date(); d.setDate(1); for (let i = 5; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1); mois.push(m.toISOString().slice(0, 7)); }
  const n = mois.map(m => ecarts.filter(e => e.causeTypeId === j.causeTypeId && e.dateEcart.slice(0, 7) === m).length), max = Math.max(1, ...n), debut = String(j.creeLe).slice(0, 7);
  const nomM = m => new Date(m + "-15").toLocaleDateString("fr-CA", { month: "short" });
  return `<div class="small" style="margin-bottom:4px">Écarts « ${esc(j.causeType || "")} » par mois (barre foncée : depuis le début du projet)</div>
    <div class="ac-courbe">${mois.map((m, i) => `<div><span style="height:${Math.round(56 * n[i] / max) + 2}px" data-apres="${m >= debut}"></span><b>${n[i]}</b><i>${nomM(m)}</i></div>`).join("")}</div>`;
}

const isoPlusFrom = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
async function a3Sauver(d) { try { await Api.majProjetA3(ui.acProjet, d); } catch (err) { alertBox(err.message); render(); } }
document.addEventListener("change", async ev => {
  const el = ev.target; if (route() !== "projet") return;
  if (el.dataset.a3) { const v = el.dataset.a3 === "causeTypeId" ? (el.value ? Number(el.value) : null) : el.value; await a3Sauver({ [el.dataset.a3]: v });
    if (["statut", "causeTypeId", "etape"].includes(el.dataset.a3)) render(); }
  else if (el.dataset.ish !== undefined) { const o = {}; document.querySelectorAll("[data-ish]").forEach(t => { const l = t.value.split("\n").map(x => x.trim()).filter(Boolean); if (l.length) o[t.dataset.ish] = l; }); await a3Sauver({ ishikawa: o }); }
  else if (el.dataset.pq !== undefined) { const l = [...document.querySelectorAll("[data-pq]")].map(t => t.value.trim()); while (l.length && !l[l.length - 1]) l.pop(); await a3Sauver({ pourquoi: l }); }
  else if (el.dataset.pa) { try { await Api.majProjetAction({ id: Number(el.dataset.pa), [el.dataset.f]: el.value }); render(); } catch (err) { alertBox(err.message); render(); } }
});

<script>
/* Centre des connaissances : leçons tirées des écarts et des projets d'amélioration.
   Règle : une leçon porte une solution à moyen ou à long terme. Un écart réglé seulement
   à court terme reste dans le registre des écarts. Les leçons proposées sont validées par
   le groupe d'amélioration continue avant d'être montrées à tous. */

let LEC = null;
async function lecCharger(force) {
  if (!Api.lecons) return { lecons: [], peutValider: false, moi: null };
  if (!LEC || force) LEC = await Api.lecons();
  return LEC;
}
const lecTxt = l => acNorm([l.titre, l.probleme, l.cause, l.solutionCourt, l.solutionMoyen, l.solutionLong, l.procedure, l.motsCles, l.type, l.causeType, l.noEcart, l.projet].join(" "));
const lecPeutModifier = (d, l) => d.peutValider || (l.creePar === d.moi && l.statut === "proposee");
const LEC_HORIZONS = [
  ["solutionCourt", "Court terme", "Ce qu'on a fait tout de suite pour contenir le problème."],
  ["solutionMoyen", "Moyen terme", "La correction durable, dans les semaines qui suivent."],
  ["solutionLong", "Long terme", "Le changement de standard, de conception, de fournisseur ou de processus."]
];

function lecCarte(l, d, court) {
  const chips = [l.dept ? deptNom(l.dept) : "Usine", l.type ? `${l.cat ? l.cat + " · " : ""}${l.type}` : "", l.causeType || ""].filter(Boolean);
  const hz = LEC_HORIZONS.filter(([k]) => l[k]).map(([k, t]) => `<div class="lec-h" data-h="${k}"><div class="lec-ht">${t}</div><div>${esc(l[k])}</div></div>`).join("");
  const src = [l.ecartId ? `<button class="lien-act" type="button" data-act="detail" data-id="${l.ecartId}">${esc(l.noEcart || "Écart")}</button>` : "",
    l.projetId ? `<button class="lien-act" type="button" data-act="l-projet" data-id="${l.projetId}">Projet : ${esc(l.projet || "")}</button>` : ""].filter(Boolean).join(" · ");
  const etat = l.statut === "proposee" ? `<span class="pill warn">À valider</span>` : l.statut === "archivee" ? `<span class="pill">Archivée</span>` : "";

let MET = null;
async function metCharger(force) { if (!Api.methodes) return null; if (!MET || force) MET = await Api.methodes(); return MET; }
const MET_GENRES = [["procedure", "Procédure"], ["standard", "Standard de travail"], ["instruction", "Instruction de travail"], ["formulaire", "Formulaire ou gabarit"], ["pratique", "Bonne pratique"]];
const metGenre = g => (MET_GENRES.find(x => x[0] === g) || [, "Méthode"])[1];
const metTxt = m => acNorm([m.titre, m.poste, m.resume, m.etapes, m.motsCles, m.responsable, metGenre(m.genre)].join(" "));
const metPeut = (M, m) => M.peutModifier || (m.responsableId && m.responsableId === M.moi);
function metEtapes(t) {
  const l = (t || "").split(/\n+/).map(x => x.replace(/^\s*(\d+[.)]|[-•*])\s*/, "").trim()).filter(Boolean);
  return l.length > 1 ? `<ol class="met-et">${l.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : l.length ? `<p style="margin:6px 0 0">${esc(l[0])}</p>` : "";
}
function metCarte(m, M, d) {
  const lec = d ? d.lecons.filter(l => l.methodeId === m.id && l.statut === "validee") : [];
  const chips = [metGenre(m.genre), m.dept ? deptNom(m.dept) : "Toute l'usine", m.poste || ""].filter(Boolean);
  const st = m.statut === "brouillon" ? `<span class="pill">Brouillon</span>` : m.statut === "retiree" ? `<span class="pill">Retirée</span>` : m.revueDue ? `<span class="pill bad">Revue due</span>` : "";
  return `<article class="lec met" data-st="${m.statut}">
    <div class="row between" style="gap:8px;align-items:flex-start"><div><h3 style="margin:0">${esc(m.titre)}${m.version ? ` <span class="small muted">· version ${esc(m.version)}</span>` : ""} ${st}</h3>
      <div class="lec-chips">${chips.map(c => `<span class="lec-chip">${esc(c)}</span>`).join("")}</div></div>
      <div class="row" style="gap:6px">${m.lien ? `<a class="btn small" href="${esc(m.lien)}" target="_blank" rel="noopener">Ouvrir le document</a>` : ""}${metPeut(M, m) ? `<button class="btn small" type="button" data-act="l-m-edit" data-id="${m.id}">Modifier</button>` : ""}</div></div>
    ${m.resume ? `<p style="margin:6px 0 0">${esc(m.resume)}</p>` : ""}
    ${metEtapes(m.etapes)}
    ${lec.length ? `<div class="small" style="margin-top:6px"><strong>Leçons qui ont mené à cette méthode :</strong> ${lec.map(l => esc(l.titre)).join(" · ")}</div>` : ""}
    <div class="small muted" style="margin-top:6px">Responsable : ${esc(m.responsable || "à nommer")}${m.reviseLe ? ` · révisée le ${fmtD(m.reviseLe)}` : ""}${m.prochaineRevue ? ` · prochaine revue le ${fmtD(m.prochaineRevue)}` : ""}</div>
  </article>`;
}
function metListe(M, f, d) {
  const q = acNorm(f.q);
  const ok = m => (!q || q.split(/\s+/).every(w => metTxt(m).includes(w))) && (!f.dept || m.dept === f.dept || !m.dept) && (!f.cat || m.genre === f.cat);
  const actives = M.methodes.filter(m => m.statut !== "retiree" && ok(m)), ret = M.methodes.filter(m => m.statut === "retiree" && ok(m));
  const dues = M.methodes.filter(m => m.revueDue).length;
  return `${dues ? `<div class="notice warn small" style="margin-bottom:10px">${dues} méthode(s) ont dépassé leur date de revue.</div>` : ""}
    <div class="muted small" style="margin:4px 0 8px">${actives.length} méthode(s)${q || f.dept || f.cat ? " trouvée(s)" : ""}.</div>
    ${actives.length ? actives.map(m => metCarte(m, M, d)).join("") : `<div class="empty">${M.methodes.length ? "Aucune méthode ne correspond à la recherche." : "Aucune méthode pour l'instant." + (M.peutModifier ? " Ajoutez la première avec « + Ajouter une méthode »." : " Le groupe d'amélioration continue les ajoute.")}</div>`}
    ${ret.length ? `<details style="margin-top:14px"><summary class="small">Méthodes retirées (${ret.length})</summary>${ret.map(m => metCarte(m, M, d)).join("")}</details>` : ""}`;
}

/* Pistes pour le groupe AC : projets terminés et écarts qui ont changé une procédure, sans leçon */
async function lecCandidatsHtml(d) {
  const [ecarts, projets, actions] = await Promise.all([Api.ecarts({}), Api.projetsAC ? Api.projetsAC() : [], Api.actions({})]);
  const mtlt = new Set(actions.filter(a => a.ecartId && (a.horizon === "MT" || a.horizon === "LT")).map(a => a.ecartId));
  const avecE = new Set(d.lecons.map(l => l.ecartId).filter(Boolean)), avecP = new Set(d.lecons.map(l => l.projetId).filter(Boolean));
  const pj = projets.filter(j => j.statut === "termine" && !avecP.has(j.id));
  const ec = ecarts.filter(e => e.solution && (mtlt.has(e.id) || e.procedureModifiee) && !avecE.has(e.id)).slice(0, 15);
  if (!pj.length && !ec.length) return "";
  return `<details class="card" style="margin-bottom:14px"><summary><strong>Pistes de leçons</strong> <span class="small muted">· ${pj.length} projet(s) terminé(s) et ${ec.length} écart(s) réglé(s) avec une action à moyen ou long terme, sans leçon</span></summary>

      ${ec.map(e => `<li>${esc(e.no)} · ${esc(e.titre)} ${e.procedureModifiee ? `<span class="muted">(${esc(e.procedureNom || "procédure modifiée")})</span>` : ""} <button class="btn small" type="button" data-act="l-de-ecart" data-id="${e.id}">Tirer une leçon</button></li>`).join("")}
    </ul></details>`;
}

<script>

const ST_BLOCS = [
  ["securite", "Sécurité : croix et écarts S"], ["sqcdp-Q", "Qualité : écarts et actions"], ["sqcdp-C", "Coûts : écarts et actions"],
  ["sqcdp-D", "Délais : écarts et actions"], ["sqcdp-P", "Personnel : écarts et actions"], ["plan", "Plan de la journée"],
  ["kpi", "Indicateurs SQCDP"], ["ecarts", "Écarts à traiter à ce niveau"], ["retours", "Solutions reçues des autres niveaux"],
  ["actions", "Actions dues ou en retard"], ["sujets", "Sujets suivis"], ["charge", "Charge et carnet de commandes"],
  ["pareto", "Pareto des écarts du mois"], ["apercu", "Vue d'ensemble des niveaux"], ["libre", "Discussion libre"],
  ["lien", "Lien externe (Wrike, Power BI, SharePoint)"],
  ["ac_recus", "Groupe AC : écarts reçus"], ["recurrences", "Groupe AC : récurrences"], ["a_classer", "Groupe AC : causes à classer"],

];
const stBlocNom = b => (ST_BLOCS.find(x => x[0] === b) || [, b])[1];

/* Lien d'un point de rencontre : Wrike, Power BI ou autre */
function lienPoint(url) {

  const u = String(url), wr = /wrike\.com/i.test(u), pb = /powerbi\.com/i.test(u);
  return `<div style="margin-top:8px">${wr && Api.wrike ? `<button class="btn small primary" type="button" data-act="st-wrike" data-lien="${esc(u)}">Voir les tâches Wrike ici</button> ` : ""}<a class="btn small" href="${esc(u)}" target="_blank" rel="noopener">${wr ? "Ouvrir dans Wrike" : pb ? "Ouvrir le rapport Power BI" : "Ouvrir le lien"}</a>
    ${wr ? `<div class="wr-zone"></div>` : ""}</div>`;
}
const WR_ORDRE = { Active: 0, Deferred: 1, Completed: 2, Cancelled: 3 };

      <span class="small"><strong>${actives.filter(t => t.groupe === "Active").length}</strong> en cours · <strong class="${retard.length ? "wr-late" : ""}">${retard.length}</strong> en retard · ${l.length - actives.length} terminée(s)</span></div>
    ${vues.length ? `<div class="scroll"><table class="t" style="margin-top:6px"><thead><tr><th>Tâche</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>
      ${vues.map(t => `<tr${fini(t) ? ' class="muted"' : ""}><td>${t.lien ? `<a href="${esc(t.lien)}" target="_blank" rel="noopener">${esc(t.titre)}</a>` : esc(t.titre)}</td><td class="small">${esc((t.responsables || []).join(", ") || "—")}</td>

const WR_CACHE = {};

      ${rens.map(r => `<tr${r.actif ? "" : ' class="muted"'}><td>${esc(r.nom)}</td><td>${esc(eqNom(r.equipe))}</td><td class="small">${esc(r.frequence || "")}</td><td class="num">${r.dureeMin} min</td>

function stPointRow(p) {

  return `<div class="st-pt"><span class="st-n"></span>

    <span class="st-btns"><button class="btn small" type="button" data-act="st-up" aria-label="Monter">↑</button><button class="btn small" type="button" data-act="st-down" aria-label="Descendre">↓</button><button class="btn small" type="button" data-act="st-del" aria-label="Retirer le point">✕</button></span></div>`;

function stRenum() {
  const rows = [...document.querySelectorAll(".st-pt")];

  const tot = rows.reduce((s, r) => s + (Number(r.querySelector(".st-d").value) || 0), 0); const z = $("#sr-tot"); if (z) z.textContent = tot + " min";

async function stRencontreForm(code) {

  const v = Object.assign({ nom: "", equipe: "", dept: "", frequence: "", participants: "", actif: true, points: [] }, r || {});

    <label for="sr-e">Niveau (équipe)<select id="sr-e">${opt([["", "Choisir"], ...eqs.map(t => [t.code, `T${t.strate} · ${t.nom}`])], v.equipe || "")}</select></label>
    <label for="sr-d">Département<select id="sr-d">${opt([["", "Toute l'usine"], ...REF.departements.map(x => [x.code, x.nom])], v.dept || "")}</select></label>
    <label class="full" for="sr-f">Quand (jour, heure, endroit)<input id="sr-f" maxlength="120" value="${esc(v.frequence || "")}" placeholder="Ex. Mardi · 14 h 00 · salle de conférence"></label>

    <div class="full"><div class="row between"><strong>Ordre du jour</strong><span class="small muted">Durée totale : <strong id="sr-tot"></strong></span></div>
      <div class="st-head small muted"><span>#</span><span>Titre</span><span>Min</span><span>Ce que le point affiche</span><span>Lien</span><span></span></div>

    <label class="check full" for="sr-a"><input type="checkbox" id="sr-a" ${v.actif ? "checked" : ""}> Rencontre active (décocher pour la retirer des rencontres sans perdre son historique)</label>

async function stEquipeForm(code) {

  modal(`<h2>${t ? "Modifier l'équipe" : "Nouvelle équipe"}</h2>

    <label class="check full" for="se-a"><input type="checkbox" id="se-a" ${v.actif !== false ? "checked" : ""}> Équipe active</label>
    <div class="full" id="se-msg"></div>

document.addEventListener("click", async ev => {

  const act = a.dataset.act;
  try {
    if (act === "st-wrike") await wrikeCharger(a);
    else if (act === "st-r-new") await stRencontreForm(null);
    else if (act === "st-r-edit") await stRencontreForm(a.dataset.code);
    else if (act === "st-e-new") await stEquipeForm(null);
    else if (act === "st-e-edit") await stEquipeForm(a.dataset.code);

    else if (["st-up", "st-down", "st-del"].includes(act)) {
      const row = a.closest(".st-pt"); MODAL_SALE = true;

      else if (act === "st-up" && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
      else if (act === "st-down" && row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
      stRenum();
    }
  } catch (err) { alertBox(err.message); }
});

<script>
/* Portail DMS EBI — interface. Toute donnée passe par window.Api (js/api.js). */
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isoToday = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d.toISOString().slice(0, 10); };
const isoPlus = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtD = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString("fr-CA", { day: "numeric", month: "short" }) : "";
const nf = (v, d = 1) => v == null ? "–" : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("fr-CA");
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const STATUT = { Ouvert: "Ouvert", RetourT1: "Retour au T1", Ferme: "Fermé", Annule: "Annulé" };
const ASTATUT = { AFaire: "À faire", EnCours: "En cours", Fait: "Fait", Annule: "Annulé" };
const SSTATUT = { ADecider: "À décider", Planifie: "Planifié", EnCours: "En cours", Termine: "Terminé" };
const ROUTES = [["accueil", "Accueil"], ["rencontres", "Rencontres"], ["ecarts", "Écarts"], ["fab", "Fiches FAB"], ["actions", "Actions"], ["gemba", "Gemba"], ["lecons", "Connaissances"], ["tableaux", "Tableaux de bord"], ["journal", "Journal"], ["admin", "Administration"]];

let REF = null, ME = null, RENC = null;
const ui = { meeting: null, run: null, fE: { dept: "", statut: "actifs", strate: "", cat: "", q: "", vue: "registre", etiquette: "", annee: "" }, fA: { responsable: "", statut: "ouvertes" }, tbDept: "", tbMesure: "heures", tbJours: 28, tbVue: "dms", pbi: null };
let renderSeq = 0;

const eq = c => REF.equipes.find(e => e.code === c);
const deptNom = c => (REF.departements.find(d => d.code === c) || {}).nom || "Direction";
const myTeams = () => ME.equipes || [];
const myDepts = () => { const t = myTeams().map(eq).filter(Boolean); if (t.some(x => x.strate >= 3)) return REF.departements.map(d => d.code); return [...new Set(t.flatMap(x => x.depts || [x.dept]))]; };
const inTeamScope = (e, t) => t.strate === 1 ? e.equipeOrigine === t.code : t.strate === 2 ? t.depts.includes(e.dept) : true;
const sev = e => { const h = e.minutes / 60; if (e.cat === "S" || h >= 4 || e.cout >= 2000) return 3; if (h >= 1 || e.cout >= 500) return 2; return 1; };
const ROUTES_CACHEES = ["projet", "structure"];
const route = () => { const h = location.hash.slice(1); return ROUTES.some(r => r[0] === h) || ROUTES_CACHEES.includes(h) ? h : "accueil"; };

/* ---------- Démarrage ---------- */
async function boot() {
  if (!window.Api) { $("#app").innerHTML = `<div class="error">${esc(window.ApiErreur || "Le portail n'a pas pu démarrer.")}</div>`; return; }
  if (Api.mode === "supabase") {
    let s = null; try { s = await Api.session(); } catch (e) {}
    if (!s) { showLogin(); return; }
  }
  try {
    [ME, REF, RENC] = await Promise.all([Api.moi(), Api.referentiels(), Api.rencontres()]);
    if (typeof acRefCauses === "function") await acRefCauses();
    await chargerSuites();
  } catch (err) {
    if (Api.mode === "supabase") { await Api.deconnexion(); showLogin(err.message); return; }
    $("#app").innerHTML = `<div class="error">Le portail n'arrive pas à joindre le serveur DMS : ${esc(err.message)}</div>`; return; }
  const cfg = window.DMS_CONFIG;
  $("#version").textContent = `v${cfg.version} · ${cfg.dateVersion}`;
  renderWho();
  if (!ui.meeting && RENC.length) ui.meeting = (RENC.find(r => myTeams().includes(r.equipe)) || RENC[0]).code;
  render();
}

  <div id="l-msg">${msg ? `<div class="notice bad">${esc(msg)}</div>` : ""}</div><button class="btn primary" type="submit">Se connecter</button></form></div>`;

    try { await Api.connexion($("#l-mail").value.trim(), $("#l-mdp").value); $("#app").innerHTML = ""; await boot(); }

/* ---------- Rencontres ---------- */
async function vRencontres() {
  const groups0 = [["PAN", "Panneaux"], ["MOT", "Moteurs"], ["VIS", "Vision"], ["DES", "Conception et dessin"], [null, "Direction"]];
  const aside = suitesAside() + groups0.map(([g, l]) => { const rs = RENC.filter(r => r.dept === g && eq(r.equipe)); return rs.length ? `<div class="dept">${l}</div>` + rs.map(r => `<button type="button" class="meet-item" data-act="meet" data-code="${r.code}" aria-pressed="${!ui.suite && ui.meeting === r.code}"><span class="n">${esc(r.nom)}</span> <span class="pill lvl">T${eq(r.equipe).strate}</span><div class="f">${esc(r.frequence)} · ${r.dureeMin} min</div></button>`).join("") : ""; }).join("");
  if (ui.suite) { const h = await vSuite(aside); if (h) return h; }
  const m = RENC.find(r => r.code === ui.meeting);
  if (!m) return `<div class="layout-meet"><aside class="meet-list" aria-label="Rencontres">${aside}</aside><section><div class="empty">Choisissez une rencontre ou créez une suite.</div></section></div>`;
  const t = eq(m.equipe);
  const [ecarts, actions, sujets, tenues, kpi, ractions0] = await Promise.all([Api.ecarts({}), Api.actions({ statut: "ouvertes" }), Api.sujets(m.code), Api.tenues(m.code), Api.kpi(""), Api.ractions ? Api.ractions({ rencontre: m.code }) : []]);
  const ractions = ractions0.filter(a => a.statut !== "fait" || a.fermeLe === isoToday());
  const avisH = typeof avisBandeau === "function" ? await avisBandeau(t.strate >= 3 ? null : (t.depts || [t.dept])) : "";
  const list = aside;
  const run = ui.run && ui.run.code === m.code ? ui.run : null;
  const el = run ? Math.floor((Date.now() - run.start) / 1000) : 0;
  const ac = typeof acCharger === "function" && m.points.some(p => AC_BLOCS.includes(p.bloc)) ? await acCharger() : null;
  const ctx = { m, t, ecarts, actions, sujets, kpi, ractions, ac };
  const head = `<div class="meet-head"><div><h2>${esc(m.nom)}</h2><div class="meta"><span>${esc(m.frequence)}</span><span>${m.dureeMin} min</span><span>Strate T${t.strate} : ${esc(t.nom)}</span></div><div class="meta"><span>Participants : ${esc(m.participants)}</span></div></div>
   <div class="row">${run ? `<div class="timer num ${el > m.dureeMin * 60 ? "over" : ""}" id="timer">${mmss(el)}</div><span class="muted small">/ ${m.dureeMin}:00</span><button class="btn" data-act="next" type="button">Point suivant</button><button class="btn primary" data-act="close-meet" type="button">Clore la rencontre</button>` : `<button class="btn primary" data-act="start-meet" type="button">Démarrer la rencontre</button>`}</div></div>`;
  const items = m.points.map((p, i) => { const cls = run ? (i < run.idx ? "done" : i === run.idx ? "current" : "") : "";
    return `<div class="ag ${cls}"><div class="ag-h"><span class="ag-n">${i + 1}</span><span class="ag-t">${esc(p.titre)}</span><span class="muted small num">${p.dureeMin} min</span></div><div class="ag-b">${bloc(p.bloc, ctx)}${typeof lienPoint === "function" ? lienPoint(p.lien) : ""}</div></div>`; }).join("");
  const cr = tenues.length ? tenues.map(c => `<div class="small"><strong>${fmtD(c.debut)}</strong> · ${c.dureeMin} min · ${esc(c.animeePar || "")} · ${esc(c.decisions)}</div>`).join("") : `<div class="muted small">Aucun compte rendu pour l'instant.</div>`;
  return `<div class="layout-meet"><aside class="meet-list" aria-label="Structure des rencontres">${list}</aside><section>${head}${avisH}${typeof slotPbi === "function" ? slotPbi(m.code) : ""}<div class="agenda">${items}</div><div class="card" style="margin-top:14px"><h3>Derniers comptes rendus</h3><div class="grid" style="gap:6px;margin-top:6px">${cr}</div></div></section></div>`;
}
/* Actions de suivi décidées en rencontre, classées par lettre SQCDP (table raction, comme les actions des suites) */
function ractPoint(L, m, ractions, ecarts) {
  if (!Api.ajouterRactionRenc) return "";
  const l = (ractions || []).filter(a => a.cat === L);
  const noE = id => { const e = (ecarts || []).find(x => x.id === id); return e ? e.no : "Écart"; };
  const rows = l.map(a => `<tr data-st="${a.statut}"><td style="min-width:240px"><button type="button" class="lien-act" data-act="ra-edit" data-id="${a.id}" data-code="${esc(m.code)}" title="Modifier l'action">${esc(a.texte)}</button></td><td>${esc(a.responsable || "")}</td>
    <td class="num">${a.enRetard ? `<span class="pill bad">${fmtD(a.echeance)}</span>` : (a.echeance ? fmtD(a.echeance) : "—")}</td>
    <td>${a.ecartId ? `<button class="btn small" type="button" data-act="detail" data-id="${a.ecartId}">${esc(noE(a.ecartId))}</button>` : ""}</td>
    <td><select ${bAttr("ract", a.id, "statut", "")} data-rr="1" aria-label="Statut">${bOpt(a.statut)}</select></td><td class="small">${esc(a.dernierAvancement || "")}</td></tr>`).join("");
  return `<div class="ract-pt"><div class="row between"><strong class="small">Actions de suivi ${L}${l.length ? ` (${l.length})` : ""}</strong><button class="btn small" type="button" data-act="ra-new" data-code="${esc(m.code)}" data-cat="${L}">+ Action</button></div>
   ${l.length ? `<div class="scroll"><table class="t"><thead><tr><th>Action</th><th>Responsable</th><th>Échéance</th><th>Écart</th><th>Statut</th><th>Dernier avancement</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="muted small">Aucune action de suivi ouverte. Sous le barème? Ajoutez une action plutôt qu'un écart.</div>`}</div>`;
}

const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function bloc(b, { m, t, ecarts, actions, sujets, kpi, ractions, ac }) {
  if (typeof AC_BLOCS !== "undefined" && AC_BLOCS.includes(b)) return acBloc(b, ac);
  const depts = t.strate === 1 ? [t.dept] : t.strate === 2 ? t.depts : REF.departements.map(d => d.code);
  const scope = ecarts.filter(e => inTeamScope(e, t));
  if (b === "kpi") return kpiTiles(kpi.filter(k => depts.includes(k.dept)), depts.length > 1);
  if (b && b.startsWith("sqcdp-")) { const L = b.slice(6);
    const ks = kpi.filter(k => depts.includes(k.dept) && k.cat === L);
    const l = ecarts.filter(e => e.cat === L && e.equipeCourante === t.code && e.statut === "Ouvert").sort((a, c) => sev(c) - sev(a));
    const plan = L === "D" && t.strate === 1 ? `<div style="margin-bottom:10px">${bloc("plan", { m, t, ecarts, actions, sujets, kpi, ractions })}</div>` : "";
    return plan + (ks.length ? kpiTiles(ks, depts.length > 1) : `<div class="muted small">Aucun KPI ${L} défini pour cette équipe.</div>`)
      + `<div class="row between" style="margin:10px 0 8px"><span class="muted small">${l.length ? l.length + " écart(s) " + L + " à traiter à ce niveau, les plus graves d'abord." : "Aucun écart " + L + " à traiter à ce niveau."}</span><button class="btn small" data-act="new" data-team="${t.strate === 1 ? t.code : ""}" data-cat="${L}" type="button">+ Documenter un écart ${L}</button></div>`
      + l.map(e => ecartCard(e, true)).join("") + ractPoint(L, m, ractions, ecarts); }
  if (b === "securite") { const l = scope.filter(e => e.cat === "S" && e.statut !== "Ferme"); const jsa = kpi.filter(k => depts.includes(k.dept) && k.nom === "Jours sans accident");
    return (typeof slotCroix === "function" ? `<div style="margin-bottom:10px">${slotCroix(depts, null, true)}</div>` : "") + `<div class="row" style="margin-bottom:8px">${jsa.map(k => `<span class="pill ${kpiState(k) === "ok" ? "ok" : "warn"}">${esc(deptNom(k.dept))} : ${nf(last(k), 0)} jours sans accident</span>`).join(" ")}</div>` + ((sk => sk.length ? `<div style="margin-bottom:10px">${kpiTiles(sk, depts.length > 1)}</div>` : "")(kpi.filter(k => depts.includes(k.dept) && k.cat === "S" && k.nom !== "Jours sans accident")))
      + (t.strate <= 2 ? `<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn small" data-act="new" data-team="${t.strate === 1 ? t.code : ""}" data-cat="S" type="button">+ Documenter un écart S</button></div>` : "")
      + (l.length ? l.map(e => ecartCard(e, e.equipeCourante === t.code)).join("") : `<div class="empty">Aucun écart de sécurité ouvert.</div>`) + ractPoint("S", m, ractions, ecarts); }
  if (b === "ecarts") { const l = ecarts.filter(e => e.equipeCourante === t.code && e.statut === "Ouvert").sort((a, c) => sev(c) - sev(a));

function modalGarde(abandon) {
