<style>
/* Portail DMS EBI — bandeau marine, modules en onglets, état lu par bandes et pastilles. */
:root{
  --navy:#0b2545; --accent:#1f5fae; --accent-soft:#e6eef9;
  --paper:#f4f6f9; --surface:#ffffff; --ink:#16202e; --muted:#5b6778; --line:#d9dfe7;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fff2db; --bad:#c0392b; --bad-soft:#fde8e5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0a1a33; --accent:#6aa3ec; --accent-soft:#16294a;
    --paper:#0e1520; --surface:#162131; --ink:#e6ecf4; --muted:#9aa8ba; --line:#2a3a50;
    --ok:#4cc27f; --ok-soft:#13301f; --warn:#e7a43c; --warn-soft:#33260f; --bad:#ef6b5c; --bad-soft:#3a1814;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0a1a33; --accent:#6aa3ec; --accent-soft:#16294a;
  --paper:#0e1520; --surface:#162131; --ink:#e6ecf4; --muted:#9aa8ba; --line:#2a3a50;
  --ok:#4cc27f; --ok-soft:#13301f; --warn:#e7a43c; --warn-soft:#33260f; --bad:#ef6b5c; --bad-soft:#3a1814;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem} h3{font-size:1.12rem}
button,select,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
header.top .brand{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top .brand-logo{height:37px;width:auto;display:block}
header.top .brand-sep{width:1px;height:30px;background:rgba(255,255,255,.35)}
@media (max-width:560px){header.top .brand-logo{height:30px}header.top .brand-sep{height:24px}}
header.top .brand h1{font-size:1.55rem;color:#fff}
header.top .tag{font-size:.82rem;opacity:.8}
header.top .who{display:flex;gap:10px;align-items:center;font-size:.9rem}
header.top .who select{background:#13305a;color:#fff;border:1px solid #2d4f80;border-radius:6px;padding:4px 6px}
header.top .btn{color:var(--ink)}
.demo-band{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--warn);padding:5px 20px;font-size:.84rem}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--navy);padding:0 16px}
nav.tabs a{color:#c8d6ea;padding:10px 14px;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;text-decoration:none;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#7fb2f0}
nav.tabs a:hover{color:#fff}
main{padding:18px 20px 40px;max-width:1360px;margin:0 auto}
.loading{padding:40px;text-align:center;color:var(--muted)}
.error{padding:12px 14px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--paper);color:var(--muted);border-color:var(--line)}
.sq{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:.9rem;flex:none}
:root[data-theme="dark"] .sq{background:#2d4f80}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.home .card h3{margin-bottom:8px}
.count{font-family:var(--display);font-size:2.2rem;font-weight:600;line-height:1}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list-plain li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}
.list-plain li:last-child{border-bottom:0}
.layout-meet{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.layout-meet{grid-template-columns:1fr}}
.meet-list .dept{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.meet-list .dept:first-child{margin-top:0}
.meet-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.meet-item:hover{border-left-color:var(--accent)}
.meet-item[aria-pressed="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.meet-item .n{font-weight:600}
.meet-item .f{font-size:.82rem;color:var(--muted)}
.meet-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.timer{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1}
.timer.over{color:var(--bad)}
.agenda{display:grid;gap:10px;margin-top:14px}
.ag{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ag > .ag-h{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.ag .ag-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:.85rem}
.ag.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ag.current .ag-n{background:var(--accent);color:#fff;border-color:var(--accent)}
.ag.done{opacity:.72}
.ag.done .ag-n{background:var(--ok);color:#fff;border-color:var(--ok)}
.ag .ag-b{padding:12px 14px}
.ag .ag-t{font-weight:600;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);border-top:4px solid var(--line)}
.kpi.ok{border-top-color:var(--ok)} .kpi.bad{border-top-color:var(--bad)} .kpi.warn{border-top-color:var(--warn)}
.kpi-click{cursor:pointer}
.kpi-click:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kpi .k-l{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.kpi .k-v{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.1}
.kpi .k-c{font-size:.78rem;color:var(--muted)}
.ecart{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.ecart .stripe{background:var(--line)}
.ecart.sev2 .stripe{background:var(--warn)} .ecart.sev3 .stripe{background:var(--bad)} .ecart.retour .stripe{background:var(--ok)}
.ecart .body{padding:9px 0}
.ecart .title{font-weight:600}
.ecart .acts{padding:9px 12px 9px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted);margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap;background:var(--surface)}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.overlay{position:fixed;inset:0;background:rgba(8,16,30,.55);display:flex;justify-content:center;align-items:flex-start;padding:4vh 12px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:min(780px,100%);padding:18px 20px;border-top:5px solid var(--navy)}
.modal h2{margin-bottom:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form .full{grid-column:1/-1}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.form label{display:grid;gap:3px;font-size:.86rem;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:.95rem}
.form textarea{min-height:64px;resize:vertical}
.check,.form label.check{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.9rem;font-weight:400}
.collabs{display:flex;flex-wrap:wrap;gap:6px 16px}
.section-t{font-family:var(--display);font-size:1.08rem;font-weight:600;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.form .form{margin:0}
.notice{border-radius:6px;padding:9px 12px;font-size:.9rem;border:1px solid}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)}
.preview-title{font-family:var(--display);font-size:1.15rem;font-weight:600;padding:7px 10px;border:1px dashed var(--line);border-radius:6px;background:var(--paper)}
.act-row{display:grid;grid-template-columns:70px 1fr 200px 150px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:700px){.act-row{grid-template-columns:1fr}}
.act-row input,.act-row select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;color:var(--ink)}
.timeline{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px;display:grid;gap:8px}
.timeline div{position:relative;font-size:.9rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px 56px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:18px;background:var(--paper);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.vital .fill{background:var(--navy)}
:root[data-theme="dark"] .bar.vital .fill{background:#8fb8ee}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.spark{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
footer{max-width:1360px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Bilans de rencontres (suites) */
.bil{display:grid;gap:14px}
.bil input,.bil select,.bil textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:.93rem;width:100%;min-width:0}
.bil textarea{min-height:58px;resize:vertical;line-height:1.4}
.bil label{display:grid;gap:3px;align-content:start;font-size:.82rem;color:var(--muted);font-weight:500}
.bil .span2{grid-column:span 2}
.bil-title{font-family:var(--display);font-size:1.55rem!important;font-weight:600;border-color:transparent!important;background:transparent!important}
.bil-title:hover,.bil-title:focus{border-color:var(--line)!important;background:var(--paper)!important}
.bil-meta{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.bil-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bil-act{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1.6fr);gap:10px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.bil-act[data-st="fait"]{border-left-color:var(--ok)}
.bil-act[data-st="bloque"]{border-left-color:var(--bad)}
@media (max-width:1000px){.bil-act{grid-template-columns:1fr}}
.bil-act-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;align-content:start}
.bil-prec{margin-top:4px;padding:4px 8px;border-left:3px solid var(--line);background:var(--paper);border-radius:0 4px 4px 0}
.bil-pt{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--surface)}
.bil-pt-h{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bil-pt-h .ag-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.85rem;flex:none}
.bil-pt-h .bil-sujet{flex:1 1 260px;width:auto;font-weight:600}
.bil-pt-h .w-resp{flex:0 1 210px;width:auto}
.bil-pt-h .w-min{flex:0 0 76px;width:76px}
.bil-pt-b{padding:10px 12px}
.bil-new{display:grid;grid-template-columns:minmax(0,1fr) 190px 150px 110px auto;gap:6px;align-items:center;margin-top:6px}
.bil-new[data-st="fait"] > input:first-child{text-decoration:line-through;color:var(--muted)}
.bil-add input{background:var(--surface)}
@media (max-width:800px){.bil-new{grid-template-columns:1fr}.bil .span2{grid-column:auto}}
.bil-lbl textarea{min-height:80px}
.etat{font-size:.84rem}.etat.bad{color:var(--bad)}
.chg{margin-bottom:12px}.chg h3{display:flex;gap:8px;align-items:center;margin-bottom:4px}.chg ul{margin:0;padding-left:18px;display:grid;gap:4px}
#print-area{display:none}
@page{margin:14mm}
@media print{
  body.printing > *:not(#print-area){display:none!important}
  body.printing #print-area{display:block;font-family:var(--body);color:#000;font-size:11pt}
  #print-area h1{font-family:var(--display);font-size:20pt;margin:8px 0 2px}
  #print-area h2{font-family:var(--display);font-size:14pt;border-bottom:2px solid #0b2545;margin:14px 0 6px;padding-bottom:2px}
  #print-area h3{font-size:12pt;margin:10px 0 4px}
  #print-area table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:9.5pt}
  #print-area th,#print-area td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
  #print-area th{background:#e6eef9}
  #print-area tr,#print-area .pr-pt{break-inside:avoid}
  .pr-h img{height:26px;width:auto;display:block}
  .pr-h{display:flex;justify-content:space-between;align-items:center;background:#0b2545;color:#fff;padding:6px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-m{color:#444;font-size:10pt}.pr-r{font-weight:400;color:#444}.pr-av{color:#333;font-style:italic;margin-top:2px}
  .pr-f{margin-top:16px;border-top:1px solid #bbb;padding-top:4px;font-size:8.5pt;color:#555}
}
.lien-act{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px dotted var(--muted)}
.lien-act:hover{color:var(--accent);border-bottom-color:var(--accent)}
.lien-act:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}
/* Étiquettes, pièces jointes, archives */
.chip{display:inline-flex;align-items:center;gap:4px;background:#e6eef9;color:var(--navy);border:1px solid #c9d8ee;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;margin:2px 4px 2px 0}
.chip.sm{font-size:.72rem;padding:0 7px;font-weight:500}
.chip button{all:unset;cursor:pointer;font-size:.75rem;color:var(--muted);padding:0 2px}.chip button:hover{color:var(--bad)}
.chip button:focus-visible{outline:2px solid #7fb2f0;border-radius:3px}
.etiq-ed{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.etiq-ed input{flex:1 1 220px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);color:var(--ink);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:10px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:.88rem;font-weight:600;color:var(--muted);background:var(--surface)}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.seg button:focus-visible{outline:3px solid #7fb2f0;outline-offset:-3px}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0}
.pj{position:relative;margin:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface)}
.pj img,.pj video{display:block;width:100%;height:120px;object-fit:cover;border-radius:5px;background:#000}
.pj-lien{display:flex;flex-direction:column;justify-content:center;min-height:60px;word-break:break-word}
.pj-i{margin-top:4px}
.pj-del{position:absolute;top:8px;right:8px;z-index:1;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.8rem;padding:1px 6px;color:var(--ink)}
.pj-del.conf{background:var(--bad);color:#fff;border-color:var(--bad)}
.pj-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.pj-add input{flex:1 1 180px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);color:var(--ink);font-size:.9rem}
.pj-add label.btn{cursor:pointer}
.pj-add label.btn:focus-within{outline:3px solid #7fb2f0}
.err-txt{color:var(--bad)}
.jauge{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin-top:6px;max-width:420px}
.jauge span{display:block;height:100%;background:var(--accent)}.jauge span.bad{background:var(--bad)}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pj-add label.btn{position:relative}
.pbi-cadre{position:relative;width:100%;aspect-ratio:16/9.6;min-height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;margin-top:12px}
.pbi-cadre iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.journal-det{margin-top:10px}.journal-det summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0}
.journal-det summary:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}

.cx-nav{margin-bottom:8px}.cx-mois{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize}
.cx-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cx-bloc{display:grid;gap:6px;justify-items:center;text-align:center}
.cx-t{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--navy)}
.cx-grille{display:grid;grid-template-columns:repeat(7,28px);grid-template-rows:repeat(7,28px);gap:3px}
.cx{all:unset;box-sizing:border-box;display:grid;place-items:center;border-radius:4px;font-size:.72rem;font-weight:700;cursor:pointer;border:1px solid rgba(0,0,0,.12);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cx:focus-visible{outline:3px solid #7fb2f0;outline-offset:1px}
.cx-vert{background:#2e9e4f}.cx-jaune{background:#f2c230;color:#3b2f00}.cx-orange{background:#ef7d22}.cx-rouge{background:#d0312d}
.cx-neutre{background:#d9dee5;color:#4b5563}.cx-futur{background:#fff;color:#9aa3ae;cursor:default;border-style:dashed}.cx-vide{background:transparent;border:1px dashed #e3e7ed;cursor:default}
.cx-man{box-shadow:inset 0 0 0 2px #0b2545}
.cx-auj{outline:2px solid var(--navy);outline-offset:2px}
.cx-p{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}

.cx-leg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;color:var(--muted)}.cx-leg .cx-p{margin-left:0}

.bell{all:unset;position:relative;cursor:pointer;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;background:rgba(255,255,255,.08)}

.nt-list{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}

.ton-action{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 12px;background:#f1f6fd}

.ta-form{grid-template-columns:1fr 1fr;padding:8px 0;border-top:1px solid var(--line)}

.pbi-slot:empty{display:none}
.pbi-renc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;margin:10px 0}

.pbi-minis{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:8px}
.pbi-mini{width:300px}

.pbi-full{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column}

"use strict";

function httpApi(base) {
  async function call(method, path, body) {
    const r = await fetch(base + path, {
      method, credentials: "include",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) {
      let msg = "Erreur " + r.status;
      try { const j = await r.json(); if (j.message) msg = j.message; } catch (e) {}
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();

        b.actions.forEach(a => { if (a.pointId === p.id) a.pointId = null; }); b.points = b.points.filter(x => x.id !== p.id);
        b.points.filter(x => x.tenueId === p.tenueId).sort((x, y) => x.ordre - y.ordre).forEach((x, i) => { x.ordre = i + 1; }); return null; }),
      ajouterRaction: (tid, d) => run(() => { const t = tenue(tid), b = B(); need((d.texte || "").trim(), "Décrivez l'action.");
        const a = Object.assign({ id: ++b.seq.a, rencontre: t.rencontre, tenueOrigine: t.id, pointId: d.pointId ? Number(d.pointId) : null, texte: d.texte.trim(), echeance: d.echeance || null, statut: "cours", depuis: t.date, fermeLe: null }, resp(d));
        b.actions.push(a); return a.id; }),
      majRaction: (id, tid, d) => run(() => { const b = B(), a = b.actions.find(x => x.id === Number(id)); need(a, "Action introuvable."); suite(a.rencontre);
        const t = tid ? tenue(tid) : null; need(!t || t.rencontre === a.rencontre, "Cette action n'appartient pas à cette rencontre.");
        if ("statut" in d) need(["cours", "bloque", "fait"].includes(d.statut), "Statut inconnu.");
        if ((d.texte || "").trim()) a.texte = d.texte.trim();
        if ("responsable" in d || "responsableId" in d) Object.assign(a, resp(d));
        if ("echeance" in d) a.echeance = d.echeance || null;
        if ("statut" in d) { if (d.statut === "fait" && a.statut !== "fait") a.fermeLe = t ? t.date : today(); if (d.statut !== "fait") a.fermeLe = null; a.statut = d.statut; }
        if (t) suiviUpsert(a, t.id, d); return null; }),
      supprimerRaction: id => run(() => { const b = B(), a = b.actions.find(x => x.id === Number(id)); need(a, "Action introuvable."); suite(a.rencontre);
        b.suivis = b.suivis.filter(x => x.actionId !== a.id); b.actions = b.actions.filter(x => x.id !== a.id); return null; }),
      ractions: f => { f = f || {}; const b = B();
        let l = b.actions.filter(a => peut(b.suites.find(s => s.code === a.rencontre)));
        if (f.rencontre) l = l.filter(a => a.rencontre === f.rencontre); if (f.statut === "ouvertes") l = l.filter(a => a.statut !== "fait");
        return wait(l.map(a => { const sv = b.suivis.filter(x => x.actionId === a.id && x.avancement).sort((x, y) => (y.le || "").localeCompare(x.le || ""))[0];
          return { id: a.id, rencontre: a.rencontre, serie: b.suites.find(s => s.code === a.rencontre).nom, texte: a.texte, responsable: respNom(a), echeance: a.echeance, statut: a.statut, depuis: a.depuis, fermeLe: a.fermeLe,
            enRetard: a.statut !== "fait" && !!a.echeance && a.echeance < today(), dernierAvancement: sv ? sv.avancement : null, tenueOrigine: a.tenueOrigine }; })
          .sort((x, y) => (x.echeance || "9999").localeCompare(y.echeance || "9999") || x.id - y.id)); }
    };
  }
  function seedB() {
    const b = { suites: [], tenues: [], points: [], actions: [], suivis: [], seq: { t: 0, p: 0, a: 0 } };
    b.suites.push({ code: "SDEMO", nom: "Suivi hebdo avec le VP (démo)", frequence: "Hebdomadaire", dureeMin: 60, participants: "Gary Doyon, VP Opérations", prive: true, proprietaireId: 1, acces: [], actif: true });
    const mkT = (ago, extra) => { const t = Object.assign({ id: ++b.seq.t, rencontre: "SDEMO", date: iso(ago), titre: "Suivi hebdo avec le VP", heureDebut: "13:00", heureFin: "14:00", lieu: "Salle de conférence", projet: "Production", redacteur: "Gary Doyon", prochaine: iso(ago - 7), presents: "Gary Doyon\nVP Opérations", absents: null, divers: null, tags: "production, suivi-hebdo", animeePar: 1 }, extra || {}); b.tenues.push(t); return t; };
    const mkP = (t, l) => l.forEach(([sujet, responsable, discussion, decisions], i) => b.points.push({ id: ++b.seq.p, tenueId: t.id, ordre: i + 1, sujet, responsable, dureeMin: null, objectif: null, discussion, decisions, reporte: false }));
    const t1 = mkT(14);
    mkP(t1, [["Moteurs et approvisionnement", "Gary Doyon", "Commande de conteneur à préparer; risque de surplus sur deux modèles.", "Valider la simulation avant la commande."], ["Panneaux et qualité", "Contremaître Panneaux", "Reprises après test en hausse sur les relais.", null]]);
    b.actions.push({ id: ++b.seq.a, rencontre: "SDEMO", tenueOrigine: t1.id, pointId: 1, texte: "Valider la simulation des frames avec la planificatrice", responsableId: 1, responsableTexte: null, echeance: iso(10), statut: "cours", depuis: t1.date, fermeLe: null });
    b.actions.push({ id: ++b.seq.a, rencontre: "SDEMO", tenueOrigine: t1.id, pointId: 2, texte: "Pareto des reprises après test du mois", responsableId: 3, responsableTexte: null, echeance: iso(0), statut: "cours", depuis: t1.date, fermeLe: null });
    const t2 = mkT(7);
    mkP(t2, [["Moteurs et approvisionnement", "Gary Doyon", "Simulation présentée; commande ajustée.", null], ["Panneaux et qualité", "Contremaître Panneaux", null, null]]);
    b.suivis.push({ actionId: 1, tenueId: t2.id, avancement: "Simulation faite, commande passée avec un modèle partagé moitié-moitié.", statut: "fait", echeance: iso(10), responsable: "Gary Doyon", texte: b.actions[0].texte, le: iso(7) });
    b.actions[0].statut = "fait"; b.actions[0].fermeLe = t2.date;
    b.suivis.push({ actionId: 2, tenueId: t2.id, avancement: "Données extraites, graphique à faire.", statut: "cours", echeance: iso(0), responsable: "Contremaître Panneaux", texte: b.actions[1].texte, le: iso(7) });
    b.actions.push({ id: ++b.seq.a, rencontre: "SDEMO", tenueOrigine: t2.id, pointId: null, texte: "Préparer la rencontre avec les chefs (rôles et délégation)", responsableId: null, responsableTexte: "Gary", echeance: iso(-3), statut: "cours", depuis: t2.date, fermeLe: null });
    return b;
  }
}

/* Implémentation Supabase : lecture par les vues, écriture par les fonctions (RPC) qui appliquent les règles. */
function supabaseApi(cfg) {
  if (!window.supabase || !window.supabase.createClient) throw new Error("La librairie Supabase n'a pas pu être chargée (connexion Internet?).");
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const ok = ({ data, error }) => { if (error) throw new Error(error.message || "Erreur Supabase"); return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args || {}));
  const mapE = r => ({ id: r.id, no: r.no, dateEcart: r.date_ecart, equipeOrigine: r.equipe_origine, equipeCourante: r.equipe_courante, strateCourante: r.strate_courante, dept: r.dept, cat: r.cat, typeId: r.type_id, type: r.type, titre: r.titre, poste: r.poste, noFab: r.no_fab, minutes: r.minutes, cout: Number(r.cout) || 0, description: r.description, statut: r.statut, cause: r.cause, causeDetail: r.cause_detail, solution: r.solution, strateReglement: r.strate_reglement, dateReglement: r.date_reglement, procedureModifiee: r.procedure_modifiee, procedureNom: r.procedure_nom, dateRetourLu: r.date_retour_lu, ageJours: r.age_jours, nbActions: r.nb_actions, nbActionsOuvertes: r.nb_actions_ouvertes, collaborateurs: r.collaborateurs || [], etiquettes: r.etiquettes || [], nbPieces: r.nb_pieces || 0, archive: !!r.archive });
  const mapA = r => ({ id: r.id, ecartId: r.ecart_id, sujetId: r.sujet_id, horizon: r.horizon, texte: r.texte, responsable: r.responsable, responsableId: r.responsable_id, resultat: r.resultat, echeance: r.echeance, statut: r.statut, noEcart: r.no_ecart, dept: r.dept, enRetard: r.en_retard });
  const mapS = r => ({ id: r.id, rencontre: r.rencontre, titre: r.titre, responsable: r.responsable, statut: r.statut, prochaineRevue: r.prochaine_revue, notes: r.notes || [] });
  const mapT = r => ({ id: r.id, rencontre: r.rencontre, debut: r.debut, dureeMin: r.duree_min, decisions: r.decisions, animeePar: r.animee_par });
  const mapR = r => ({ id: r.id, rencontre: r.rencontre, serie: r.serie, texte: r.texte, responsable: r.responsable, echeance: r.echeance, statut: r.statut, depuis: r.depuis, fermeLe: r.ferme_le, enRetard: r.en_retard, dernierAvancement: r.dernier_avancement, tenueOrigine: r.tenue_origine });
  const BUCKET = "ecart-fichiers";
  const propre = q => String(q || "").replace(/[,()*%\\]/g, " ").trim();
  return {
    mode: "supabase",
    session: async () => ok(await sb.auth.getSession()).session,
    connexion: async (email, mdp) => ok(await sb.auth.signInWithPassword({ email, password: mdp })),
    deconnexion: async () => { await sb.auth.signOut(); },
    moi: () => rpc("moi"),
    referentiels: () => rpc("referentiels"),
    rencontres: () => rpc("rencontres"),
    ecarts: async f => { f = f || {}; let q = sb.from("v_ecart").select("*");
      if (f.dept) q = q.eq("dept", f.dept);
      if (f.statut === "actifs") q = q.neq("statut", "Ferme"); else if (f.statut) q = q.eq("statut", f.statut);
      if (f.strate) q = q.eq("strate_courante", Number(f.strate));
      if (f.equipe) q = q.eq("equipe_courante", f.equipe);
      if (f.cat) q = q.eq("cat", f.cat);
      if (f.depuis) q = q.gte("date_ecart", f.depuis);
      if (f.vue === "registre") q = q.eq("archive", false); else if (f.vue === "archives") q = q.eq("archive", true);
      if (f.etiquette) q = q.contains("etiquettes", [f.etiquette]);
      if (f.annee) q = q.gte("date_ecart", f.annee + "-01-01").lte("date_ecart", f.annee + "-12-31");
      const t = propre(f.q); if (t) q = q.or(`titre.ilike.*${t}*,description.ilike.*${t}*,no.ilike.*${t}*,no_fab.ilike.*${t}*`);
      return ok(await q.order("date_ecart", { ascending: false }).order("id", { ascending: false }).limit(2000)).map(mapE); },
    ecart: async id => { id = Number(id);
      const [e, a, m] = await Promise.all([sb.from("v_ecart").select("*").eq("id", id).maybeSingle(), sb.from("v_action").select("*").eq("ecart_id", id).order("echeance"), sb.from("v_mouvement").select("*").eq("ecart_id", id).order("id")]);
      const r = ok(e); if (!r) throw new Error("Écart introuvable");
      return Object.assign(mapE(r), { actions: ok(a).map(mapA), mouvements: ok(m).map(x => ({ date: x.date, genre: x.genre, texte: x.texte, par: x.par })) }); },
    creerEcart: d => rpc("creer_ecart", { p: d }),
    creerEcartComplet: d => rpc("creer_ecart_complet", { p: d }),
    pieces: async id => { const l = ok(await sb.from("v_piece").select("*").eq("ecart_id", Number(id)).order("ajoute_le"));
      const ch = l.filter(x => x.chemin).map(x => x.chemin); const urls = {};
      if (ch.length) { const r = await sb.storage.from(BUCKET).createSignedUrls(ch, 3600); if (r.error) throw new Error(r.error.message); (r.data || []).forEach(u => { if (u.path) urls[u.path] = u.signedUrl; }); }
      return l.map(x => ({ id: x.id, ecartId: x.ecart_id, type: x.type, nom: x.nom, taille: x.taille, mime: x.mime, ajouteLe: x.ajoute_le, ajoutePar: x.ajoute_par, ajouteParId: x.ajoute_par_id, url: x.chemin ? urls[x.chemin] || null : x.url })); },
    ajouterFichier: async (id, file, type) => {
      const nom = (file.name || "fichier").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80);
      const chemin = `ecarts/${Number(id)}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${nom}`;
      const up = await sb.storage.from(BUCKET).upload(chemin, file, { contentType: file.type || undefined, upsert: false });
      if (up.error) throw new Error(/size|exceed|too large/i.test(up.error.message) ? "Fichier trop lourd : la limite est de 50 Mo." : /mime|type/i.test(up.error.message) ? "Seules les photos et les vidéos sont acceptées." : up.error.message);
      try { return await rpc("ajouter_piece", { p_ecart: Number(id), p: { type, chemin, nom: file.name } }); }
      catch (err) { await sb.storage.from(BUCKET).remove([chemin]); throw err; } },
    ajouterLien: (id, url, nom) => rpc("ajouter_piece", { p_ecart: Number(id), p: { type: "lien", url, nom } }),
    retirerPiece: async pid => { const chemin = await rpc("retirer_piece", { p_id: Number(pid) }); if (chemin) await sb.storage.from(BUCKET).remove([chemin]); return null; },
    majEtiquettes: (id, tags) => rpc("maj_etiquettes", { p_id: Number(id), p_tags: tags }),
    etiquettes: () => rpc("etiquettes"),
    fichiersInfo: () => rpc("fichiers_info"),
    majArchiveJours: n => rpc("maj_archive_jours", { p_jours: Number(n) }),
    croixSecurite: (dept, mois) => rpc("croix_securite", { p_dept: dept, p_mois: mois + "-01" }),
    saisirSecurite: (dept, jour, niveau, note) => rpc("saisir_securite", { p_dept: dept, p_jour: jour, p_niveau: niveau || null, p_note: note || null }),
    rapportsPbi: () => rpc("rapports_pbi"),
    rapportsRencontre: code => rpc("rapports_rencontre", { p_code: code }),
    lierRapports: (code, ids) => rpc("lier_rapports", { p_code: code, p_ids: ids }),
    ajouterRapport: d => rpc("ajouter_rapport", { p: d }),
    majRapport: (id, d) => rpc("maj_rapport", { p_id: Number(id), p: d }),
    retirerRapport: id => rpc("retirer_rapport", { p_id: Number(id) }),
    traiterEcart: (id, d) => rpc("traiter_ecart", { p_id: Number(id), p: d }),
    escalader: (id, d) => rpc("escalader_ecart", { p_id: Number(id), p_raison: d.raison, p_texte: d.texte }),
    regler: (id, d) => rpc("regler_ecart", { p_id: Number(id), p: d }),
    retourLu: id => rpc("retour_lu", { p_id: Number(id) }),
    actions: async f => { f = f || {}; let q = sb.from("v_action").select("*");
      if (f.responsable) q = q.eq("responsable", f.responsable);
      if (f.statut === "ouvertes") q = q.in("statut", ["AFaire", "EnCours"]); else if (f.statut === "retard") q = q.eq("en_retard", true);
      if (f.dept) q = q.eq("dept", f.dept);
      return ok(await q.order("echeance", { ascending: true }).limit(2000)).map(mapA); },
    majAction: (id, d) => rpc("maj_action", { p_id: Number(id), p_statut: d.statut }),
    majActionDetail: (id, d) => rpc("maj_action_detail", { p_id: Number(id), p: d }),
    mesNotifications: () => rpc("mes_notifications"),
    marquerLues: ids => rpc("marquer_notifications_lues", { p_ids: ids || null }),
    tenues: async code => ok(await sb.from("v_tenue").select("*").eq("rencontre", code).order("debut", { ascending: false }).limit(3)).map(mapT),
    creerTenue: (code, d) => rpc("creer_tenue", { p_code: code, p_debut: d.debut || new Date().toISOString(), p_duree: d.dureeMin, p_decisions: d.decisions }),
    sujets: async code => { let q = sb.from("v_sujet").select("*"); if (code) q = q.eq("rencontre", code); return ok(await q.order("id")).map(mapS); },
    creerSujet: d => rpc("creer_sujet", { p: d }),
    majSujet: (id, d) => rpc("maj_sujet", { p_id: Number(id), p: d }),
    kpi: dept => rpc("kpi_liste", { p_dept: dept || null }),
    majCible: (code, d) => rpc("maj_cible", { p_code: code, p_cible: Number(d.cible) }),
    saisirKpi: (code, d) => rpc("saisir_kpi", { p_code: code, p_debut: d.date, p_valeur: d.valeur === null || d.valeur === "" ? null : Number(d.valeur) }),
    majBareme: d => rpc("maj_bareme", { p_min: Number(d.minutesMin), p_cout: Number(d.coutMin), p_secu: !!d.securiteToujours }),
    creerType: d => rpc("creer_type", { p_cat: d.cat, p_nom: d.nom }),
    majType: (id, d) => rpc("maj_type", { p_id: Number(id), p_actif: !!d.actif }),
    ajouterPersonne: d => rpc("ajouter_personne", { p: d }),
    purgerDemo: () => rpc("purger_demo"),
    journal: async f => { f = f || {}; let q = sb.from("v_journal").select("*");
      if (f.table) q = q.eq("table_nom", f.table);
      if (f.lignes) q = q.in("ligne", f.lignes.map(String));
      if (f.par) q = q.eq("par", f.par);
      if (f.depuis) q = q.gte("le", f.depuis);
      return ok(await q.order("le", { ascending: false }).limit(f.limite || 100)); },
    suites: () => rpc("suites"),
    tenuesSuite: code => rpc("tenues", { p_code: code }),
    creerSerie: d => rpc("creer_serie", { p: d }),

    bilan: id => rpc("bilan", { p_tenue: Number(id) }),
    majTenue: (id, d) => rpc("maj_tenue", { p_id: Number(id), p: d }),

    supprimerRaction: id => rpc("supprimer_raction", { p_id: Number(id) }),
    ractions: async f => { f = f || {}; let q = sb.from("v_raction").select("*");
      if (f.rencontre) q = q.eq("rencontre", f.rencontre);

    exportCsvUrl: () => null
  };

<script>
/* Suites de rencontres et bilans (fusion de l'app « Rencontres EBI »).
   Une suite regroupe des rencontres répétées (ex. Suivi hebdo avec Julien). Chaque rencontre a un bilan :
   informations, présents, points (objectif, discussion, décisions), actions nouvelles et suivi des actions ouvertes.
   Les suites sont privées par défaut : seuls le propriétaire et les personnes invitées les voient (règle appliquée par la base). */
"use strict";

let SUITES = [], BIL = null, BCONF = null, BRACT = null;
const BST = { cours: "En cours", bloque: "Bloqué", fait: "Fait" };
const fmtL = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "";
const bOpt = v => Object.entries(BST).map(([k, l]) => `<option value="${k}" ${v === k ? "selected" : ""}>${l}</option>`).join("");
const bAttr = (k, id, f, t) => `data-b="${k}" data-id="${id}" data-f="${f}"${t !== undefined ? ` data-t="${t}"` : ""}`;
const dlPers = () => `<datalist id="dl-pers">${(REF.personnes || []).map(p => `<option value="${esc(p.nom)}"></option>`).join("")}</datalist>`;
const lignes = s => String(s || "").split(/\n/).map(x => x.trim()).filter(Boolean);
const confid = s => s.prive ? (s.acces && s.acces.length ? `Privée · ${esc(s.proprietaire || "")} et ${s.acces.map(p => esc(p.nom)).join(", ")}` : `Privée · visible par ${s.estProprietaire ? "toi" : esc(s.proprietaire || "le propriétaire")} seulement`) : "Visible par tous les membres du DMS";
const stOf = (a, t) => a.suivi ? a.suivi.statut : (a.fermeLe && a.fermeLe > t.date ? "cours" : a.statut);
const ufR = () => (ui.fR = ui.fR || { statut: "ouvertes", suite: "" });

async function chargerSuites() { SUITES = Api.suites ? await Api.suites() : []; return SUITES; }

/* ---------- Liste de gauche ---------- */
function suitesAside() {
  if (!Api.suites) return "";

/* ---------- Enregistrement automatique ---------- */
const bTimers = new Map();
function setEtat(m, bad) { const e = $("#b-etat"); if (e) { e.textContent = m; e.classList.toggle("bad", !!bad); } }
function bSave(el) {
  const k = el.dataset.b, id = el.dataset.id, f = el.dataset.f; const v = el.value;
  if (el.dataset.v === v) return Promise.resolve();
  el._p = (el._p || Promise.resolve()).then(async () => {
    if (el.dataset.v === v) return;
    setEtat("Enregistrement…");
    try {
      const d = { [f]: f === "dureeMin" ? (v === "" ? "" : Number(v)) : v };
      if (k === "tenue") await Api.majTenue(id, d);
      else if (k === "point") await Api.majPoint(id, d);
      else if (k === "ract") await Api.majRaction(id, el.dataset.t || null, d);
      el.dataset.v = v;
      setEtat("Enregistré à " + new Date().toLocaleTimeString("fr-CA", { hour: "2-digit", minute: "2-digit" }));
      if (k === "ract" && f === "statut") { const r = el.closest("[data-st]"); if (r) r.dataset.st = v; if (el.dataset.rr) { chargerSuites(); render(); } }
      if (k === "tenue" && f === "date") render();
    } catch (err) { setEtat("Non enregistré : " + err.message, true); alertBox(err.message); }
  });
  return el._p;
}
async function bFlush() { const l = [...bTimers.entries()]; bTimers.clear(); for (const [el, h] of l) { clearTimeout(h); await bSave(el); } }

/* ---------- Changements, exports ---------- */
function bChangements(b) {
  const t = b.tenue, acts = b.actions.filter(a => !a.nouveau);
  const g = { regle: [], bloque: [], avance: [], sans: [] };
  acts.forEach(a => { const st = stOf(a, t); if (st === "fait") g.regle.push(a); else if (st === "bloque") g.bloque.push(a); else if (a.suivi && a.suivi.avancement) g.avance.push(a); else g.sans.push(a); });
  const nouv = b.actions.filter(a => a.nouveau);
  const bloc = (l, titre, cls) => `<div class="chg"><h3><span class="pill ${cls}">${l.length}</span> ${titre}</h3>${l.length ? `<ul>${l.map(a => `<li><strong>${esc(a.texte.length > 160 ? a.texte.slice(0, 157) + "…" : a.texte)}</strong><span class="small muted"> · ${esc(a.responsable || "sans responsable")}</span>${a.suivi && a.suivi.avancement ? `<div class="small">${esc(a.suivi.avancement)}</div>` : ""}</li>`).join("")}</ul>` : `<div class="small muted">Aucune.</div>`}</div>`;
  return `<h2>Changements depuis ${b.precedente ? "le " + fmtD(b.precedente.date) : "le début"}</h2>
   ${bloc(g.regle, "Réglées", "ok")}${bloc(g.avance, "Avancées", "lvl")}${bloc(g.bloque, "Bloquées", "bad")}${bloc(nouv, "Nouvelles", "warn")}${bloc(g.sans, "Sans changement", "neutral")}
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" type="button" data-act="close">Fermer</button></div>`;
}
function bMarkdown(b, obsidian) {
  const t = b.tenue, L = [], q = s => `"${String(s || "").replace(/"/g, "'")}"`;
  const tags = String(t.tags || "").split(/[,;]/).map(x => x.trim().replace(/\s+/g, "-")).filter(Boolean);
  if (obsidian) L.push("---", `titre: ${q(t.titre || b.serie.nom)}`, `date: ${t.date}`, `serie: ${q(b.serie.nom)}`, `lieu: ${q(t.lieu)}`, `projet: ${q(t.projet)}`, `redacteur: ${q(t.redacteur)}`, ...(t.prochaine ? [`prochaine: ${t.prochaine}`] : []), `tags: [${tags.join(", ")}]`, "---", "");
  L.push(`# ${t.titre || b.serie.nom} — ${fmtL(t.date)}`, "");
  const meta = [t.heureDebut || t.heureFin ? `**Heure** : ${t.heureDebut || ""}${t.heureFin ? " à " + t.heureFin : ""}` : "", t.lieu ? `**Lieu** : ${t.lieu}` : "", t.projet ? `**Projet** : ${t.projet}` : "", t.redacteur ? `**Rédacteur** : ${t.redacteur}` : "", t.prochaine ? `**Prochaine rencontre** : ${fmtL(t.prochaine)}` : ""].filter(Boolean);
  if (meta.length) L.push(meta.join("  \n"), "");
  if (lignes(t.presents).length) L.push(`**Présents** : ${lignes(t.presents).join(", ")}`);
  if (lignes(t.absents).length) L.push(`**Absents** : ${lignes(t.absents).join(", ")}`);
  L.push("");
  const act = (a, st, av, resp, ech) => { L.push(`- [${st === "fait" ? "x" : " "}] ${a.texte.replace(/\n+/g, " ")} — *${resp || "sans responsable"}*${ech ? `, échéance ${ech}` : ""} · **${BST[st]}**`); if (av) L.push(`  - Avancement : ${av.replace(/\n+/g, " ")}`); };
  const suivis = b.actions.filter(a => !a.nouveau);
  if (suivis.length) { L.push("## Suivi des actions", ""); suivis.forEach(a => act(a, stOf(a, t), a.suivi && a.suivi.avancement, a.suivi ? a.suivi.responsable : a.responsable, a.suivi ? a.suivi.echeance : a.echeance)); L.push(""); }
  if (b.points.length) L.push("## Points", "");
  b.points.forEach((p, i) => {

    if (p.decisions) L.push("**Décisions**", "", p.decisions, "");
    const acts = b.actions.filter(a => a.nouveau && a.pointId === p.id);
    if (acts.length) { L.push("**Actions**", ""); acts.forEach(a => act(a, a.statut, null, a.responsable, a.echeance)); L.push(""); }
  });
  const autres = b.actions.filter(a => a.nouveau && !b.points.some(p => p.id === a.pointId));
  if (autres.length) { L.push("## Autres actions", ""); autres.forEach(a => act(a, a.statut, null, a.responsable, a.echeance)); L.push(""); }
  if (t.divers) L.push("## Divers", "", t.divers, "");
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}
