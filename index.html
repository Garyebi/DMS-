async function bEditRact(id, code) {
  if (typeof raEdit === "function" && RENC.some(r => r.code === code)) return raEdit(id, code);
  const ts = await Api.tenuesSuite(code), last = ts[0];
  let a = null, tid = null;
  if (last) { const b = await Api.bilan(last.id); a = b.actions.find(x => x.id === id) || null; if (a) tid = last.id; }
  if (!a) { const r = (await Api.ractions({ rencontre: code })).find(x => x.id === id); if (!r) throw new Error("Action introuvable."); a = Object.assign({}, r, { suivi: null, prec: null }); }
  const s = a.suivi || {}, resp = a.suivi ? s.responsable : a.responsable, ech = a.suivi ? s.echeance : a.echeance, st = a.statut;
  BRACT = { id, tid, orig: { texte: a.texte, responsable: resp || "", echeance: ech || "", statut: st, avancement: s.avancement || "" } };
  const prec = a.prec && a.prec.avancement ? `<div class="full small muted bil-prec">Au ${fmtD(a.prec.date)} : ${esc(a.prec.avancement)}</div>` : "";
  modal(`<h2>Modifier l'action</h2>${dlPers()}<form id="f-ract" class="form"><label class="full" for="ra-t">Action<textarea id="ra-t" rows="3" required>${esc(a.texte)}</textarea></label>
   <label for="ra-r">Responsable<input id="ra-r" list="dl-pers" value="${esc(resp || "")}"></label><label for="ra-e">Échéance<input id="ra-e" type="date" value="${esc(ech || "")}"></label>
   <label for="ra-s">Statut<select id="ra-s">${bOpt(st)}</select></label><div></div>
   ${tid ? `${prec}<label class="full" for="ra-av">Avancement inscrit au bilan du ${fmtD(last.date)}<textarea id="ra-av" rows="3">${esc(s.avancement || "")}</textarea></label>
   <div class="full small muted">L'avancement s'ajoute au bilan de la dernière rencontre de la suite. Une action mise à « Fait » ici est fermée en date d'aujourd'hui.</div>` : `<div class="full small muted">Cette action n'est plus suivie dans la dernière rencontre : l'avancement s'inscrit dans un bilan.</div>`}
   <div id="ra-msg" class="full"></div><div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
}

/* ---------- Événements ---------- */
document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act^='b-']"); if (!a || a.disabled) return; const act = a.dataset.act;
  try {
    if (act === "b-suite") { await bFlush(); ui.suite = a.dataset.code; ui.tenue = null; ui.run = null; render(); }
    else if (act === "b-goto" && RENC.some(r => r.code === a.dataset.code)) { ui.suite = null; ui.tenue = null; ui.meeting = a.dataset.code; if (route() === "rencontres") render(); else location.hash = "rencontres"; }
    else if (act === "b-goto") { ui.suite = a.dataset.code; ui.tenue = null; if (route() === "rencontres") render(); else location.hash = "rencontres"; }
    else if (act === "b-new-suite") bNouvelleSuite();
    else if (act === "b-edit-ract") await bEditRact(Number(a.dataset.id), a.dataset.code);
    else if (act === "b-params") bParams(SUITES.find(s => s.code === ui.suite));
    else if (act === "b-open") { await bFlush(); ui.tenue = Number(a.dataset.id); await render(); window.scrollTo(0, 0); }
    else if (act === "b-back") { await bFlush(); ui.tenue = null; await chargerSuites(); render(); }
    else if (act === "b-new-tenue") modal(`<h2>Nouvelle rencontre</h2><form id="f-tenue" class="form"><label for="nt-date">Date<input id="nt-date" type="date" value="${isoToday()}" required></label>
       <div class="full small muted">Les informations et les points de la dernière rencontre sont repris. Les actions ouvertes se reportent automatiquement dans le suivi.</div>
       <div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Créer</button></div></form>`);
    else if (act === "b-add-pt") { await bFlush(); const id = await Api.ajouterPoint(ui.tenue, {}); await render(); const el = document.querySelector(`[data-b="point"][data-id="${id}"][data-f="sujet"]`); if (el) el.focus(); }
    else if (act === "b-up" || act === "b-down") { await bFlush(); await Api.deplacerPoint(a.dataset.id, act === "b-up" ? -1 : 1); render(); }
    else if (act === "b-del-pt") bConfirm("Retirer ce point?", "Le point et son contenu seront retirés de ce bilan. Ses actions restent dans la liste.", async () => { await Api.supprimerPoint(a.dataset.id); });
    else if (act === "b-del-act") bConfirm("Retirer cette action?", "L'action et son historique de suivi seront retirés.", async () => { await Api.supprimerRaction(a.dataset.id); });
    else if (act === "b-del-tenue") bConfirm("Retirer cette rencontre?", "Le bilan, ses points et les actions créées à cette rencontre seront retirés. Les autres rencontres de la suite restent.", async () => { await Api.supprimerTenue(ui.tenue); ui.tenue = null; await chargerSuites(); });
    else if (act === "b-ok") { const fn = BCONF; BCONF = null; closeModal(); await bFlush(); if (fn) await fn(); render(); }
    else if (act === "b-add-act") { const box = a.closest(".bil-add"); const texte = box.querySelector(".na-t").value.trim();
      if (!texte) { box.querySelector(".na-t").focus(); return; }
      await bFlush(); await Api.ajouterRaction(ui.tenue, { texte, responsable: box.querySelector(".na-r").value.trim(), echeance: box.querySelector(".na-e").value, pointId: Number(a.dataset.point) || null }); await render();
      const nb = document.querySelector(`.bil-add[data-point="${a.dataset.point}"] .na-t`); if (nb) nb.focus(); }
    else if (act === "b-hist") { await bFlush(); const b = await Api.bilan(ui.tenue);
      const [t, p, ac] = await Promise.all([Api.journal({ table: "rencontre_tenue", lignes: [b.tenue.id], limite: 200 }), b.points.length ? Api.journal({ table: "bilan_point", lignes: b.points.map(x => x.id), limite: 300 }) : [], b.actions.length ? Api.journal({ table: "raction", lignes: b.actions.map(x => x.id), limite: 300 }) : []]);
      const l = [...t, ...p, ...ac].sort((x, y) => (y.le || "").localeCompare(x.le || ""));
      modal(`<h2>Historique des modifications</h2><p class="small muted">Ce bilan, ses points et ses actions : qui, quand, avant et après.</p>${journalTable(l)}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" type="button" data-act="close">Fermer</button></div>`); }
    else if (act === "b-chg") { await bFlush(); modal(bChangements(await Api.bilan(ui.tenue))); }
    else if (act === "b-md") { await bFlush(); const md = bMarkdown(await Api.bilan(ui.tenue), false);
      try { await navigator.clipboard.writeText(md); setEtat("Bilan copié en Markdown."); }
      catch (e) { modal(`<h2>Bilan en Markdown</h2><textarea id="md-out" style="width:100%;min-height:340px;font-family:ui-monospace,monospace;font-size:.85rem">${esc(md)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><span class="small muted">Sélectionnez puis Ctrl+C.</span><button class="btn" type="button" data-act="close">Fermer</button></div>`); $("#md-out").select(); } }
    else if (act === "b-obs") { await bFlush(); const b = await Api.bilan(ui.tenue); const url = URL.createObjectURL(new Blob([bMarkdown(b, true)], { type: "text/markdown;charset=utf-8" }));
      const l = document.createElement("a"); l.href = url; l.download = bFichier(b); document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); setEtat("Fichier " + bFichier(b) + " téléchargé."); }
    else if (act === "b-pdf") { await bFlush(); const b = await Api.bilan(ui.tenue); let pa = $("#print-area"); if (!pa) { pa = document.createElement("div"); pa.id = "print-area"; document.body.appendChild(pa); }
      pa.innerHTML = bPrintHtml(b); document.body.classList.add("printing"); const prev = document.title; document.title = bFichier(b).replace(/\.md$/, "");
      setTimeout(() => { window.print(); document.title = prev; document.body.classList.remove("printing"); }, 50); }
  } catch (err) { alertBox(err.message); }
});
document.addEventListener("input", ev => { const el = ev.target; if (!el.dataset || !el.dataset.b || el.tagName === "SELECT" || el.type === "date") return;
  clearTimeout(bTimers.get(el)); bTimers.set(el, setTimeout(() => { bTimers.delete(el); bSave(el); }, 1200)); setEtat("Modifications en cours…"); });
document.addEventListener("change", ev => { const el = ev.target;
  if (el.dataset && el.dataset.b) { clearTimeout(bTimers.get(el)); bTimers.delete(el); bSave(el); return; }
  if (el.id === "fr-suite") { ufR().suite = el.value; render(); } else if (el.id === "fr-statut") { ufR().statut = el.value; render(); } });
document.addEventListener("submit", async ev => {
  const id = ev.target.id; if (!["f-suite", "f-params", "f-tenue", "f-ract"].includes(id)) return; ev.preventDefault();
  try {
    if (id === "f-suite") { const code = await Api.creerSerie({ nom: $("#ns-nom").value, frequence: $("#ns-freq").value, participants: $("#ns-part").value, prive: $("#ns-prive").checked });
      await chargerSuites(); ui.suite = code; ui.tenue = null; closeModal(); if (route() === "rencontres") render(); else location.hash = "rencontres"; }
    if (id === "f-params") { const code = ui.suite; await Api.majSerie(code, { nom: $("#sp-nom").value, frequence: $("#sp-freq").value, participants: $("#sp-part").value, prive: $("#sp-prive").checked });
      await Api.partagerSerie(code, [...document.querySelectorAll(".sp-acc:checked")].map(x => Number(x.value))); await chargerSuites(); closeModal(); render(); }
    if (id === "f-ract") { const r = BRACT, o = r.orig, d = {};
      const v = { texte: $("#ra-t").value.trim(), responsable: $("#ra-r").value.trim(), echeance: $("#ra-e").value, statut: $("#ra-s").value };
      if (!v.texte) { formErr("ra-msg", "Décrivez l'action."); return; }
      for (const k in v) if (v[k] !== o[k]) d[k] = v[k];
      const av = $("#ra-av") ? $("#ra-av").value.trim() : o.avancement;
      if (r.tid && av !== o.avancement) await Api.majRaction(r.id, r.tid, { avancement: av });
      if (Object.keys(d).length) await Api.majRaction(r.id, null, d);
      BRACT = null; closeModal(); await chargerSuites(); render(); }
    if (id === "f-tenue") { const tid = await Api.nouvelleTenue(ui.suite, $("#nt-date").value); closeModal(); await chargerSuites(); ui.tenue = Number(tid); await render(); window.scrollTo(0, 0); }
  } catch (err) { const m = $("#ns-msg") || $("#sp-msg") || $("#ra-msg"); if (m) formErr(m.id, err.message); else alertBox(err.message); }
});
window.addEventListener("beforeunload", ev => { if (bTimers.size) { bFlush(); ev.preventDefault(); ev.returnValue = ""; } });

</script>
<script>
/* Photos, vidéos et liens joints aux écarts; étiquettes; vue Archives.
   Les fichiers vont dans un espace privé : seuls les membres du DMS les voient, par des liens temporaires (1 h). */
"use strict";

const MAX_FICHIER = 50 * 1048576;
let ETIQ = [], P_FICHIERS = [];
const tailleTxt = o => o == null ? "" : o >= 1073741824 ? (o / 1073741824).toFixed(o % 1073741824 ? 1 : 0).replace(".", ",") + " Go" : o >= 1048576 ? (o / 1048576).toFixed(1).replace(".", ",") + " Mo" : Math.max(1, Math.round(o / 1024)) + " Ko";
const typeFichier = f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp|avi)$/i.test(f.name) ? "video" : "photo";

/* Réduit une photo à 1600 px de côté (JPEG) avant l'envoi; laisse le fichier tel quel si le navigateur ne sait pas le lire. */
async function compresserImage(file, max = 1600, q = 0.82) {
  if (/gif$/i.test(file.type)) return file;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("illisible")); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    if (k === 1 && file.size < 700 * 1024) return file;
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}

/* Envoie des fichiers un à un; renvoie la liste des erreurs (le reste est enregistré). */
async function envoyerFichiers(ecartId, files, progres) {
  const errs = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i], type = typeFichier(f);
    if (progres) progres(`Envoi ${i + 1} de ${files.length} : ${f.name}…`);
    try {
      const fic = type === "photo" ? await compresserImage(f) : f;
      if (fic.size > MAX_FICHIER) throw new Error(`${tailleTxt(fic.size)}, la limite est de 50 Mo. Raccourcissez la vidéo (environ 30 secondes) ou ajoutez plutôt un lien Teams ou SharePoint.`);
      await Api.ajouterFichier(ecartId, fic, type);
    } catch (err) { errs.push(`${f.name} : ${err.message}`); }
  }
  return errs;
}

/* ---------- Étiquettes ---------- */
async function chargerEtiquettes() { ETIQ = Api.etiquettes ? await Api.etiquettes() : []; return ETIQ; }
const dlEtiq = () => `<datalist id="dl-etiq">${ETIQ.map(t => `<option value="${esc(t.nom)}"></option>`).join("")}</datalist>`;
const chipsEtiq = (l, small) => (l || []).map(t => `<span class="chip${small ? " sm" : ""}">${esc(t)}</span>`).join("");

/* ---------- Sections de la fiche d'un écart ---------- */
async function sectionsEcart(e) {
  if (!Api.pieces) return "";
  const [pieces] = await Promise.all([Api.pieces(e.id), chargerEtiquettes()]);
  const peutRetirer = p => p.ajouteParId === ME.id || ME.admin;
  const vignette = p => {
    const del = peutRetirer(p) ? `<button class="pj-del" type="button" data-act="p-del" data-id="${p.id}" data-ecart="${e.id}" aria-label="Retirer ${esc(p.nom)}" title="Retirer">✕</button>` : "";
    const info = `<div class="pj-i small muted">${esc(p.ajoutePar || "")} · ${fmtD((p.ajouteLe || "").slice(0, 10))}${p.taille ? " · " + tailleTxt(p.taille) : ""}</div>`;
    if (p.type === "photo") return `<figure class="pj">${del}<a href="${esc(p.url || "#")}" target="_blank" rel="noopener" title="Ouvrir en grand"><img src="${esc(p.url || "")}" alt="${esc(p.nom)}" loading="lazy"></a>${info}</figure>`;
    if (p.type === "video") return `<figure class="pj">${del}<video src="${esc(p.url || "")}" controls preload="metadata" playsinline></video>${info}</figure>`;
    return `<figure class="pj pj-lien">${del}<a href="${esc(p.url)}" target="_blank" rel="noopener">🔗 ${esc(p.nom)}</a>${info}</figure>`;
  };
  return `<h3 style="margin-top:12px">Étiquettes</h3>${dlEtiq()}
   <div class="etiq-ed" data-ecart="${e.id}">${(e.etiquettes || []).map(t => `<span class="chip">${esc(t)}<button type="button" data-act="p-tag-del" data-ecart="${e.id}" data-tag="${esc(t)}" aria-label="Retirer l'étiquette ${esc(t)}">✕</button></span>`).join("")}
    <input id="p-tag" list="dl-etiq" maxlength="40" placeholder="Ajouter : client, projet, fournisseur, garantie…" aria-label="Nouvelle étiquette"><button class="btn small" type="button" data-act="p-tag-add" data-ecart="${e.id}">Ajouter</button></div>
   <h3 style="margin-top:12px">Photos, vidéos et liens (${pieces.length})</h3>
   ${pieces.length ? `<div class="pj-grid">${pieces.map(vignette).join("")}</div>` : `<div class="small muted">Aucune pièce jointe.</div>`}
   <div class="pj-add"><label class="btn small" for="p-file">📷 Photo ou vidéo<input id="p-file" type="file" accept="image/*,video/*" multiple data-ecart="${e.id}" class="sr-file"></label>
    <input id="p-url" type="url" placeholder="https://… (Teams, SharePoint, OneDrive)" aria-label="Lien"><input id="p-urlnom" maxlength="80" placeholder="Nom du lien (facultatif)" aria-label="Nom du lien"><button class="btn small" type="button" data-act="p-lien" data-ecart="${e.id}">Ajouter le lien</button></div>
   <div id="p-msg" class="small" role="status"></div>`;
}

/* ---------- Champs à la création d'un écart ---------- */
function champsCreation() {
  if (!Api.ajouterFichier) return "";
  P_FICHIERS = [];
  return `<div class="full"><div class="small muted" style="margin-bottom:4px">Photos ou vidéos (facultatif)</div>
   <div class="pj-add"><label class="btn small" for="n-files">📷 Ajouter des photos ou vidéos<input id="n-files" type="file" accept="image/*,video/*" multiple class="sr-file"></label><span id="n-files-l" class="small muted"></span></div>
   <div class="small muted" style="margin-top:3px">Les photos sont réduites automatiquement. Vidéos : 50 Mo au plus, environ 30 secondes.</div></div>
   <label class="full" for="n-tags">Étiquettes (facultatif, séparées par des virgules)${dlEtiq()}<input id="n-tags" list="dl-etiq" maxlength="300" placeholder="Ex. Client Cardinal, Garantie"></label>`;
}
async function apresCreation(id, msgId) {
  const tags = ($("#n-tags") ? $("#n-tags").value : "").split(",").map(t => t.trim()).filter(Boolean);
  const errs = [];
  if (tags.length) { try { await Api.majEtiquettes(id, tags); } catch (err) { errs.push("Étiquettes : " + err.message); } }
  if (P_FICHIERS.length) errs.push(...await envoyerFichiers(id, P_FICHIERS, m => { const el = document.getElementById(msgId); if (el) el.innerHTML = `<div class="notice">${esc(m)}</div>`; }));
  P_FICHIERS = [];
  return errs;
}

/* ---------- Vue Archives et filtre d'étiquettes (onglet Écarts) ---------- */
function filtresArchives(f) {
  const ans = []; for (let y = new Date().getFullYear(); y >= 2026; y--) ans.push([String(y), String(y)]);
  return `<select id="fe-etiq" aria-label="Étiquette">${opt([["", "Toutes les étiquettes"], ...ETIQ.map(t => [t.nom, `${t.nom} (${t.n})`])], f.etiquette || "")}</select>
   ${f.vue === "archives" ? `<select id="fe-annee" aria-label="Année">${opt([["", "Toutes les années"], ...ans], f.annee || "")}</select>` : ""}`;
}
function ongletsEcarts(f) {
  return `<div class="seg" role="tablist" aria-label="Vue"><button type="button" role="tab" data-act="p-vue" data-vue="registre" aria-selected="${f.vue !== "archives"}">Registre</button><button type="button" role="tab" data-act="p-vue" data-vue="archives" aria-selected="${f.vue === "archives"}">Archives</button></div>`;
}

/* ---------- Réglages (Administration) ---------- */
async function carteFichiers() {
  if (!Api.fichiersInfo) return "";
  const i = await Api.fichiersInfo(); const pct = Math.min(100, Math.round(100 * i.octets / i.limiteOctets));
  return `<div class="card"><h3>Archives et fichiers</h3>
   <p class="small muted" style="margin:4px 0 10px">Un écart fermé passe aux archives après ce délai. Il reste consultable dans Écarts, vue « Archives », avec tout son historique.</p>
   <div class="row"><label for="ad-arch" class="small">Délai avant l'archivage (jours)</label><input id="ad-arch" type="number" min="1" max="3650" value="${i.archiveJours}" style="width:90px" ${ME.admin ? "" : "disabled"}>${ME.admin ? `<button class="btn small" type="button" data-act="p-arch">Enregistrer</button>` : ""}<span id="ad-arch-msg" class="small"></span></div>
   <div style="margin-top:12px" class="small">Espace utilisé par les photos et vidéos : <strong>${tailleTxt(i.octets) || "0 Ko"}</strong> sur ${tailleTxt(i.limiteOctets)} (${i.nb} fichier(s))${i.demo ? " · mode démonstration" : ""}</div>
   <div class="jauge" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Espace utilisé"><span style="width:${pct}%" class="${pct >= 80 ? "bad" : ""}"></span></div>
   ${pct >= 80 ? `<div class="notice warn" style="margin-top:8px">L'espace approche de la limite du forfait gratuit de Supabase. Préférez les liens Teams ou SharePoint pour les vidéos, ou passez au forfait Pro.</div>` : ""}</div>`;
}

/* ---------- Événements ---------- */
async function majTags(id, fn) { const e = await Api.ecart(id); await Api.majEtiquettes(id, fn(e.etiquettes || [])); await openDetail(id); }
document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act^='p-']"); if (!a || a.disabled) return; const act = a.dataset.act;
  try {
    if (act === "p-vue") { ui.fE.vue = a.dataset.vue; if (ui.fE.vue === "archives") ui.fE.statut = ""; else if (!ui.fE.statut) ui.fE.statut = "actifs"; render(); }
    else if (act === "p-del") { if (!confirmerRetrait(a)) return; await Api.retirerPiece(a.dataset.id); await openDetail(Number(a.dataset.ecart)); render(); }
    else if (act === "p-lien") { const url = $("#p-url").value.trim(); if (!url) { $("#p-url").focus(); return; } await Api.ajouterLien(Number(a.dataset.ecart), url, $("#p-urlnom").value.trim()); await openDetail(Number(a.dataset.ecart)); render(); }
    else if (act === "p-tag-add") { const t = $("#p-tag").value.trim(); if (!t) { $("#p-tag").focus(); return; } await majTags(Number(a.dataset.ecart), l => [...l, t]); render(); }
    else if (act === "p-tag-del") { const t = a.dataset.tag; await majTags(Number(a.dataset.ecart), l => l.filter(x => x !== t)); render(); }
    else if (act === "p-arch") { await Api.majArchiveJours(Number($("#ad-arch").value)); $("#ad-arch-msg").textContent = "Enregistré."; }
  } catch (err) { const m = $("#p-msg") || $("#ad-arch-msg"); if (m) m.innerHTML = `<span class="err-txt">${esc(err.message)}</span>`; else alertBox(err.message); }
});
/* Retrait d'une pièce : deuxième clic pour confirmer, sans fenêtre bloquante */
function confirmerRetrait(b) { if (b.dataset.ok) return true; b.dataset.ok = "1"; b.textContent = "Retirer?"; b.classList.add("conf"); setTimeout(() => { if (b.isConnected) { delete b.dataset.ok; b.textContent = "✕"; b.classList.remove("conf"); } }, 3000); return false; }
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "p-tag") { ev.preventDefault(); const b = document.querySelector("[data-act='p-tag-add']"); if (b) b.click(); } });
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.id === "fe-etiq") { ui.fE.etiquette = el.value; render(); }
  else if (el.id === "fe-annee") { ui.fE.annee = el.value; render(); }
  else if (el.id === "n-files") { P_FICHIERS = [...P_FICHIERS, ...el.files]; el.value = ""; $("#n-files-l").textContent = P_FICHIERS.map(f => f.name + (f.size ? ` (${tailleTxt(f.size)})` : "")).join(", "); }
  else if (el.id === "p-file") { const id = Number(el.dataset.ecart), files = [...el.files]; if (!files.length) return;
    const errs = await envoyerFichiers(id, files, m => { const p = $("#p-msg"); if (p) p.textContent = m; });
    await openDetail(id); render(); if (errs.length) { const p = $("#p-msg"); if (p) p.innerHTML = errs.map(x => `<div class="err-txt">${esc(x)}</div>`).join(""); } }
});

</script>
<script>
/* Rapports Power BI intégrés dans l'onglet Tableaux de bord.
   Intégration sécurisée de Power BI (Fichier > Incorporer le rapport > Site web ou portail) : chaque personne se connecte
   avec son compte Microsoft et ne voit que ce que Power BI lui permet de voir. Aucune API à construire. */
"use strict";

let PBI = [];

/* Accepte le lien d'intégration, le code <iframe> ou le lien ordinaire d'un rapport, et renvoie le lien d'intégration. */
function lienIntegration(txt) {
  txt = String(txt || "").trim();
  const m = txt.match(/src\s*=\s*["']([^"']+)["']/i); if (m) txt = m[1];
  txt = txt.replace(/&amp;/g, "&");
  let u; try { u = new URL(txt); } catch (e) { return null; }
  if (u.protocol !== "https:" || u.hostname.toLowerCase() !== "app.powerbi.com") return null;
  if (/^\/reportembed$/i.test(u.pathname)) { if (!u.searchParams.has("autoAuth")) u.searchParams.set("autoAuth", "true"); return u.toString(); }
  const r = u.pathname.match(/\/groups\/([^/]+)\/(?:apps\/([^/]+)\/)?reports\/([0-9a-f-]{36})(?:\/([^/?#]+))?/i);
  if (r) {
    const e = new URL("https://app.powerbi.com/reportEmbed"); e.searchParams.set("reportId", r[3]);
    if (r[2]) e.searchParams.set("appId", r[2]); else if (r[1].toLowerCase() !== "me") e.searchParams.set("groupId", r[1]);
    e.searchParams.set("autoAuth", "true"); const ct = u.searchParams.get("ctid"); if (ct) e.searchParams.set("ctid", ct);
    if (r[4] && !/^ReportSection$/i.test(r[4])) e.searchParams.set("pageName", r[4]);
    return e.toString();
  }
  return u.toString();
}

function ongletsTB() {
  if (!Api.rapportsPbi) return "";
  return `<div class="seg" role="tablist" aria-label="Vue"><button type="button" role="tab" data-act="pb-vue" data-vue="dms" aria-selected="${ui.tbVue !== "pbi"}">Indicateurs DMS</button><button type="button" role="tab" data-act="pb-vue" data-vue="pbi" aria-selected="${ui.tbVue === "pbi"}">Rapports Power BI</button></div>`;
}

async function vPowerBI() {
  PBI = await Api.rapportsPbi();
  const peut = r => r.estProprietaire || ME.admin;
  const btn = r => `<button type="button" class="meet-item" data-act="pb-voir" data-id="${r.id}" aria-pressed="${ui.pbi === r.id}"><span class="n">${esc(r.nom)}</span>${r.portee === "moi" ? ` <span class="pill neutral">Moi</span>` : ""}</button>`;
  const groupes = [[null, "Général"], ...REF.departements.map(d => [d.code, d.nom])].map(([c, l]) => { const l2 = PBI.filter(r => r.portee === "tous" && (r.dept || null) === c); return l2.length ? `<div class="dept">${esc(l)}</div>${l2.map(btn).join("")}` : ""; }).join("");
  const miens = PBI.filter(r => r.portee === "moi");
  const aside = `${groupes}${miens.length ? `<div class="dept">Mes rapports</div>${miens.map(btn).join("")}` : ""}<button class="btn small" type="button" data-act="pb-new" style="margin-top:6px">+ Ajouter un rapport</button>`;
  if (!PBI.some(r => r.id === ui.pbi)) ui.pbi = PBI.length ? PBI[0].id : null;
  const r = PBI.find(x => x.id === ui.pbi);
  const aide = `<ol class="small" style="margin:6px 0 0;padding-left:18px;line-height:1.6"><li>Dans Power BI (app.powerbi.com), ouvrez le rapport.</li><li>Fichier > Incorporer le rapport > <strong>Site web ou portail</strong> (pas « Publier sur le web », qui rend le rapport public).</li><li>Copiez le lien proposé, puis « + Ajouter un rapport » ici. Le lien ordinaire du rapport fonctionne aussi.</li></ol>`;
  const main = r ? `<div class="meet-head"><div><h2>${esc(r.nom)}</h2><div class="meta"><span>${esc(r.dept ? deptNom(r.dept) : "Général")}</span><span>${r.portee === "tous" ? "Visible par tous les membres" : "Visible par moi seulement"}</span>${r.proprietaire ? `<span>Ajouté par ${esc(r.proprietaire)}</span>` : ""}</div></div>
      <div class="row"><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Ouvrir dans Power BI ↗</a>${peut(r) ? `<button class="btn" type="button" data-act="pb-edit" data-id="${r.id}">Modifier</button><button class="btn" type="button" data-act="pb-del" data-id="${r.id}">Retirer</button>` : ""}</div></div>
     <div class="pbi-cadre"><iframe title="${esc(r.nom)}" src="${esc(r.url)}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
     <p class="small muted" style="margin-top:6px">La première fois, Power BI peut demander de se connecter avec le compte Microsoft d'EBI. L'accès suit les permissions et les licences Power BI de chaque personne.</p>`
    : `<div class="card"><h3>Aucun rapport Power BI pour l'instant</h3><p class="small muted" style="margin:4px 0 0">Les rapports existants (Fidelio) et ceux à venir s'affichent ici, dans le portail.</p>${aide}<button class="btn primary" type="button" data-act="pb-new" style="margin-top:10px">+ Ajouter un rapport</button></div>`;
  return `<div class="row between"><div class="row"><h2>Tableaux de bord</h2>${ongletsTB()}</div></div>
   <div class="layout-meet" style="margin-top:12px"><aside class="meet-list" aria-label="Rapports Power BI">${aside}</aside><section>${main}</section></div>`;
}

function formRapport(r) {
  modal(`<h2>${r ? "Modifier le rapport" : "Ajouter un rapport Power BI"}</h2><form id="f-pbi" class="form" data-id="${r ? r.id : ""}">
   <label class="full" for="pb-nom">Nom<input id="pb-nom" maxlength="100" required value="${esc(r ? r.nom : "")}" placeholder="Ex. Heures par projet (Fidelio)"></label>
   <label class="full" for="pb-url">Lien Power BI<textarea id="pb-url" rows="3" required placeholder="https://app.powerbi.com/reportEmbed?reportId=…">${esc(r ? r.url : "")}</textarea></label>
   <div class="full small muted" id="pb-conv">Collez le lien de Fichier > Incorporer le rapport > Site web ou portail, le code &lt;iframe&gt;, ou le lien ordinaire du rapport.</div>
   <label for="pb-dept">Département<select id="pb-dept">${opt([["", "Général"], ...REF.departements.map(d => [d.code, d.nom])], r ? r.dept || "" : "")}</select></label>
   <label for="pb-portee">Visible par<select id="pb-portee" ${ME.admin ? "" : "disabled"}>${opt([["moi", "Moi seulement"], ["tous", "Tous les membres du DMS"]], r ? r.portee : (ME.admin ? "tous" : "moi"))}</select></label>
   <div id="pb-msg" class="full"></div><div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
}

document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act^='pb-']"); if (!a || a.disabled) return; const act = a.dataset.act;
  try {
    if (act === "pb-vue") { ui.tbVue = a.dataset.vue; render(); }
    else if (act === "pb-voir") { ui.pbi = Number(a.dataset.id); render(); }
    else if (act === "pb-new") formRapport(null);
    else if (act === "pb-edit") formRapport(PBI.find(r => r.id === Number(a.dataset.id)));
    else if (act === "pb-del") { if (!a.dataset.ok) { a.dataset.ok = "1"; a.textContent = "Confirmer le retrait"; a.classList.add("danger"); setTimeout(() => { if (a.isConnected) { delete a.dataset.ok; a.textContent = "Retirer"; a.classList.remove("danger"); } }, 3000); return; }
      await Api.retirerRapport(Number(a.dataset.id)); ui.pbi = null; render(); }
  } catch (err) { alertBox(err.message); }
});
document.addEventListener("input", ev => { if (ev.target.id !== "pb-url") return; const c = $("#pb-conv"); if (!c) return; const v = ev.target.value.trim(); if (!v) return;
  const l = lienIntegration(v); c.innerHTML = l ? `Lien reconnu ✓` : `<span class="err-txt">Ce lien ne vient pas de Power BI (https://app.powerbi.com/…).</span>`; });
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "f-pbi") return; ev.preventDefault();
  const id = Number(ev.target.dataset.id) || null; const url = lienIntegration($("#pb-url").value);
  if (!url) { formErr("pb-msg", "Ce lien ne vient pas de Power BI. Dans Power BI : Fichier > Incorporer le rapport > Site web ou portail."); return; }
  const d = { nom: $("#pb-nom").value.trim(), url, dept: $("#pb-dept").value, portee: $("#pb-portee").value };
  try { const nid = id ? (await Api.majRapport(id, d), id) : await Api.ajouterRapport(d); ui.pbi = Number(nid); ui.tbVue = "pbi"; closeModal(); render(); }
  catch (err) { formErr("pb-msg", err.message); }
});

/* ---------- Rapports Power BI attachés à une rencontre ---------- */
const slotPbi = code => (Api.rapportsRencontre ? `<div class="pbi-slot" data-code="${esc(code)}"></div>` : "");
async function remplirPbi(slot, force) {
  if (slot.dataset.ok && !force) return; slot.dataset.ok = "1";
  const code = slot.dataset.code;
  try {
    const d = await Api.rapportsRencontre(code); slot._d = d;
    if (!d.rapports.length) { slot.innerHTML = d.peutLier ? `<div class="pbi-vide"><span class="small muted">Aucun rapport Power BI dans cette rencontre.</span><button class="btn small" type="button" data-act="pb-lier" data-code="${esc(code)}">+ Ajouter un rapport Power BI</button></div>` : ""; return; }
    slot.innerHTML = `<details class="pbi-renc" ${ui.pbiFerme && ui.pbiFerme[code] ? "" : "open"} data-code="${esc(code)}"><summary><strong>Rapports Power BI (${d.rapports.length})</strong> <span class="small muted">· cliquez sur un rapport pour l'agrandir</span></summary>
      <div class="pbi-minis">${d.rapports.map(r => `<div class="pbi-mini"><div class="pbi-mini-cadre"><iframe title="${esc(r.nom)}" src="${esc(r.url)}" tabindex="-1" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <button type="button" class="pbi-mini-btn" data-act="pb-grand" data-code="${esc(code)}" data-id="${r.id}" aria-label="Agrandir ${esc(r.nom)} en plein écran"><span>⤢ Agrandir</span></button></div><div class="pbi-mini-t">${esc(r.nom)}</div></div>`).join("")}
       ${d.peutLier ? `<button class="btn small pbi-mini-aj" type="button" data-act="pb-lier" data-code="${esc(code)}">Choisir les rapports</button>` : ""}</div></details>`;
  } catch (err) { slot.innerHTML = `<div class="small err-txt">Rapports Power BI : ${esc(err.message)}</div>`; }
}
new MutationObserver(() => document.querySelectorAll(".pbi-slot:not([data-ok])").forEach(s => remplirPbi(s))).observe(document.documentElement, { childList: true, subtree: true });
document.addEventListener("toggle", ev => { const d = ev.target; if (!d.classList || !d.classList.contains("pbi-renc")) return; ui.pbiFerme = ui.pbiFerme || {}; ui.pbiFerme[d.dataset.code] = !d.open; }, true);

async function choisirRapports(code) {
  const slot = document.querySelector(`.pbi-slot[data-code="${CSS.escape(code)}"]`), d = (slot && slot._d) || await Api.rapportsRencontre(code);
  const tous = await Api.rapportsPbi(), choisis = d.rapports.map(r => r.id);
  const permis = r => r.portee === "tous" || (d.prive && r.estProprietaire);
  modal(`<h2>Rapports Power BI de cette rencontre</h2><form id="f-pblier" class="form" data-code="${esc(code)}">
   <div class="full">${tous.length ? `<div class="collabs">${tous.map(r => `<label class="check" for="pl-${r.id}"><input type="checkbox" id="pl-${r.id}" class="pl-r" value="${r.id}" ${choisis.includes(r.id) ? "checked" : ""} ${permis(r) ? "" : "disabled"}>${esc(r.nom)}${r.portee === "moi" ? ` <span class="pill neutral">Moi</span>` : ""}</label>`).join("")}</div>` : `<div class="small muted">Aucun rapport Power BI enregistré. Ajoutez-en d'abord dans Tableaux de bord > Rapports Power BI.</div>`}</div>
   ${tous.some(r => !permis(r)) ? `<div class="full small muted">Un rapport visible par vous seulement ne peut pas être montré dans une rencontre partagée.</div>` : ""}
   <div class="full small muted">L'ordre de la liste devient l'ordre des onglets. Chaque participant voit le rapport selon ses propres permissions Power BI.</div>
   <div id="pl-msg" class="full"></div><div class="full row" style="justify-content:flex-end"><a class="btn" href="#tableaux" data-act="pb-aller">Gérer les rapports</a><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
}
function pleinEcran(code, id) {
  const slot = document.querySelector(`.pbi-slot[data-code="${CSS.escape(code)}"]`), l = (slot && slot._d && slot._d.rapports) || []; const r = l.find(x => x.id === id); if (!r) return;
  fermerPlein(); const ov = document.createElement("div"); ov.className = "pbi-full"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", r.nom);
  ov.innerHTML = `<div class="pbi-full-h"><div class="seg" role="tablist" aria-label="Rapports">${l.map(x => `<button type="button" role="tab" data-act="pb-grand" data-code="${esc(code)}" data-id="${x.id}" aria-selected="${x.id === r.id}">${esc(x.nom)}</button>`).join("")}</div>
    <div class="row"><a class="btn small" href="${esc(r.url)}" target="_blank" rel="noopener">Ouvrir dans Power BI ↗</a><button class="btn small primary" type="button" data-act="pb-fermer">Fermer ✕</button></div></div>
    <iframe title="${esc(r.nom)}" src="${esc(r.url)}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  document.body.appendChild(ov); document.body.classList.add("pbi-ouvert"); ov.querySelector("[data-act='pb-fermer']").focus();
}
function fermerPlein() { const o = document.querySelector(".pbi-full"); if (o) o.remove(); document.body.classList.remove("pbi-ouvert"); }
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && document.querySelector(".pbi-full")) { ev.stopPropagation(); fermerPlein(); } }, true);
document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act='pb-rtab'], [data-act='pb-lier'], [data-act='pb-aller'], [data-act='pb-grand'], [data-act='pb-fermer']"); if (!a) return;
  if (a.dataset.act === "pb-grand") { pleinEcran(a.dataset.code, Number(a.dataset.id)); return; }
  if (a.dataset.act === "pb-fermer") { fermerPlein(); return; }
  try {
    if (a.dataset.act === "pb-rtab") { ui.pbiR = ui.pbiR || {}; ui.pbiR[a.dataset.code] = Number(a.dataset.id); const s = a.closest(".pbi-slot"); if (s) remplirPbi(s, true); }
    else if (a.dataset.act === "pb-lier") await choisirRapports(a.dataset.code);
    else if (a.dataset.act === "pb-aller") { closeModal(); ui.tbVue = "pbi"; }
  } catch (err) { alertBox(err.message); }
});
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "f-pblier") return; ev.preventDefault();
  const code = ev.target.dataset.code, ids = [...document.querySelectorAll(".pl-r:checked")].map(x => Number(x.value));
  try { await Api.lierRapports(code, ids); closeModal(); document.querySelectorAll(`.pbi-slot[data-code="${CSS.escape(code)}"]`).forEach(s => remplirPbi(s, true)); }
  catch (err) { formErr("pl-msg", err.message); }
});

</script>
<script>
/* Croix de sécurité : une case par jour du mois, en forme de croix, par département.
   Couleur automatique selon les écarts de sécurité du jour (le plus grave l'emporte), corrigeable à la main. */
"use strict";

const CX = { vert: "Aucun événement", jaune: "Quasi-accident ou situation dangereuse", orange: "Blessure mineure (premiers soins)", rouge: "Accident avec arrêt de travail", neutre: "Jour non travaillé", futur: "À venir" };
const CX_ORDRE = ["vert", "jaune", "orange", "rouge", "neutre"];
const moisCourant = () => (ui.cxMois = ui.cxMois || isoToday().slice(0, 7));
const moisTxt = m => new Date(m + "-15T12:00:00").toLocaleDateString("fr-CA", { month: "long", year: "numeric" });
const moisPlus = (m, n) => { const d = new Date(m + "-15T12:00:00"); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 7); };
const jourTxt = j => new Date(j + "T12:00:00").toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long" });

/* Emplacement à remplir après l'affichage (la croix se charge elle-même). */
const slotCroix = (depts, titre, somme) => (Api.croixSecurite ? `<div class="cx-slot" data-depts="${esc(depts.join(","))}"${somme && depts.length > 1 ? ` data-somme="1"` : ""}${titre ? ` data-titre="${esc(titre)}"` : ""}><div class="small muted">Chargement de la croix de sécurité…</div></div>` : "");

/* Rangée et colonne de chaque case de la croix (grille 7 × 7, bras de 3 cases). */
const CX_CASES = (() => { const l = []; for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) if ((c >= 2 && c <= 4) || (r >= 2 && r <= 4)) l.push([r, c]); return l; })();

/* Croix combinée : chaque jour prend la couleur la plus grave des départements. */
const CX_RANG = { futur: 0, neutre: 1, vert: 2, jaune: 3, orange: 4, rouge: 5 };
function croixSomme(l) {
  const jours = l[0].jours.map((j0, i) => { const tous = l.map(c => Object.assign({ dept: c.dept }, c.jours[i]));
    const niveau = tous.reduce((m, j) => CX_RANG[j.niveau] > CX_RANG[m] ? j.niveau : m, "futur");
    return { jour: j0.jour, niveau, auto: niveau, manuel: null, ecarts: tous.flatMap(j => j.ecarts.map(e => Object.assign({ dept: j.dept }, e))), parDept: tous.map(j => ({ dept: j.dept, niveau: j.niveau, manuel: j.manuel })) }; });
  const dr = l.map(c => c.depuisRouge).filter(x => x != null);
  return { dept: "USINE", nom: l.map(c => deptNom(c.dept)).join(", "), mois: l[0].mois, jours, depuisRouge: dr.length ? Math.min(...dr) : null, somme: true };
}
function croixHtml(c) {
  const today = isoToday(), cases = [];
  CX_CASES.forEach(([r, col], i) => { const j = c.jours[i];
    const pos = `style="grid-row:${r + 1};grid-column:${col + 1}"`;
    if (!j) { cases.push(`<span class="cx cx-vide" ${pos} aria-hidden="true"></span>`); return; }
    const n = Number(j.jour.slice(8)), lbl = `${jourTxt(j.jour)} : ${CX[j.niveau]}${j.manuel ? " (noté à la main)" : ""}${j.ecarts.length ? ` · ${j.ecarts.length} écart(s)` : ""}`;
    cases.push(`<button type="button" class="cx cx-${j.niveau}${j.manuel ? " cx-man" : ""}${j.jour === today ? " cx-auj" : ""}" ${pos} data-act="${c.somme ? "cx-somme" : "cx-jour"}" data-dept="${esc(c.dept)}"${c.somme ? ` data-depts="${esc(c.depts)}"` : ""} data-jour="${j.jour}" ${j.niveau === "futur" ? "disabled" : ""} title="${esc(lbl)}" aria-label="${esc(lbl)}">${n}</button>`);
  });
  const n = k => c.jours.filter(j => j.niveau === k).length;
  const dr = c.depuisRouge == null ? "Aucun accident avec arrêt enregistré" : `<strong>${c.depuisRouge}</strong> jour(s) depuis le dernier accident avec arrêt`;
  return `<div class="cx-bloc${c.somme ? " cx-somme" : ""}"><div class="cx-t">${c.somme ? "Usine (combinée)" : esc(deptNom(c.dept))}</div>${c.somme ? `<div class="small muted" style="margin-top:-4px">${esc(c.nom)} : la couleur la plus grave du jour</div>` : ""}<div class="cx-grille" role="group" aria-label="Croix de sécurité ${c.somme ? "Usine" : esc(deptNom(c.dept))}, ${esc(moisTxt(c.mois))}">${cases.join("")}</div>
   <div class="cx-cpt small"><span class="cx-p cx-vert"></span>${n("vert")} <span class="cx-p cx-jaune"></span>${n("jaune")} <span class="cx-p cx-orange"></span>${n("orange")} <span class="cx-p cx-rouge"></span>${n("rouge")}</div>
   <div class="small muted">${dr}</div></div>`;
}
const legendeCroix = () => `<div class="cx-leg small">${CX_ORDRE.map(k => `<span><span class="cx-p cx-${k}"></span>${CX[k]}</span>`).join("")}<span><span class="cx-p cx-vert cx-man"></span>Noté à la main</span></div>`;

async function remplirCroix(slot) {
  slot.dataset.ok = "1";
  const depts = slot.dataset.depts.split(",").filter(Boolean), m = moisCourant();
  try {
    const l = await Promise.all(depts.map(d => Api.croixSecurite(d, m)));
    if (slot.dataset.somme) { const s = croixSomme(l); s.depts = depts.join(","); l.unshift(s); }
    slot.innerHTML = `<div class="row between cx-nav"><strong>${esc(slot.dataset.titre || "Croix de sécurité")}</strong><span class="row"><button class="btn small" type="button" data-act="cx-mois" data-n="-1" aria-label="Mois précédent">‹</button><span class="cx-mois">${esc(moisTxt(m))}</span><button class="btn small" type="button" data-act="cx-mois" data-n="1" aria-label="Mois suivant" ${m >= isoToday().slice(0, 7) ? "disabled" : ""}>›</button></span></div>
      <div class="cx-liste">${l.map(croixHtml).join("")}</div>${legendeCroix()}`;
  } catch (err) { slot.innerHTML = `<div class="err-txt small">Croix de sécurité : ${esc(err.message)}</div>`; }
}
function remplirToutes(force) { document.querySelectorAll(".cx-slot").forEach(s => { if (force || !s.dataset.ok) remplirCroix(s); }); }
new MutationObserver(() => remplirToutes(false)).observe(document.documentElement, { childList: true, subtree: true });

async function ouvrirSomme(depts, jour) {
  const l = await Promise.all(depts.map(d => Api.croixSecurite(d, jour.slice(0, 7))));
  const lignes = l.map(c => { const j = c.jours.find(x => x.jour === jour) || { niveau: "futur", ecarts: [] };
    return `<tr><td><strong>${esc(deptNom(c.dept))}</strong></td><td><span class="cx-p cx-${j.niveau}"></span>${esc(CX[j.niveau])}${j.manuel ? " <span class='small muted'>(noté à la main)</span>" : ""}${j.note ? `<div class="small muted">${esc(j.note)}</div>` : ""}</td>
      <td class="small">${j.ecarts.map(e => `${esc(e.no)} · ${esc(e.type)}`).join("<br>") || "—"}</td><td>${j.niveau === "futur" ? "" : `<button class="btn small" type="button" data-act="cx-jour" data-dept="${esc(c.dept)}" data-jour="${jour}">Corriger</button>`}</td></tr>`; }).join("");
  modal(`<h2>Usine · ${esc(jourTxt(jour))}</h2><p class="small muted">La croix combinée prend, chaque jour, la couleur la plus grave des départements. Pour la changer, corrigez la journée du département concerné.</p>
   <div class="scroll"><table class="t"><thead><tr><th>Département</th><th>Couleur</th><th>Écarts de sécurité</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" type="button" data-act="close">Fermer</button></div>`);
}
async function ouvrirJour(dept, jour) {
  const c = await Api.croixSecurite(dept, jour.slice(0, 7)); const j = c.jours.find(x => x.jour === jour); if (!j) return;
  const ev = j.ecarts.length ? `<ul class="small" style="margin:4px 0 0;padding-left:18px">${j.ecarts.map(e => `<li><span class="cx-p cx-${e.niveau}"></span>${esc(e.no)} · ${esc(e.type)}${e.poste ? " · " + esc(e.poste) : ""}</li>`).join("")}</ul>` : `<div class="small muted">Aucun écart de sécurité documenté ce jour-là.</div>`;
  modal(`<h2>${esc(deptNom(dept))} · ${esc(jourTxt(jour))}</h2>
   <div class="small">Couleur selon les écarts : <span class="cx-p cx-${j.auto}"></span><strong>${esc(CX[j.auto])}</strong></div>${ev}
   <form id="f-cx" class="form" data-dept="${esc(dept)}" data-jour="${jour}" style="margin-top:10px">
    <fieldset class="full cx-choix"><legend class="small muted">Couleur de la journée</legend>
     <label class="check"><input type="radio" name="cx-n" value="" ${j.manuel ? "" : "checked"}>Automatique (selon les écarts)</label>
     ${CX_ORDRE.map(k => `<label class="check"><input type="radio" name="cx-n" value="${k}" ${j.manuel === k ? "checked" : ""}><span class="cx-p cx-${k}"></span>${CX[k]}</label>`).join("")}</fieldset>
    <label class="full" for="cx-note">Note (facultatif)<input id="cx-note" maxlength="300" value="${esc(j.note || "")}" placeholder="Ex. premiers soins au poste de sertissage, rapport fait"></label>
    ${j.manuel && j.saisiPar ? `<div class="full small muted">Noté par ${esc(j.saisiPar)}.</div>` : ""}
    <div class="full small muted">Pour un événement, documentez aussi un écart de sécurité : la couleur se mettra à jour toute seule.</div>
    <div id="cx-msg" class="full"></div><div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
}

document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act^='cx-']"); if (!a || a.disabled) return;
  try {
    if (a.dataset.act === "cx-mois") { ui.cxMois = moisPlus(moisCourant(), Number(a.dataset.n)); remplirToutes(true); }
    else if (a.dataset.act === "cx-jour") await ouvrirJour(a.dataset.dept, a.dataset.jour);
    else if (a.dataset.act === "cx-somme") await ouvrirSomme(a.dataset.depts.split(","), a.dataset.jour);
  } catch (err) { alertBox(err.message); }
});
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "f-cx") return; ev.preventDefault();
  const f = ev.target, n = (f.querySelector("input[name='cx-n']:checked") || {}).value || null;
  try { await Api.saisirSecurite(f.dataset.dept, f.dataset.jour, n, $("#cx-note").value); closeModal(); remplirToutes(true); }
  catch (err) { formErr("cx-msg", err.message); }
});

</script>
<script>
/* Notifications (cloche) et panneau « Ton action » dans la fiche d'un écart.
   La base crée une notification quand une action est confiée à quelqu'un, quand un écart arrive au niveau d'une équipe
   et quand une solution revient au T1. L'envoi par courriel ou Teams pourra lire la même liste (colonne courriel_le). */
"use strict";

let NOTIF = null;
const ASTAT_OPT = [["AFaire", "À faire"], ["EnCours", "En cours"], ["Fait", "Fait"]];
const ilYa = le => { const m = Math.round((Date.now() - new Date(le).getTime()) / 60000); return m < 60 ? `il y a ${Math.max(1, m)} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : fmtD(String(le).slice(0, 10)); };

async function majCloche() {
  const b = $("#cloche"); if (!b || !Api.mesNotifications) return;
  try { NOTIF = await Api.mesNotifications(); const n = NOTIF.nonLues, r = NOTIF.actions.filter(a => a.enRetard).length + NOTIF.ractions.filter(a => a.enRetard).length;
    b.querySelector(".bell-n").textContent = n || ""; b.querySelector(".bell-n").hidden = !n; b.classList.toggle("retard", !!r);
    b.setAttribute("aria-label", `Notifications : ${n} nouvelle(s)${r ? `, ${r} action(s) en retard` : ""}`); } catch (e) { /* silencieux */ }
}
const clocheHtml = () => Api.mesNotifications ? `<button id="cloche" class="bell" type="button" data-act="nt-open" aria-label="Notifications" title="Mes notifications et mes actions"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg><span class="bell-n" hidden></span></button>` : "";

async function ouvrirNotifs() {
  NOTIF = await Api.mesNotifications(); const N = NOTIF;
  const ligne = (txt, sous, act, attrs, retard) => `<li><button type="button" class="nt-item" data-act="${act}" ${attrs}><span class="nt-t">${txt}</span><span class="small muted">${sous}</span></button>${retard ? `<span class="pill bad">en retard</span>` : ""}</li>`;
  const nouv = N.notifications.filter(n => !n.lue), vues = N.notifications.filter(n => n.lue).slice(0, 10);
  const notif = n => ligne(esc(n.titre), `${esc(n.detail || "")}${n.par ? ` · par ${esc(n.par)}` : ""} · ${ilYa(n.le)}`, "nt-go", `data-id="${n.id}" data-ecart="${n.ecartId || ""}" data-action="${n.actionId || ""}" data-raction="${n.ractionId || ""}" data-renc="${esc(n.rencontre || "")}"`, false);
  const acts = [...N.actions.map(a => ligne(esc(a.texte), `${a.noEcart ? esc(a.noEcart) + " · " : ""}${a.echeance ? "échéance " + fmtD(a.echeance) : "sans échéance"} · ${a.statut === "EnCours" ? "en cours" : "à faire"}`, "nt-go", `data-ecart="${a.ecartId || ""}" data-action="${a.id}"`, a.enRetard)),
    ...N.ractions.map(a => ligne(esc(a.texte), `${esc(a.serie)} · ${a.echeance ? "échéance " + fmtD(a.echeance) : "sans échéance"}`, "nt-go", `data-raction="${a.id}" data-renc="${esc(a.rencontre)}"`, a.enRetard))];
  modal(`<div class="row between"><h2>Mes notifications</h2>${nouv.length ? `<button class="btn small" type="button" data-act="nt-lu">Tout marquer comme lu</button>` : ""}</div>
   <h3>Nouveau (${nouv.length})</h3>${nouv.length ? `<ul class="nt-list">${nouv.map(notif).join("")}</ul>` : `<div class="small muted">Rien de nouveau.</div>`}
   <h3 style="margin-top:12px">Mes actions ouvertes (${acts.length})</h3>${acts.length ? `<ul class="nt-list">${acts.join("")}</ul>` : `<div class="small muted">Aucune action ouverte à votre nom.</div>`}
   <h3 style="margin-top:12px">Écarts à traiter à mon niveau (${N.ecarts.length})</h3>${N.ecarts.length ? `<ul class="nt-list">${N.ecarts.map(e => ligne(`${esc(e.no)} · ${esc(e.titre)}`, `${esc(e.equipe)} · ${fmtD(e.date)}`, "nt-go", `data-ecart="${e.id}"`, false)).join("")}</ul>` : `<div class="small muted">Aucun écart en attente à votre niveau.</div>`}
   ${vues.length ? `<details style="margin-top:12px"><summary class="small">Notifications déjà vues</summary><ul class="nt-list">${vues.map(notif).join("")}</ul></details>` : ""}
   <p class="small muted" style="margin-top:12px">Les notifications s'affichent ici pour l'instant. L'envoi par courriel ou Teams sera branché avec les TI.</p>
   <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Fermer</button></div>`);
}

/* Panneau « Ton action » en haut de la fiche d'un écart */
function panneauActions(e, focusId) {
  const miennes = e.actions.filter(a => (a.id === focusId || a.responsableId === ME.id || a.responsable === ME.nom) && (a.statut !== "Fait" || a.id === focusId));
  if (!miennes.length) return "";
  return `<div class="ton-action" id="ton-action"><h3>${miennes.length > 1 ? "Tes actions sur cet écart" : "Ton action sur cet écart"}</h3>${miennes.map(a => `<form class="ta-form form" data-id="${a.id}" data-ecart="${e.id}">
    <div class="full ta-t"><strong>${esc(a.texte)}</strong> <span class="pill neutral">${esc(a.horizon || "")}</span>${a.enRetard ? ` <span class="pill bad">en retard</span>` : ""}<div class="small muted">Responsable : ${esc(a.responsable || "")}</div></div>
    <label for="ta-s${a.id}">Statut<select id="ta-s${a.id}" name="statut">${opt(ASTAT_OPT, a.statut)}</select></label>
    <label for="ta-e${a.id}">Échéance<input id="ta-e${a.id}" type="date" name="echeance" value="${esc(a.echeance || "")}"></label>
    <label class="full" for="ta-r${a.id}">Ce qui a été fait ou avancé<textarea id="ta-r${a.id}" name="resultat" rows="2" placeholder="Ex. Appel fait au fournisseur, nouvelle date de livraison le 25">${esc(a.resultat || "")}</textarea></label>
    <div class="full row" style="justify-content:flex-end"><span class="small" id="ta-msg${a.id}" role="status"></span><button class="btn" type="submit" name="go" value="maj">Enregistrer</button>${a.statut !== "Fait" ? `<button class="btn primary" type="submit" name="go" value="fait">Marquer comme faite</button>` : ""}</div></form>`).join("")}
   <div class="small muted">Si l'action règle l'écart, utilisez « Régler » en bas de la fiche pour inscrire la solution.</div></div>`;
}

document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act^='nt-'], [data-act='ouvrir-action']"); if (!a) return; const act = a.dataset.act;
  try {
    if (act === "nt-open") await ouvrirNotifs();
    else if (act === "nt-lu") { await Api.marquerLues(null); await ouvrirNotifs(); majCloche(); }
    else if (act === "ouvrir-action") await openDetail(Number(a.dataset.ecart), Number(a.dataset.id));
    else if (act === "nt-go") {
      if (a.dataset.id) { await Api.marquerLues([Number(a.dataset.id)]); majCloche(); }
      if (a.dataset.ecart) await openDetail(Number(a.dataset.ecart), Number(a.dataset.action) || null);
      else if (a.dataset.raction && typeof bEditRact === "function") { closeModal(); if (RENC.some(r => r.code === a.dataset.renc)) { ui.suite = null; ui.meeting = a.dataset.renc; } else ui.suite = a.dataset.renc; ui.tenue = null; if (route() === "rencontres") await render(); else { location.hash = "rencontres"; await new Promise(r => setTimeout(r, 400)); } await bEditRact(Number(a.dataset.raction), a.dataset.renc); }
    }
  } catch (err) { alertBox(err.message); }
});
document.addEventListener("submit", async ev => {
  const f = ev.target; if (!f.classList || !f.classList.contains("ta-form")) return; ev.preventDefault();
  const fait = ev.submitter && ev.submitter.value === "fait", id = Number(f.dataset.id), m = document.getElementById("ta-msg" + id);
  const d = { statut: fait ? "Fait" : f.statut.value, echeance: f.echeance.value, resultat: f.resultat.value };
  if (fait && !d.resultat.trim()) { m.innerHTML = `<span class="err-txt">Écrivez en une phrase ce qui a été fait.</span>`; f.resultat.focus(); return; }
  try { await Api.majActionDetail(id, d); await openDetail(Number(f.dataset.ecart), fait ? null : id); majCloche(); render(); }
  catch (err) { m.innerHTML = `<span class="err-txt">${esc(err.message)}</span>`; }
});
setInterval(() => { if (document.visibilityState === "visible") majCloche(); }, 120000);

</script>
<script>
/* Tournées gemba : standard du leader, grilles de vérification, tournées et observations.
   Une observation « à corriger » devient un écart (si elle atteint le barème) ou une action rapide,
   suivie au caucus T2 du département sous sa lettre SQCDP. */
let GEMBA = null;
const G_THEMES = [["S", "Sécurité"], ["Q", "Qualité"], ["C", "Coûts"], ["D", "Délais"], ["P", "Personnel"], ["5S", "Ordre et propreté (5S)"]];
const G_JOURS = [[1, "L"], [2, "M"], [3, "Me"], [4, "J"], [5, "V"], [6, "S"], [7, "D"]];
const G_RES = [["ok", "OK"], ["corriger", "À corriger"], ["so", "S. O."]];
const gDow = iso => (new Date(iso + "T12:00:00").getDay() + 6) % 7 + 1;
const gAdd = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const gLundi = iso => gAdd(iso, 1 - gDow(iso));
const gGrille = id => (GEMBA ? GEMBA.grilles : []).find(g => g.id === id);
const gPeutStd = s => ME.admin || s.personneId === ME.id;

/* Respect du standard pour la semaine en cours : jours prévus passés (et aujourd'hui) contre jours faits */
function gSemaine(s, tournees) {
  const auj = isoToday(), lundi = gLundi(auj);
  const faits = new Set(tournees.filter(t => t.personneId === s.personneId && t.grilleId === s.grilleId && t.date >= lundi && t.date <= auj).map(t => t.date));
  const jours = G_JOURS.filter(([j]) => j <= 5 || s.jours.includes(j)).map(([j, l]) => {
    const date = gAdd(lundi, j - 1), prevu = s.jours.includes(j) && date >= (s.depuis || ""), fait = faits.has(date);
    const etat = fait ? "fait" : !prevu ? "libre" : date < auj ? "manque" : date === auj ? "jour" : "avenir";
    return { j, l, date, prevu, fait, etat };
  });
  const prevues = jours.filter(d => d.prevu && (d.date < auj || (d.date === auj && d.fait))).length;
  const faites = jours.filter(d => d.prevu && d.fait && d.date <= auj).length;
  return { jours, prevues, faites, pct: prevues ? Math.round(100 * faites / prevues) : null };
}

async function vTournee(id) {

    if (el.dataset.gCom) { const d = { resultat: el.dataset.r, commentaire: el.value }; if (el.dataset.obs) d.obsId = Number(el.dataset.obs); else return;
      await Api.noterObs(ui.gTour, d); }
    else if (el.dataset.gi) { const g = GEMBA.grilles.find(x => x.items.some(i => i.id === Number(el.dataset.gi))), i = g.items.find(x => x.id === Number(el.dataset.gi));
      const d = { id: i.id, theme: i.theme, texte: i.texte, actif: i.actif, ordre: i.ordre }; d[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
      await Api.majGembaItem(d); await gRafraichirGrille(g.id); }
  } catch (err) { alertBox(err.message); }
});

<script>
/* Fiche FAB et avis sur les FAB.
   Un avis prévient les étapes en aval d'un enjeu sur une FAB (ex. révision de dessin à venir : ne pas filer avant).
   Les avis actifs s'affichent d'eux-mêmes dans les rencontres et à l'accueil du département ; la fiche regroupe
   tous les avis et tous les écarts d'une FAB. Plus tard, Midguard ou la cédule pourront afficher l'avis au punch. */
const FAB_ETAPES = { PAN: ["Dessin", "Achats", "Mécanique", "Filage", "Test", "Expédition"], MOT: ["Bobinage", "Assemblage", "Test", "Expédition"], VIS: ["Assemblage", "Programmation", "Test", "Expédition"], DES: ["Dessin"] };
const fabNorm = f => (f || "").trim().toUpperCase();

function avisCard(a, surFiche) {
  const actif = a.statut === "actif";
  return `<div class="avis" data-b="${actif && a.bloquant}" data-st="${a.statut}"><div class="avis-h"><div><strong>FAB ${esc(a.noFab)}</strong> · ${esc(a.titre)}
     ${a.dept ? `<span class="small muted"> · ${esc(deptNom(a.dept))}</span>` : ""}</div>
     <div class="avis-b">${!surFiche ? `<button class="btn small" type="button" data-act="fab-open" data-fab="${esc(a.noFab)}">Fiche FAB</button>` : ""}
     ${actif ? `<button class="btn small" type="button" data-act="fab-lever" data-id="${a.id}">Lever l'avis</button>` : ""}</div></div>
   ${a.etapes.length ? `<div class="avis-et">${actif && a.bloquant ? "<strong>Ne pas commencer avant la levée :</strong> " : "Étapes visées : "}${a.etapes.map(e => `<span class="pill">${esc(e)}</span>`).join(" ")}</div>` : ""}
   ${a.detail ? `<div class="small">${esc(a.detail)}</div>` : ""}
   <div class="small muted">Par ${esc(a.creePar || "")}, ${fmtD(a.creeLe)}${a.ecartId ? ` · <button class="lien-act" type="button" data-act="detail" data-id="${a.ecartId}">voir l'écart</button>` : ""}
   ${!actif ? ` · <strong>Levé</strong> par ${esc(a.levePar || "")}, ${fmtD(a.leveLe)} : ${esc(a.leveNote || "")}` : ""}</div></div>`;
}

/* Bandeau des avis actifs, dans une rencontre ou à l'accueil */
async function avisBandeau(depts) {
  if (!Api.avisFab) return "";
  const l = (await Api.avisFab(null)).filter(a => !depts || !a.dept || depts.includes(a.dept));
  if (!l.length) return "";
  return `<div class="avis-bandeau"><div class="row between"><strong>⚠ ${l.length} avis actif${l.length > 1 ? "s" : ""} sur des FAB</strong><span class="small muted">Vérifiez avant de commencer une étape visée.</span></div>${l.map(a => avisCard(a, false)).join("")}</div>`;
}

async function vFab() {
  if (!Api.avisFab) return `<div class="empty">Les fiches FAB ne sont pas offertes dans ce mode.</div>`;
  const fab = fabNorm(ui.fab);
  const recherche = `<form id="f-fab" class="row" style="gap:8px;margin-bottom:14px"><input id="fab-in" value="${esc(fab)}" placeholder="No de FAB, ex. 26-130-01" aria-label="Numéro de FAB" style="max-width:260px">
    <button class="btn primary" type="submit">Voir la fiche</button>${fab ? `<button class="btn" type="button" data-act="fab-open" data-fab="">Tous les avis actifs</button>` : ""}
    <span style="flex:1"></span><button class="btn" type="button" data-act="fab-new" data-fab="${esc(fab)}">+ Avis sur une FAB</button></form>`;
  if (!fab) {
    const l = await Api.avisFab(null);
    return `<h2 style="margin:0 0 4px">Fiches FAB</h2><p class="small muted" style="margin:0 0 12px">Avant de commencer une étape, cherchez la FAB : vous voyez les avis en cours (révision attendue, matériel, consigne) et tous ses écarts, pour ne pas répéter une erreur faite en amont.</p>
      ${recherche}<div class="card"><h3>Avis actifs (${l.length})</h3>${l.length ? l.map(a => avisCard(a, false)).join("") : `<div class="empty">Aucun avis actif.</div>`}</div>`;
  }
  const [avis, ecarts0] = await Promise.all([Api.avisFab(fab), Api.ecarts({ q: fab })]);
  const ecarts = ecarts0.filter(e => fabNorm(e.noFab) === fab);
  const actifs = avis.filter(a => a.statut === "actif"), leves = avis.filter(a => a.statut !== "actif");
  const lignesE = ecarts.map(e => ecartCard(e, false) + (e.solution ? `<div class="fab-sol small"><strong>Solution${e.strateReglement ? " (T" + e.strateReglement + ")" : ""} :</strong> ${esc(e.solution)}</div>` : "")).join("");
  return `<h2 style="margin:0 0 12px">Fiche FAB ${esc(fab)}</h2>${recherche}
   <div class="card"><div class="row between"><h3>Avis en cours</h3><button class="btn small" type="button" data-act="fab-new" data-fab="${esc(fab)}">+ Ajouter un avis</button></div>
     ${actifs.length ? actifs.map(a => avisCard(a, true)).join("") : `<div class="empty">Aucun avis en cours sur cette FAB.</div>`}</div>
   <div class="card" style="margin-top:14px"><h3>Écarts sur cette FAB (${ecarts.length})</h3><p class="small muted" style="margin:2px 0 8px">Tous les écarts documentés avec ce numéro de FAB, ouverts ou fermés, avec leur solution.</p>
     ${lignesE || `<div class="empty">Aucun écart documenté avec ce numéro de FAB.</div>`}</div>
   ${leves.length ? `<div class="card" style="margin-top:14px"><h3>Avis levés (${leves.length})</h3>${leves.map(a => avisCard(a, true)).join("")}</div>` : ""}`;
}

function fabNouvel(fab, ecartId, dept) {
  const d0 = dept || (myDepts()[0] || "PAN");
  const etapesHtml = dep => (FAB_ETAPES[dep] || FAB_ETAPES.PAN).map(e => `<label><input type="checkbox" name="fa-et" value="${esc(e)}"> ${esc(e)}</label>`).join("");
  modal(`<h2>Avis sur une FAB</h2><form id="f-fab-avis" class="form">
   <label for="fa-fab">No de FAB<input id="fa-fab" required maxlength="30" value="${esc(fab || "")}" placeholder="ex. 26-130-01"></label>
   <label for="fa-d">Département<select id="fa-d">${opt(REF.departements.map(d => [d.code, d.nom]), d0)}</select></label>
   <label class="full" for="fa-t">L'avis en quelques mots<input id="fa-t" required maxlength="120" placeholder="ex. Révision C du dessin à venir"></label>
   <label class="full" for="fa-x">Détail (facultatif)<textarea id="fa-x" rows="2" maxlength="400" placeholder="Ce qui change, qui attendre, où trouver la bonne information"></textarea></label>
   <fieldset class="full g-jours"><legend>Étapes visées</legend><span id="fa-ets">${etapesHtml(d0)}</span><label>Autre <input id="fa-autre" maxlength="40" style="width:140px"></label></fieldset>
   <label class="full"><input type="checkbox" id="fa-b" checked> Ne pas commencer ces étapes tant que l'avis n'est pas levé</label>
   <div class="full small muted">L'avis s'affiche dans les rencontres et à l'accueil du département jusqu'à ce que quelqu'un le lève, en disant pourquoi.</div>
   <div id="fa-msg" class="full"></div><div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Publier l'avis</button></div></form>`);
  $("#fa-d").addEventListener("change", ev => { $("#fa-ets").innerHTML = etapesHtml(ev.target.value); });
  $("#f-fab-avis").addEventListener("submit", async ev => { ev.preventDefault();
    try { const et = [...document.querySelectorAll("[name=fa-et]:checked")].map(x => x.value); if ($("#fa-autre").value.trim()) et.push($("#fa-autre").value.trim());
      await Api.creerAvisFab({ noFab: $("#fa-fab").value, dept: $("#fa-d").value, titre: $("#fa-t").value, detail: $("#fa-x").value, etapes: et, bloquant: $("#fa-b").checked, ecartId: ecartId || null });
      closeModal(); if (route() === "fab") ui.fab = fabNorm($("#fa-fab") ? $("#fa-fab").value : fab); render(); } catch (err) { formErr("fa-msg", err.message); } });
}
function fabLever(id) {
  modal(`<h2>Lever l'avis</h2><form id="f-fab-lever" class="form"><label class="full" for="fl-n">Pourquoi l'avis est levé<input id="fl-n" required maxlength="200" placeholder="ex. Révision C reçue et affichée au filage"></label>
   <div id="fl-msg" class="full"></div><div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Lever l'avis</button></div></form>`);
  $("#f-fab-lever").addEventListener("submit", async ev => { ev.preventDefault();
    try { await Api.leverAvisFab(id, $("#fl-n").value); closeModal(); render(); } catch (err) { formErr("fl-msg", err.message); } });
}

document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act^='fab-']"); if (!a || a.disabled) return; const act = a.dataset.act;
  try {
    if (act === "fab-open") { closeModal(); ui.fab = a.dataset.fab || ""; if (route() === "fab") render(); else location.hash = "fab"; window.scrollTo(0, 0); }
    else if (act === "fab-new") fabNouvel(a.dataset.fab || "", a.dataset.ecart ? Number(a.dataset.ecart) : null, a.dataset.dept || "");
    else if (act === "fab-lever") fabLever(Number(a.dataset.id));
  } catch (err) { alertBox(err.message); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "f-fab" || ev.target.id === "f-fab-top") { ev.preventDefault(); const v = fabNorm(ev.target.querySelector("input").value);
    ui.fab = v; if (route() === "fab") render(); else location.hash = "fab"; }
});

</script>
<script>
/* Fil de suivi, cause précise, récidives et espace du groupe d'amélioration continue (AC).
   Règle : ce qui se compte reste dans des champs fermés (type, cause 6M, cause précise, récidive) ;
   le fil sert à se parler et ne compte pas dans les statistiques. */

/* ---------- Causes précises (3e niveau, liste fermée par type d'écart) ---------- */
async function acRefCauses() { if (Api.causesTypes) REF.causeTypes = await Api.causesTypes(); return REF.causeTypes || []; }
function ctOptions(typeId, sel) {
  const l = (REF.causeTypes || []).filter(c => c.typeId === Number(typeId) && (c.actif || c.id === sel));
  return `<option value="">${l.length ? "Autre, à classer par le groupe AC" : "À classer par le groupe AC"}</option>` + l.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.nom)}</option>`).join("");
}
function ctSync(typeId) { const s = $("#d-ct"); if (s) s.innerHTML = ctOptions(typeId, null); }

/* ---------- Récidives : écarts semblables des 90 derniers jours ---------- */
const acNorm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const acProjet = s => { const m = /(\d\d-\d{3})/.exec(s || ""); return m ? m[1] : ""; };
function semblables(l, d, sauf) {
  const lim = isoPlus(-90), p = acProjet(d.poste) || acProjet(d.noFab), fab = acNorm(d.noFab), poste = acNorm(d.poste);
  return l.filter(e => e.id !== sauf && e.typeId === Number(d.typeId) && e.dateEcart >= lim && !e.recidiveDe && (!d.dateEcart || e.dateEcart <= d.dateEcart))
    .map(e => ({ e, score: (fab && acNorm(e.noFab) === fab ? 4 : 0) + (p && (acProjet(e.poste) === p || acProjet(e.noFab) === p) ? 3 : 0) + (poste && acNorm(e.poste) === poste ? 2 : 0) + (e.dept === d.dept ? 1 : 0) }))
    .filter(x => x.score > 0).sort((a, b) => b.score - a.score || b.e.dateEcart.localeCompare(a.e.dateEcart)).slice(0, 5).map(x => x.e);
}
function recidHtml(cands) {
  if (!cands.length) return "";
  return `<fieldset class="recid"><legend>Écarts semblables des 90 derniers jours : est-ce une récidive ?</legend>
    <label class="check"><input type="radio" name="n-rec" value="" checked> Non, c'est un nouveau problème</label>
    ${cands.map(e => `<label class="check"><input type="radio" name="n-rec" value="${e.id}"> Récidive de <strong>${esc(e.no)}</strong> · ${esc(e.titre)} <span class="muted small">(${fmtD(e.dateEcart)}${e.causeType ? " · " + esc(e.causeType) : ""})</span></label>`).join("")}</fieldset>`;
}
/* Branché sur le formulaire « Documenter un écart » */
async function acNouvelEcart() {
  const typeSel = $("#n-type"); if (!typeSel) return;
  const desc = $("#n-desc"); const zone = document.createElement("div"); zone.className = "full"; zone.id = "n-recid";
  (desc.closest("label") || desc).after(zone);
  const zl = document.createElement("div"); zl.className = "full"; zl.id = "n-lecons"; zone.after(zl);
  const tous = await Api.ecarts({});
  const lire = () => ({ typeId: typeSel.value, poste: ($("#n-poste") || {}).value, noFab: ($("#n-fab") || {}).value, dept: (eq(($("#n-team") || {}).value) || {}).dept, dateEcart: ($("#n-date") || {}).value });
  const maj = () => { const z = $("#n-recid"); if (z) z.innerHTML = recidHtml(semblables(tous, lire(), null)); };
  ["#n-type", "#n-poste", "#n-fab", "#n-team", "#n-date"].forEach(s => { const el = $(s); if (el) { el.addEventListener("change", maj); el.addEventListener("input", maj); } });
  const lecT = () => { const t = $("#n-type"); if (t && typeof lecPourType === "function") lecPourType(t.value); };
  typeSel.addEventListener("change", () => { ctSync(typeSel.value); lecT(); });
  const cat = $("#n-cat"); if (cat) cat.addEventListener("change", () => { ctSync($("#n-type").value); maj(); lecT(); });
  ctSync(typeSel.value); maj(); lecT();
}
/* Après l'enregistrement d'un écart (création ou traitement) : cause précise et récidive */
async function acApresEnregistrement(id) {
  const ct = $("#d-ct"), rec = document.querySelector('input[name="n-rec"]:checked');
  if (ct && ct.dataset.init !== ct.value) await Api.classerCause(id, ct.value ? Number(ct.value) : null);
  if (rec && rec.value) await Api.marquerRecidive(id, Number(rec.value));
}

/* ---------- Fil de suivi d'un écart ---------- */
function acMentions(txt) {
  const out = new Set(); const pers = (REF.personnes || []).filter(p => p.actif !== false);
  (txt.match(/@[\p{L}'’-]+(?:\s[\p{L}'’-]+)?/gu) || []).forEach(tok => {
    const t = acNorm(tok.slice(1)), mots = t.split(/\s+/);
    const p = pers.find(p => acNorm(p.nom) === t) || pers.find(p => acNorm(p.nom).split(/\s+/)[0] === mots[0] && (mots.length < 2 || acNorm(p.nom).includes(mots[1])))
      || pers.find(p => acNorm(p.nom).split(/\s+/)[0] === mots[0]);
    if (p) out.add(p.id);
  });
  return [...out];
}
const FIL_ICO = { creation: "✚", Escalade: "↑", Transfert: "→", Reglement: "✔", RetourLu: "↓", Note: "•", commentaire: "💬", action: "▸" };
async function filHtml(e) {
  if (!Api.commentaires) return "";
  const [coms, jA] = await Promise.all([Api.commentaires(e.id), Api.journal && e.actions.length ? Api.journal({ table: "action", lignes: e.actions.map(x => x.id), limite: 200 }) : []]);
  const ST = { AFaire: "à faire", EnCours: "en cours", Fait: "faite", Annule: "annulée" };
  const evts = [{ le: e.dateEcart + "T00:00:00", genre: "creation", texte: `Écart documenté (vu par ${eq(e.equipeOrigine).nom})` },
    ...e.mouvements.map(m => ({ le: m.le || (m.date + "T00:00:01"), genre: m.genre, texte: m.texte, par: m.par })),
    ...coms.map(c => ({ le: c.le, genre: "commentaire", texte: c.texte, par: c.par, sur: c.action, mentions: c.mentions })),
    ...jA.map(j => { const a = j.apres || j.avant || {}; const t = a.texte || "";
      const txt = j.operation === "Ajout" ? `Action ajoutée : ${t}${a.echeance ? " (échéance " + fmtD(a.echeance) + ")" : ""}`
        : j.operation === "Suppression" ? `Action retirée : ${t}`
        : (j.champs || []).includes("statut") ? `Action « ${t} » : ${ST[a.statut] || a.statut}${a.resultat ? " · " + a.resultat : ""}`
        : `Action « ${t} » modifiée (${(j.champs || []).map(c => JC[c] || c).join(", ")})`;
      return { le: j.le, genre: "action", texte: txt, par: j.par }; })]
    .sort((a, b) => String(b.le).localeCompare(String(a.le)));
  return `<div class="fil" id="fil"><h3 style="margin-top:12px">Fil de suivi <span class="muted small">(${coms.length} commentaire${coms.length > 1 ? "s" : ""})</span></h3>
    <form class="fil-new" data-ecart="${e.id}"><textarea id="fil-t" rows="2" maxlength="1000" placeholder="Écrire au fil… Tapez @ et un prénom pour aviser quelqu'un (ex. @Shane)" aria-label="Commentaire"></textarea>
      <div class="row between" style="gap:8px;flex-wrap:wrap"><label class="small">À propos de <select id="fil-a">${opt([["", "l'écart"], ...e.actions.map(a => [String(a.id), "l'action : " + a.texte.slice(0, 60)])], "")}</select></label>
      <span id="fil-m" class="small muted"></span><button class="btn primary small" type="submit">Publier</button></div><div id="fil-msg"></div></form>
    <ol class="fil-l">${evts.map(v => `<li data-g="${esc(v.genre)}"><span class="fil-i" aria-hidden="true">${FIL_ICO[v.genre] || "•"}</span><div><div>${v.genre === "commentaire" ? `<strong>${esc(v.par || "")}</strong>${v.sur ? ` <span class="muted small">sur l'action « ${esc(v.sur)} »</span>` : ""}<div class="fil-c">${esc(v.texte)}</div>` : esc(v.texte)}</div>
      <div class="small muted">${v.genre !== "commentaire" && v.par ? esc(v.par) + " · " : ""}${String(v.le).length > 10 && !/T00:00:0[01]$/.test(String(v.le)) ? ilYa(v.le) : fmtD(String(v.le).slice(0, 10))}${v.mentions && v.mentions.length ? " · avisé : " + v.mentions.map(esc).join(", ") : ""}</div></div></li>`).join("")}</ol></div>`;
}
document.addEventListener("input", ev => {
  if (ev.target.id !== "fil-t") return; const ids = acMentions(ev.target.value), z = $("#fil-m");
  if (z) z.textContent = ids.length ? "Sera avisé : " + ids.map(i => (REF.personnes.find(p => p.id === i) || {}).nom).join(", ") : "";
});
document.addEventListener("submit", async ev => {
  const f = ev.target.closest(".fil-new"); if (!f) return; ev.preventDefault();
  const id = Number(f.dataset.ecart), t = $("#fil-t").value;
  try { await Api.commenter(id, { texte: t, actionId: $("#fil-a").value || null, mentions: acMentions(t) }); await openDetail(id); const fl = $("#fil"); if (fl) fl.scrollIntoView({ block: "start" }); }
  catch (err) { formErr("fil-msg", err.message); }
});

/* Bandeau « cause précise et récidive » dans la fiche d'un écart */
async function acCauseRecidive(e) {
  if (!Api.marquerRecidive) return "";
  const [de, dem] = await Promise.all([e.recidiveDe ? Api.ecart(e.recidiveDe).catch(() => null) : null, Api.demandesAC ? Api.demandesAC().catch(() => []) : []]);
  const mesD = dem.filter(d => d.ecartId === e.id), enCours = mesD.find(d => d.statut === "recue"), projets = mesD.filter(d => d.statut === "projet");
  const acLigne = !Api.envoyerAC ? "" : `<div><strong>Groupe AC :</strong> ${enCours ? `envoyé le ${fmtD(String(enCours.le).slice(0, 10))} par ${esc(enCours.par || "")}, en attente de décision`
      : projets.length ? projets.map(d => `projet <button class="lien-act" type="button" data-act="ac-a3" data-id="${d.projetId}">« ${esc(d.projet || "")} »</button>`).join(", ")
      : mesD.length ? `non retenu (${esc(mesD[0].decision || "")})` : "non envoyé"}
    ${enCours ? "" : ` · <button class="lien-act" type="button" data-act="ac-envoyer" data-id="${e.id}">Envoyer au groupe AC…</button>`}</div>`;
  const typeCauses = (REF.causeTypes || []).filter(c => c.typeId === e.typeId && c.actif);
  return `<div class="ac-cr small">
    <div><strong>Cause précise :</strong> ${e.causeType ? esc(e.causeType) : e.cause ? `<span class="pill warn">À classer</span>` : `<span class="muted">pas encore de cause</span>`}
      ${e.cause && typeCauses.length ? ` <select data-ac-ct="${e.id}" aria-label="Cause précise">${ctOptions(e.typeId, e.causeTypeId)}</select>` : ""}</div>
    <div><strong>Récidive :</strong> ${de ? `de <button class="lien-act" type="button" data-act="detail" data-id="${de.id}">${esc(de.no)}</button> · <button class="lien-act" type="button" data-act="ac-recid-x" data-id="${e.id}">retirer</button>`
      : `non · <button class="lien-act" type="button" data-act="ac-recid" data-id="${e.id}">c'est une récidive…</button>`}${e.nbRecidives ? ` · <span class="pill bad">${e.nbRecidives} récidive${e.nbRecidives > 1 ? "s" : ""} de cet écart</span>` : ""}</div>${acLigne}</div>`;
}
document.addEventListener("change", async ev => {
  const s = ev.target.closest("[data-ac-ct]"); if (!s) return;
  try { await Api.classerCause(Number(s.dataset.acCt), s.value ? Number(s.value) : null); await acRefCauses(); } catch (err) { alertBox(err.message); }
});

/* ---------- Espace du groupe d'amélioration continue ---------- */
const AC_BLOCS = ["ac_recus", "recurrences", "a_classer", "projets", "procedures"];
async function acCharger() { const [ecarts, projets, demandes, lec] = await Promise.all([Api.ecarts({}), Api.projetsAC ? Api.projetsAC() : [], Api.demandesAC ? Api.demandesAC() : [], Api.lecons ? Api.lecons() : null, acRefCauses()]); return { ecarts, projets, demandes, lec }; }
