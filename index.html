<style>
/* Portail DMS EBI — bandeau marine, modules en onglets, état lu par bandes et pastilles. */
:root{
  --navy:#0b2545; --accent:#1f5fae; --accent-soft:#e6eef9;
  --paper:#f4f6f9; --surface:#ffffff; --ink:#16202e; --muted:#5b6778; --line:#d9dfe7;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fff2db; --bad:#c0392b; --bad-soft:#fde8e5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0a1a33; --accent:#6aa3ec; --accent-soft:#16294a;
    --paper:#0e1520; --surface:#162131; --ink:#e6ecf4; --muted:#9aa8ba; --line:#2a3a50;
    --ok:#4cc27f; --ok-soft:#13301f; --warn:#e7a43c; --warn-soft:#33260f; --bad:#ef6b5c; --bad-soft:#3a1814;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0a1a33; --accent:#6aa3ec; --accent-soft:#16294a;
  --paper:#0e1520; --surface:#162131; --ink:#e6ecf4; --muted:#9aa8ba; --line:#2a3a50;
  --ok:#4cc27f; --ok-soft:#13301f; --warn:#e7a43c; --warn-soft:#33260f; --bad:#ef6b5c; --bad-soft:#3a1814;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem} h3{font-size:1.12rem}
button,select,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
header.top .brand{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top .brand-logo{height:37px;width:auto;display:block}
header.top .brand-sep{width:1px;height:30px;background:rgba(255,255,255,.35)}
@media (max-width:560px){header.top .brand-logo{height:30px}header.top .brand-sep{height:24px}}
header.top .brand h1{font-size:1.55rem;color:#fff}
header.top .tag{font-size:.82rem;opacity:.8}
header.top .who{display:flex;gap:10px;align-items:center;font-size:.9rem}
header.top .who select{background:#13305a;color:#fff;border:1px solid #2d4f80;border-radius:6px;padding:4px 6px}
header.top .btn{color:var(--ink)}
.demo-band{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--warn);padding:5px 20px;font-size:.84rem}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--navy);padding:0 16px}
nav.tabs a{color:#c8d6ea;padding:10px 14px;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;text-decoration:none;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#7fb2f0}
nav.tabs a:hover{color:#fff}
main{padding:18px 20px 40px;max-width:1360px;margin:0 auto}
.loading{padding:40px;text-align:center;color:var(--muted)}
.error{padding:12px 14px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--paper);color:var(--muted);border-color:var(--line)}
.sq{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:.9rem;flex:none}
:root[data-theme="dark"] .sq{background:#2d4f80}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.home .card h3{margin-bottom:8px}
.count{font-family:var(--display);font-size:2.2rem;font-weight:600;line-height:1}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list-plain li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}
.list-plain li:last-child{border-bottom:0}
.layout-meet{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.layout-meet{grid-template-columns:1fr}}
.meet-list .dept{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.meet-list .dept:first-child{margin-top:0}
.meet-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.meet-item:hover{border-left-color:var(--accent)}
.meet-item[aria-pressed="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.meet-item .n{font-weight:600}
.meet-item .f{font-size:.82rem;color:var(--muted)}
.meet-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.timer{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1}
.timer.over{color:var(--bad)}
.agenda{display:grid;gap:10px;margin-top:14px}
.ag{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ag > .ag-h{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.ag .ag-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:.85rem}
.ag.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ag.current .ag-n{background:var(--accent);color:#fff;border-color:var(--accent)}
.ag.done{opacity:.72}
.ag.done .ag-n{background:var(--ok);color:#fff;border-color:var(--ok)}
.ag .ag-b{padding:12px 14px}
.ag .ag-t{font-weight:600;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);border-top:4px solid var(--line)}
.kpi.ok{border-top-color:var(--ok)} .kpi.bad{border-top-color:var(--bad)} .kpi.warn{border-top-color:var(--warn)}
.kpi-click{cursor:pointer}
.kpi-click:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kpi .k-l{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.kpi .k-v{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.1}
.kpi .k-c{font-size:.78rem;color:var(--muted)}
.ecart{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.ecart .stripe{background:var(--line)}
.ecart.sev2 .stripe{background:var(--warn)} .ecart.sev3 .stripe{background:var(--bad)} .ecart.retour .stripe{background:var(--ok)}
.ecart .body{padding:9px 0}
.ecart .title{font-weight:600}
.ecart .acts{padding:9px 12px 9px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted);margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap;background:var(--surface)}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.overlay{position:fixed;inset:0;background:rgba(8,16,30,.55);display:flex;justify-content:center;align-items:flex-start;padding:4vh 12px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:min(780px,100%);padding:18px 20px;border-top:5px solid var(--navy)}
.modal h2{margin-bottom:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form .full{grid-column:1/-1}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.form label{display:grid;gap:3px;font-size:.86rem;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:.95rem}
.form textarea{min-height:64px;resize:vertical}
.check,.form label.check{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.9rem;font-weight:400}
.collabs{display:flex;flex-wrap:wrap;gap:6px 16px}
.section-t{font-family:var(--display);font-size:1.08rem;font-weight:600;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.form .form{margin:0}
.notice{border-radius:6px;padding:9px 12px;font-size:.9rem;border:1px solid}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)}
.preview-title{font-family:var(--display);font-size:1.15rem;font-weight:600;padding:7px 10px;border:1px dashed var(--line);border-radius:6px;background:var(--paper)}
.act-row{display:grid;grid-template-columns:70px 1fr 200px 150px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:700px){.act-row{grid-template-columns:1fr}}
.act-row input,.act-row select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;color:var(--ink)}
.timeline{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px;display:grid;gap:8px}
.timeline div{position:relative;font-size:.9rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px 56px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:18px;background:var(--paper);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.vital .fill{background:var(--navy)}
:root[data-theme="dark"] .bar.vital .fill{background:#8fb8ee}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.spark{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
footer{max-width:1360px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Bilans de rencontres (suites) */
.bil{display:grid;gap:14px}
.bil input,.bil select,.bil textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:.93rem;width:100%;min-width:0}
.bil textarea{min-height:58px;resize:vertical;line-height:1.4}
.bil label{display:grid;gap:3px;align-content:start;font-size:.82rem;color:var(--muted);font-weight:500}
.bil .span2{grid-column:span 2}
.bil-title{font-family:var(--display);font-size:1.55rem!important;font-weight:600;border-color:transparent!important;background:transparent!important}
.bil-title:hover,.bil-title:focus{border-color:var(--line)!important;background:var(--paper)!important}
.bil-meta{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.bil-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bil-act{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1.6fr);gap:10px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.bil-act[data-st="fait"]{border-left-color:var(--ok)}
.bil-act[data-st="bloque"]{border-left-color:var(--bad)}
@media (max-width:1000px){.bil-act{grid-template-columns:1fr}}
.bil-act-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;align-content:start}
.bil-prec{margin-top:4px;padding:4px 8px;border-left:3px solid var(--line);background:var(--paper);border-radius:0 4px 4px 0}
.bil-pt{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--surface)}
.bil-pt-h{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bil-pt-h .ag-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.85rem;flex:none}
.bil-pt-h .bil-sujet{flex:1 1 260px;width:auto;font-weight:600}
.bil-pt-h .w-resp{flex:0 1 210px;width:auto}
.bil-pt-h .w-min{flex:0 0 76px;width:76px}
.bil-pt-b{padding:10px 12px}
.bil-new{display:grid;grid-template-columns:minmax(0,1fr) 190px 150px 110px auto;gap:6px;align-items:center;margin-top:6px}
.bil-new[data-st="fait"] > input:first-child{text-decoration:line-through;color:var(--muted)}
.bil-add input{background:var(--surface)}
@media (max-width:800px){.bil-new{grid-template-columns:1fr}.bil .span2{grid-column:auto}}
.bil-lbl textarea{min-height:80px}
.etat{font-size:.84rem}.etat.bad{color:var(--bad)}
.chg{margin-bottom:12px}.chg h3{display:flex;gap:8px;align-items:center;margin-bottom:4px}.chg ul{margin:0;padding-left:18px;display:grid;gap:4px}
#print-area{display:none}
@page{margin:14mm}
@media print{
  body.printing > *:not(#print-area){display:none!important}
  body.printing #print-area{display:block;font-family:var(--body);color:#000;font-size:11pt}
  #print-area h1{font-family:var(--display);font-size:20pt;margin:8px 0 2px}
  #print-area h2{font-family:var(--display);font-size:14pt;border-bottom:2px solid #0b2545;margin:14px 0 6px;padding-bottom:2px}
  #print-area h3{font-size:12pt;margin:10px 0 4px}
  #print-area table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:9.5pt}
  #print-area th,#print-area td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
  #print-area th{background:#e6eef9}
  #print-area tr,#print-area .pr-pt{break-inside:avoid}
  .pr-h img{height:26px;width:auto;display:block}
  .pr-h{display:flex;justify-content:space-between;align-items:center;background:#0b2545;color:#fff;padding:6px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-m{color:#444;font-size:10pt}.pr-r{font-weight:400;color:#444}.pr-av{color:#333;font-style:italic;margin-top:2px}
  .pr-f{margin-top:16px;border-top:1px solid #bbb;padding-top:4px;font-size:8.5pt;color:#555}
}
.lien-act{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px dotted var(--muted)}
.lien-act:hover{color:var(--accent);border-bottom-color:var(--accent)}
.lien-act:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}
/* Étiquettes, pièces jointes, archives */
.chip{display:inline-flex;align-items:center;gap:4px;background:#e6eef9;color:var(--navy);border:1px solid #c9d8ee;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;margin:2px 4px 2px 0}
.chip.sm{font-size:.72rem;padding:0 7px;font-weight:500}
.chip button{all:unset;cursor:pointer;font-size:.75rem;color:var(--muted);padding:0 2px}.chip button:hover{color:var(--bad)}
.chip button:focus-visible{outline:2px solid #7fb2f0;border-radius:3px}
.etiq-ed{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.etiq-ed input{flex:1 1 220px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);color:var(--ink);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:10px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:.88rem;font-weight:600;color:var(--muted);background:var(--surface)}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.seg button:focus-visible{outline:3px solid #7fb2f0;outline-offset:-3px}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0}
.pj{position:relative;margin:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface)}
.pj img,.pj video{display:block;width:100%;height:120px;object-fit:cover;border-radius:5px;background:#000}
.pj-lien{display:flex;flex-direction:column;justify-content:center;min-height:60px;word-break:break-word}
.pj-i{margin-top:4px}
.pj-del{position:absolute;top:8px;right:8px;z-index:1;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.8rem;padding:1px 6px;color:var(--ink)}
.pj-del.conf{background:var(--bad);color:#fff;border-color:var(--bad)}
.pj-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.pj-add input{flex:1 1 180px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);color:var(--ink);font-size:.9rem}
.pj-add label.btn{cursor:pointer}
.pj-add label.btn:focus-within{outline:3px solid #7fb2f0}
.err-txt{color:var(--bad)}
.jauge{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin-top:6px;max-width:420px}
.jauge span{display:block;height:100%;background:var(--accent)}.jauge span.bad{background:var(--bad)}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pj-add label.btn{position:relative}
.pbi-cadre{position:relative;width:100%;aspect-ratio:16/9.6;min-height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;margin-top:12px}
.pbi-cadre iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.journal-det{margin-top:10px}.journal-det summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0}
.journal-det summary:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}
/* Croix de sécurité */
.cx-nav{margin-bottom:8px}.cx-mois{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize}
.cx-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cx-bloc{display:grid;gap:6px;justify-items:center;text-align:center}
.cx-t{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--navy)}
.cx-grille{display:grid;grid-template-columns:repeat(7,28px);grid-template-rows:repeat(7,28px);gap:3px}
.cx{all:unset;box-sizing:border-box;display:grid;place-items:center;border-radius:4px;font-size:.72rem;font-weight:700;cursor:pointer;border:1px solid rgba(0,0,0,.12);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cx:focus-visible{outline:3px solid #7fb2f0;outline-offset:1px}
.cx-vert{background:#2e9e4f}.cx-jaune{background:#f2c230;color:#3b2f00}.cx-orange{background:#ef7d22}.cx-rouge{background:#d0312d}
.cx-neutre{background:#d9dee5;color:#4b5563}.cx-futur{background:#fff;color:#9aa3ae;cursor:default;border-style:dashed}.cx-vide{background:transparent;border:1px dashed #e3e7ed;cursor:default}
.cx-man{box-shadow:inset 0 0 0 2px #0b2545}
.cx-auj{outline:2px solid var(--navy);outline-offset:2px}
.cx-p{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.cx-cpt .cx-p:first-child{margin-left:0}
.cx-leg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;color:var(--muted)}.cx-leg .cx-p{margin-left:0}
.cx-choix{border:0;padding:0;margin:0;display:grid;gap:4px}.cx-choix .cx-p{margin-left:0}
.cx-somme .cx-grille{padding:6px;border:2px solid var(--navy);border-radius:8px}
.cx-somme .cx-t{font-size:1.15rem}
/* Cloche et panneau « Ton action » */
.bell{all:unset;position:relative;cursor:pointer;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;background:rgba(255,255,255,.08)}
.bell:hover{background:rgba(255,255,255,.18)}.bell:focus-visible{outline:3px solid #7fb2f0}
.bell.retard{box-shadow:inset 0 0 0 2px #f2c230}
.bell-n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#d0312d;color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;box-sizing:border-box}
.bell-n[hidden]{display:none}
.nt-list{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.nt-list li{display:flex;align-items:center;gap:8px}
.nt-item{all:unset;cursor:pointer;flex:1;display:grid;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.nt-item:hover{border-color:var(--accent)}.nt-item:focus-visible{outline:3px solid #7fb2f0}
.nt-t{font-weight:600}
.ton-action{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 12px;background:#f1f6fd}
.ton-action h3{margin:0 0 6px}
.ta-form{grid-template-columns:1fr 1fr;padding:8px 0;border-top:1px solid var(--line)}
.ta-form:first-of-type{border-top:0}
.pbi-slot:empty{display:none}
.pbi-renc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;margin:10px 0}
.pbi-renc summary{cursor:pointer;padding:2px 0}.pbi-renc summary:focus-visible{outline:3px solid #7fb2f0}
.pbi-renc .seg{margin-left:0;flex-wrap:wrap}
.pbi-vide{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
.pbi-minis{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:8px}
.pbi-mini{width:300px}
.pbi-mini-cadre{position:relative;width:300px;height:175px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.pbi-mini-cadre iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.pbi-mini-btn{all:unset;position:absolute;inset:0;cursor:zoom-in;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px}
.pbi-mini-btn span{background:rgba(11,37,69,.85);color:#fff;font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:5px;opacity:.85}
.pbi-mini-btn:hover span,.pbi-mini-btn:focus-visible span{opacity:1}
.pbi-mini-btn:focus-visible{outline:3px solid #7fb2f0;outline-offset:-3px}
.pbi-mini-t{font-size:.85rem;font-weight:600;margin-top:4px}
.pbi-mini-aj{align-self:center}
.pbi-full{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column}
.pbi-full-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--navy);flex-wrap:wrap}
.pbi-full-h .seg{margin-left:0}
.pbi-full iframe{flex:1;width:100%;border:0}
body.pbi-ouvert{overflow:hidden}

/* Actions de suivi par lettre SQCDP, dans les rencontres */
.ract-pt{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ract-pt > .row{margin-bottom:6px}
.ract-pt tr[data-st="fait"] .lien-act{text-decoration:line-through;color:var(--muted)}

/* Tournées gemba */
.g-std{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.g-std:first-of-type{border-top:0}
.g-days{display:inline-flex;gap:3px}
.g-day{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 3px;border-radius:5px;font-size:.75rem;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.g-day[data-e="fait"]{background:#2e8540;border-color:#2e8540;color:#fff}
.g-day[data-e="manque"]{background:#c62828;border-color:#c62828;color:#fff}
.g-day[data-e="jour"]{background:#f1d200;border-color:#d4b800;color:#0b2545}
.g-day[data-e="avenir"]{border-style:dashed}
.g-day[data-e="libre"]{opacity:.45}
.g-list{margin-top:12px}
.g-theme h4{margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.g-theme h4 .cat{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;border-radius:4px;background:var(--navy);color:#fff;font-size:.75rem}
.g-item{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(180px,260px);gap:6px 12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface)}
.g-item[data-r="ok"]{border-left-color:#2e8540}
.g-item[data-r="corriger"]{border-left-color:#c62828;background:rgba(198,40,40,.06)}
.g-item[data-r="so"]{border-left-color:#9aa5b1}
.g-res{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.g-res button{all:unset;cursor:pointer;padding:7px 12px;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--surface);border-left:1px solid var(--line)}
.g-res button:first-child{border-left:0}
.g-res button[aria-pressed="true"][data-r="ok"]{background:#2e8540;color:#fff}
.g-res button[aria-pressed="true"][data-r="corriger"]{background:#c62828;color:#fff}
.g-res button[aria-pressed="true"][data-r="so"]{background:#6b7785;color:#fff}
.g-res button:disabled{cursor:default}
.g-res button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.g-com{width:100%}
.g-suite{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g-fin{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.g-fin textarea{width:100%}
.g-jours{display:flex;flex-wrap:wrap;gap:10px 16px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.g-edit-row{display:grid;grid-template-columns:70px minmax(0,1fr) 70px auto;gap:6px;align-items:center;margin-bottom:6px}
.g-edit-row[data-st="off"] input[data-f="texte"]{text-decoration:line-through;color:var(--muted)}
@media (max-width:760px){.g-item{grid-template-columns:1fr}.g-std{grid-template-columns:1fr auto}}
.g-com{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:.88rem;background:var(--surface);color:var(--ink)}

/* Fiches FAB et avis */
.tab-search{margin-left:auto;display:flex;align-items:center;padding:6px 0}
.tab-search input{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:.88rem;width:190px}
.tab-search input::placeholder{color:rgba(255,255,255,.7)}
.avis{border:1px solid var(--line);border-left:5px solid #f1d200;border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--surface);display:grid;gap:4px}
.avis[data-b="true"]{border-left-color:#c62828;background:rgba(198,40,40,.05)}
.avis[data-st="leve"]{border-left-color:var(--line);opacity:.8}
.avis-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.avis-b{display:flex;gap:6px}
.avis-et .pill{margin-right:2px}
.avis-bandeau{border:1px solid #d4b800;background:rgba(241,210,0,.08);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.fab-sol{margin:-4px 0 10px 14px;padding:6px 10px;border-left:3px solid #2e8540;background:rgba(46,133,64,.06);border-radius:0 6px 6px 0}
.avis-et .pill{background:var(--navy);color:#fff;padding:2px 8px}
#fab-in{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;background:var(--surface);color:var(--ink)}

/* ---------- Cellulaire et tablette ---------- */
.form > *, .layout-meet > *, .two > *{min-width:0}
.form input, .form select, .form textarea{max-width:100%}
header.top .who{flex-wrap:wrap}
@media (max-width:760px){
  header.top{padding:8px 12px;gap:6px 12px}
  header.top .brand h1{font-size:1.2rem}
  header.top .tag{display:none}
  header.top .who{font-size:.85rem;gap:6px}
  /* Onglets sur une seule ligne qu'on fait glisser */
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 6px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs a{flex:0 0 auto;white-space:nowrap}
  .tab-search{display:none}
  main, #app{padding-left:10px;padding-right:10px}
  .modal{width:100%;padding:14px 14px 18px;border-radius:10px 10px 0 0}
  .card{padding:12px}
  .g-res{display:flex;width:100%}
  .g-res button{flex:1;text-align:center}
  .g-suite .btn{flex:1 1 auto}
}
/* Écrans tactiles : cibles assez grandes pour un doigt (44 px) */
@media (pointer:coarse){
  .g-res button{padding:12px 14px;min-height:44px;box-sizing:border-box}
  .btn{min-height:40px}
  .g-com, .form input, .form select, .form textarea{min-height:44px;font-size:16px}
}
@media (max-width:760px){ .overlay{padding:8px 6px} main{padding:12px 10px 32px} }
.agenda, .ag, .ag-h, .ag-b, .cx-slot{min-width:0}
@media (max-width:760px){ .ag-t{white-space:normal;min-width:0;flex:1 1 auto} .ag-b{overflow-x:auto} }

/* Fil de suivi */
.fil-new{display:grid;gap:6px;margin-bottom:10px}
.fil-new textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.fil-l{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:9px}
.fil-l li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:6px 0 6px 0;margin-left:-11px}
.fil-i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:.7rem}
.fil-l li[data-g="commentaire"] .fil-c{background:rgba(22,68,130,.06);border-radius:8px;padding:6px 10px;margin-top:2px;white-space:pre-wrap}
.fil-l li[data-g="Escalade"] .fil-i{background:#fff3c4;border-color:#d4b800}
.fil-l li[data-g="Reglement"] .fil-i{background:#2e8540;color:#fff;border-color:#2e8540}
.ac-cr{display:grid;gap:4px;margin:-2px 0 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
.ac-cr select{font:inherit;font-size:.85rem;max-width:100%}
.recid{border:1px solid #d4b800;background:rgba(241,210,0,.08);border-radius:8px;padding:8px 12px;display:grid;gap:4px}
.recid legend{font-weight:600;font-size:.9rem}
/* Groupe d'amélioration continue */
.ac-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}

.ac-cl select, .ac-cl input, .ac-ct input{font:inherit;font-size:.88rem;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}

.ac-pj{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.ac-pj[data-st="termine"]{border-left-color:#2e8540}.ac-pj[data-st="abandonne"]{opacity:.7}

.ac-pdca span[data-on="true"]{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}

.ac-par td.num{white-space:nowrap}

/* Écarts envoyés au groupe AC */

.ac-dm[data-st="projet"]{border-left-color:#2e8540}.ac-dm[data-st="refusee"]{border-left-color:var(--line);opacity:.85}
/* A3 */
.a3-head{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:12px}
.a3-titre{width:100%;font:inherit;font-family:var(--display);font-size:1.5rem;font-weight:700;border:1px solid transparent;border-radius:6px;padding:2px 6px;background:transparent;color:var(--ink)}
.a3-titre:hover,.a3-titre:focus{border-color:var(--line);background:var(--surface)}
.a3-meta{display:flex;gap:8px;flex-wrap:wrap}.a3-meta label{display:grid;gap:2px;font-size:.78rem;color:var(--muted)}
.a3 input,.a3 select,.a3 textarea{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink);max-width:100%;box-sizing:border-box}
.a3 textarea{width:100%;resize:vertical}
.a3-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.a3-col{display:grid;gap:12px;align-content:start;min-width:0}
.a3 section{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);min-width:0}
.a3 section h3{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:1rem}
.a3 section h3 span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem}
.a3-l{display:grid;gap:3px;margin-top:8px;font-size:.85rem;font-weight:600}
.a3-sub{margin-top:8px;padding:8px;border-radius:8px;background:rgba(22,68,130,.05)}
.a3-ec{font-size:.88rem;margin-top:3px}
.fishbone{display:grid;gap:6px;margin-top:6px}
.fb-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fb-box{display:grid;gap:3px;font-size:.8rem}.fb-box b{color:var(--navy)}
.fb-spine{position:relative;height:30px;display:flex;align-items:center;justify-content:flex-end}
.fb-spine::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid var(--navy)}
.fb-spine span{position:relative;background:var(--navy);color:#fff;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:6px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pq{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}.pq input{width:100%}
.pa input,.pa select{width:100%;min-width:90px}.pa td{padding:3px 4px}
.pa tr[data-retard="true"] input[type=date]{border-color:#c62828;color:#c62828}
.pa tr[data-st="fait"] input[data-f="texte"]{text-decoration:line-through;color:var(--muted)}
.gantt{margin-top:10px;display:grid;gap:3px}
.gantt-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center}
.gantt-lab{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;height:18px;background:rgba(11,37,69,.04);border-radius:4px}
.gantt-head .gantt-track{background:none;height:16px}
.gantt-tick{position:absolute;top:0;font-size:.65rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.gantt-today{position:absolute;top:-2px;bottom:-2px;border-left:2px solid #f1d200;z-index:1}
.gantt-bar{position:absolute;top:3px;height:12px;border-radius:6px;background:#9aa5b1}
.gantt-bar[data-e="cours"]{background:var(--accent)}.gantt-bar[data-e="fait"]{background:#2e8540}.gantt-bar[data-e="retard"]{background:#c62828}.gantt-bar[data-e="bloque"]{background:#e07b00}
.ac-courbe{display:flex;gap:10px;align-items:flex-end;height:96px}
.ac-courbe div{display:grid;justify-items:center;gap:2px;font-size:.72rem}
.ac-courbe span{width:26px;background:#9aa5b1;border-radius:3px 3px 0 0}.ac-courbe span[data-apres="true"]{background:var(--navy)}
.ac-courbe i{font-style:normal;color:var(--muted)}
@media (max-width:900px){.a3-grid{grid-template-columns:1fr}.fb-row{grid-template-columns:1fr}.gantt-row{grid-template-columns:100px minmax(0,1fr)}}

  .a3p-b h3 span{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:#0b2545;color:#fff;font-size:7pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .a3p-s{margin-top:2px}.a3p-vide{color:#777}

  .a3p table{font-size:8.5pt!important;margin:0!important}.a3p th,.a3p td{padding:1px 3px!important;border-bottom:1px solid #ddd}
  .a3p .gantt{margin-top:3px}.a3p .gantt-row{grid-template-columns:110px 1fr}.a3p .gantt-lab{font-size:7.5pt}.a3p .gantt-track{height:10px}.a3p .gantt-bar{top:2px;height:6px}

  .a3p-f{margin-top:3px;font-size:6.5pt;color:#777;text-align:right}
}

"use strict";

function httpApi(base) {
  async function call(method, path, body) {
    const r = await fetch(base + path, {
      method, credentials: "include",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) {
      let msg = "Erreur " + r.status;
      try { const j = await r.json(); if (j.message) msg = j.message; } catch (e) {}
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();

    function seedG() {
      const g = { grilles: [], items: [], standards: [], tournees: [], obs: [], seq: { g: 0, i: 0, s: 0, t: 0, o: 0 } };

      if (f.strate) q = q.eq("strate_courante", Number(f.strate));

    demarrerTournee: (grilleId, standardId) => rpc("demarrer_tournee", { p_grille: Number(grilleId), p_standard: standardId ? Number(standardId) : null }),
    noterObs: (t, d) => rpc("noter_obs", { p_tournee: Number(t), p: d }),
    terminerTournee: (id, note) => rpc("terminer_tournee", { p_id: Number(id), p_note: note || null }),
    lierObsEcart: (o, e) => rpc("lier_obs_ecart", { p_obs: Number(o), p_ecart: Number(e) }),
    obsAction: (o, d) => rpc("obs_action", { p_obs: Number(o), p: d }),
    majGembaGrille: d => rpc("maj_gemba_grille", { p: d }),
    majGembaItem: d => rpc("maj_gemba_item", { p: d }),
    majGembaStandard: d => rpc("maj_gemba_standard", { p: d }),
    ractions: async f => { f = f || {}; let q = sb.from("v_raction").select("*");
      if (f.rencontre) q = q.eq("rencontre", f.rencontre);
      if (f.statut === "ouvertes") q = q.neq("statut", "fait");
      return ok(await q.order("echeance", { ascending: true, nullsFirst: false }).order("id").limit(2000)).map(mapR); },
    exportCsvUrl: () => null
  };
}

window.Api = (() => {
  const cfg = window.DMS_CONFIG || {};
  try {
    if (cfg.mode === "api") return httpApi(cfg.apiBase);
    if (cfg.mode === "supabase") return supabaseApi(cfg);
    return demoApi();
  } catch (err) { window.ApiErreur = err.message; return null; }
})();

<script>
/* Suites de rencontres et bilans (fusion de l'app « Rencontres EBI »).
   Une suite regroupe des rencontres répétées (ex. Suivi hebdo avec Julien). Chaque rencontre a un bilan :
   informations, présents, points (objectif, discussion, décisions), actions nouvelles et suivi des actions ouvertes.
   Les suites sont privées par défaut : seuls le propriétaire et les personnes invitées les voient (règle appliquée par la base). */
"use strict";

let SUITES = [], BIL = null, BCONF = null, BRACT = null;
const BST = { cours: "En cours", bloque: "Bloqué", fait: "Fait" };
const fmtL = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "";
const bOpt = v => Object.entries(BST).map(([k, l]) => `<option value="${k}" ${v === k ? "selected" : ""}>${l}</option>`).join("");
const bAttr = (k, id, f, t) => `data-b="${k}" data-id="${id}" data-f="${f}"${t !== undefined ? ` data-t="${t}"` : ""}`;
const dlPers = () => `<datalist id="dl-pers">${(REF.personnes || []).map(p => `<option value="${esc(p.nom)}"></option>`).join("")}</datalist>`;
const lignes = s => String(s || "").split(/\n/).map(x => x.trim()).filter(Boolean);
const confid = s => s.prive ? (s.acces && s.acces.length ? `Privée · ${esc(s.proprietaire || "")} et ${s.acces.map(p => esc(p.nom)).join(", ")}` : `Privée · visible par ${s.estProprietaire ? "toi" : esc(s.proprietaire || "le propriétaire")} seulement`) : "Visible par tous les membres du DMS";
const stOf = (a, t) => a.suivi ? a.suivi.statut : (a.fermeLe && a.fermeLe > t.date ? "cours" : a.statut);
const ufR = () => (ui.fR = ui.fR || { statut: "ouvertes", suite: "" });

async function chargerSuites() { SUITES = Api.suites ? await Api.suites() : []; return SUITES; }

/* ---------- Liste de gauche ---------- */
function suitesAside() {
  if (!Api.suites) return "";
  const l = SUITES.filter(s => s.actif !== false);
  return `<div class="dept">Mes suites de rencontres</div>${l.map(s => `<button type="button" class="meet-item" data-act="b-suite" data-code="${esc(s.code)}" aria-pressed="${ui.suite === s.code}"><span class="n">${esc(s.nom)}</span> ${s.prive ? `<span class="pill neutral">Privée</span>` : `<span class="pill lvl">Partagée</span>`}<div class="f">${s.nbTenues} rencontre(s)${s.derniere ? " · dernière " + fmtD(s.derniere) : ""}${s.actionsOuvertes ? ` · ${s.actionsOuvertes} action(s) ouverte(s)` : ""}</div></button>`).join("")}
  <button class="btn small" type="button" data-act="b-new-suite" style="margin:2px 0 4px">+ Nouvelle suite</button>`;
}

/* ---------- Vue d'une suite ---------- */
async function vSuite(aside) {
  const s = SUITES.find(x => x.code === ui.suite);
  if (!s) { ui.suite = null; ui.tenue = null; return null; }
  if (ui.tenue) return vBilan();
  const [tenues, acts] = await Promise.all([Api.tenuesSuite(s.code), Api.ractions({ rencontre: s.code, statut: "ouvertes" })]);
  const head = `<div class="meet-head"><div><h2>${esc(s.nom)}</h2><div class="meta"><span>${esc(s.frequence || "")}</span>${s.participants ? `<span>Participants : ${esc(s.participants)}</span>` : ""}</div>
    <div class="meta"><span class="pill ${s.prive ? "neutral" : "lvl"}">${confid(s)}</span></div></div>
    <div class="row">${s.estProprietaire ? `<button class="btn" type="button" data-act="b-params">Paramètres et partage</button>` : ""}<button class="btn primary" type="button" data-act="b-new-tenue">+ Nouvelle rencontre</button></div></div>`;
  const hist = tenues.length ? `<div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Titre</th><th>Lieu</th><th>Points</th><th>Actions nouvelles</th><th>Actions réglées</th></tr></thead><tbody>${tenues.map(t => `<tr class="click" data-act="b-open" data-id="${t.id}"><td class="num">${fmtD(t.date)} ${t.date.slice(0, 4)}</td><td>${esc(t.titre || s.nom)}</td><td>${esc(t.lieu || "")}</td><td class="num">${t.nbPoints}</td><td class="num">${t.nbNouvelles}</td><td class="num">${t.nbFermees}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Aucune rencontre pour l'instant. Commencez par « Nouvelle rencontre ».</div>`;
  return `<div class="layout-meet"><aside class="meet-list" aria-label="Rencontres">${aside}</aside><section>${head}
   ${typeof slotPbi === "function" ? `<div style="margin-top:14px">${slotPbi(s.code)}</div>` : ""}
   <div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">Historique</h3>${hist}</div>
   <div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">Actions ouvertes (${acts.length})</h3>${acts.length ? ractTable(acts, false) : `<div class="empty">Aucune action ouverte.</div>`}</div></section></div>`;
}

/* ---------- Éditeur de bilan ---------- */
async function vBilan() {
  const b = BIL = await Api.bilan(ui.tenue); const t = b.tenue, id = t.id;
  const suivis = b.actions.filter(a => !a.nouveau), nouv = b.actions.filter(a => a.nouveau);
  const nav = `<div class="row between" style="margin-bottom:12px"><div class="row"><button class="btn small" type="button" data-act="b-back">← ${esc(b.serie.nom)}</button>
     ${b.precedente ? `<button class="btn small" type="button" data-act="b-open" data-id="${b.precedente.id}">‹ ${fmtD(b.precedente.date)}</button>` : ""}${b.suivante ? `<button class="btn small" type="button" data-act="b-open" data-id="${b.suivante.id}">${fmtD(b.suivante.date)} ›</button>` : ""}</div>
     <div class="row"><button class="btn small" type="button" data-act="b-chg">Changements</button>${Api.journal ? `<button class="btn small" type="button" data-act="b-hist">Historique</button>` : ""}<button class="btn small" type="button" data-act="b-md">Copier en Markdown</button><button class="btn small" type="button" data-act="b-obs">Télécharger .md (Obsidian)</button><button class="btn small" type="button" data-act="b-pdf">PDF / imprimer</button></div></div>`;
  const f = (k, l, v, type, ph) => `<label for="bt-${k}">${l}<input id="bt-${k}" ${type ? `type="${type}"` : ""} ${bAttr("tenue", id, k)} value="${esc(v || "")}" ${ph ? `placeholder="${ph}"` : ""}></label>`;
  const head = `<div class="card"><input class="bil-title" ${bAttr("tenue", id, "titre")} value="${esc(t.titre || b.serie.nom)}" aria-label="Titre de la rencontre">
    <div class="row between" style="margin:2px 6px 10px"><span class="muted">${esc(fmtL(t.date))}</span><span id="b-etat" class="etat muted" role="status">Enregistrement automatique</span></div>
    <div class="form bil-meta">${f("date", "Date", t.date, "date")}${f("heureDebut", "Début", t.heureDebut, "", "11:00")}${f("heureFin", "Fin", t.heureFin, "", "12:00")}${f("prochaine", "Prochaine rencontre", t.prochaine, "date")}
    ${f("lieu", "Lieu", t.lieu)}${f("projet", "Projet", t.projet)}${f("redacteur", "Rédacteur", t.redacteur)}${f("tags", "Étiquettes", t.tags, "", "production, moteurs")}
    <label class="span2" for="bt-presents">Présents (un par ligne)<textarea id="bt-presents" ${bAttr("tenue", id, "presents")}>${esc(t.presents || "")}</textarea></label>
    <label class="span2" for="bt-absents">Absents<textarea id="bt-absents" ${bAttr("tenue", id, "absents")}>${esc(t.absents || "")}</textarea></label></div></div>`;
  const suiviH = `<div class="card"><div class="row between"><h3>Suivi des actions (${suivis.length})</h3><span class="small muted">${b.precedente ? "Actions ouvertes reportées des rencontres précédentes." : "Première rencontre de la suite."}</span></div>
    <div style="margin-top:10px">${suivis.length ? suivis.map(a => actSuiviHtml(a, t)).join("") : `<div class="empty">Aucune action à suivre.</div>`}</div></div>`;
  const pts = b.points.map((p, i) => pointHtml(p, i, b.points.length, nouv.filter(a => a.pointId === p.id), id)).join("");
  const libres = nouv.filter(a => !b.points.some(p => p.id === a.pointId));
  const ptsH = `<div class="card"><h3 style="margin-bottom:10px">Points de la rencontre</h3>${pts || `<div class="empty">Aucun point.</div>`}
    ${libres.length ? `<div class="bil-pt"><div class="bil-pt-h"><strong>Autres actions de cette rencontre</strong></div><div style="padding:10px">${libres.map(a => actNewHtml(a)).join("")}</div></div>` : ""}
    <button class="btn" type="button" data-act="b-add-pt">+ Ajouter un point</button></div>`;
  const div = `<div class="card"><label class="bil-lbl" for="bt-divers">Divers<textarea id="bt-divers" ${bAttr("tenue", id, "divers")}>${esc(t.divers || "")}</textarea></label></div>`;
  return `<div class="bil">${dlPers()}${nav}${head}${typeof slotPbi === "function" ? slotPbi(b.serie.code) : ""}${suiviH}${ptsH}${div}<div class="row between"><span class="small muted">Animée par ${esc(t.animeePar || "")} · ${esc(confid(b.serie))}</span><button class="btn small" type="button" data-act="b-del-tenue">Retirer cette rencontre</button></div></div>`;
}
function actSuiviHtml(a, t) {
  const s = a.suivi || {}, st = stOf(a, t);
  const resp = a.suivi ? s.responsable : a.responsable, ech = a.suivi ? s.echeance : a.echeance;
  const prec = a.prec && a.prec.avancement ? `<div class="small muted bil-prec">Au ${fmtD(a.prec.date)} : ${esc(a.prec.avancement)}</div>` : "";
  return `<div class="bil-act" data-st="${st}"><div><label>Action<textarea ${bAttr("ract", a.id, "texte", t.id)} rows="3">${esc(a.texte)}</textarea></label>${prec}<div class="small muted">Depuis le ${fmtD(a.depuis)}${ech && ech < t.date && st !== "fait" ? ` · <span class="pill bad">échéance dépassée</span>` : ""}</div></div>
   <div class="bil-act-f"><label class="span2">Responsable<input list="dl-pers" ${bAttr("ract", a.id, "responsable", t.id)} value="${esc(resp || "")}"></label>
    <label>Échéance<input type="date" ${bAttr("ract", a.id, "echeance", t.id)} value="${esc(ech || "")}"></label><label>Statut<select ${bAttr("ract", a.id, "statut", t.id)}>${bOpt(st)}</select></label></div>
   <label>Avancement à cette rencontre<textarea ${bAttr("ract", a.id, "avancement", t.id)} rows="3">${esc(s.avancement || "")}</textarea></label></div>`;
}
function actNewHtml(a) {
  return `<div class="bil-new" data-st="${a.statut}"><input ${bAttr("ract", a.id, "texte", "")} value="${esc(a.texte)}" aria-label="Action"><input list="dl-pers" ${bAttr("ract", a.id, "responsable", "")} value="${esc(a.responsable || "")}" placeholder="Responsable" aria-label="Responsable">
   <input type="date" ${bAttr("ract", a.id, "echeance", "")} value="${esc(a.echeance || "")}" aria-label="Échéance"><select ${bAttr("ract", a.id, "statut", "")} aria-label="Statut">${bOpt(a.statut)}</select>
   <button class="btn small" type="button" data-act="b-del-act" data-id="${a.id}" aria-label="Retirer l'action" title="Retirer l'action">✕</button></div>`;
}
function pointHtml(p, i, n, acts, tid) {
  const a = (f, l, ta) => ta ? `<label>${l}<textarea ${bAttr("point", p.id, f)}>${esc(p[f] || "")}</textarea></label>` : `<label class="span2">${l}<input ${bAttr("point", p.id, f)} value="${esc(p[f] || "")}"></label>`;
  return `<div class="bil-pt"><div class="bil-pt-h"><span class="ag-n">${i + 1}</span><input class="bil-sujet" ${bAttr("point", p.id, "sujet")} value="${esc(p.sujet)}" placeholder="Sujet" aria-label="Sujet du point ${i + 1}">
    <input class="w-resp" list="dl-pers" ${bAttr("point", p.id, "responsable")} value="${esc(p.responsable || "")}" placeholder="Responsable" aria-label="Responsable du point">
    <input class="w-min" type="number" min="0" ${bAttr("point", p.id, "dureeMin")} value="${p.dureeMin ?? ""}" placeholder="min" aria-label="Durée en minutes">
    <button class="btn small" type="button" data-act="b-up" data-id="${p.id}" ${i === 0 ? "disabled" : ""} aria-label="Monter le point" title="Monter">↑</button><button class="btn small" type="button" data-act="b-down" data-id="${p.id}" ${i === n - 1 ? "disabled" : ""} aria-label="Descendre le point" title="Descendre">↓</button><button class="btn small" type="button" data-act="b-del-pt" data-id="${p.id}" aria-label="Retirer le point" title="Retirer">✕</button></div>
   <div class="form bil-pt-b">${a("objectif", "Objectif")}${a("discussion", "Discussion", 1)}${a("decisions", "Décisions", 1)}
    <div class="span2"><div class="small muted" style="margin-bottom:2px">Actions</div>${acts.map(actNewHtml).join("")}
     <div class="bil-new bil-add" data-point="${p.id}"><input class="na-t" placeholder="Nouvelle action…" aria-label="Nouvelle action"><input class="na-r" list="dl-pers" placeholder="Responsable" aria-label="Responsable de la nouvelle action"><input class="na-e" type="date" aria-label="Échéance de la nouvelle action"><span></span><button class="btn small" type="button" data-act="b-add-act" data-point="${p.id}">Ajouter</button></div></div></div></div>`;
}

/* ---------- Actions de rencontres (onglet Actions et vue d'une suite) ---------- */
function ractTable(list, withSuite) {
  return `<div class="scroll"><table class="t"><thead><tr>${withSuite ? "<th>Suite</th>" : ""}<th>Action</th><th>Responsable</th><th>Échéance</th><th>Depuis</th><th>Statut</th><th>Dernier avancement</th></tr></thead><tbody>${list.map(a => `<tr>${withSuite ? `<td><button class="btn small" type="button" data-act="b-goto" data-code="${esc(a.rencontre)}">${esc(a.serie)}</button></td>` : ""}<td style="min-width:260px"><button type="button" class="lien-act" data-act="b-edit-ract" data-id="${a.id}" data-code="${esc(a.rencontre)}" title="Modifier l'action">${esc(a.texte)}</button></td><td>${esc(a.responsable || "")}</td><td class="num">${a.enRetard ? `<span class="pill bad">${fmtD(a.echeance)}</span>` : fmtD(a.echeance)}</td><td class="num">${fmtD(a.depuis)}</td>
   <td><select ${bAttr("ract", a.id, "statut", "")} data-rr="1" aria-label="Statut">${bOpt(a.statut)}</select></td><td class="small">${esc(a.dernierAvancement || "")}</td></tr>`).join("")}</tbody></table></div>`;
}
async function ractionsCard() {
  if (!Api.ractions) return "";
  const f = ufR(); const list = await Api.ractions({ statut: f.statut, rencontre: f.suite });
  return `<div class="card" style="margin-top:14px"><h3>Actions de rencontres</h3><p class="small muted" style="margin:2px 0 0">Actions décidées en rencontre (suites et rencontres DMS, par lettre SQCDP), suivies à part des actions d'écarts.</p>
   <div class="filters"><select id="fr-suite" aria-label="Suite">${opt([["", "Toutes les rencontres"], ...SUITES.map(s => [s.code, s.nom]), ...RENC.map(r => [r.code, r.nom])], f.suite)}</select><select id="fr-statut" aria-label="Statut">${opt([["ouvertes", "Ouvertes"], ["", "Toutes"]], f.statut)}</select><span class="muted small">${list.length} action(s)</span></div>
   ${list.length ? ractTable(list, true) : `<div class="empty">Aucune action.</div>`}</div>`;
}

/* ---------- Enregistrement automatique ---------- */
const bTimers = new Map();
function setEtat(m, bad) { const e = $("#b-etat"); if (e) { e.textContent = m; e.classList.toggle("bad", !!bad); } }
function bSave(el) {
  const k = el.dataset.b, id = el.dataset.id, f = el.dataset.f; const v = el.value;
  if (el.dataset.v === v) return Promise.resolve();
  el._p = (el._p || Promise.resolve()).then(async () => {
    if (el.dataset.v === v) return;
    setEtat("Enregistrement…");
    try {
      const d = { [f]: f === "dureeMin" ? (v === "" ? "" : Number(v)) : v };
      if (k === "tenue") await Api.majTenue(id, d);
      else if (k === "point") await Api.majPoint(id, d);
      else if (k === "ract") await Api.majRaction(id, el.dataset.t || null, d);
      el.dataset.v = v;
      setEtat("Enregistré à " + new Date().toLocaleTimeString("fr-CA", { hour: "2-digit", minute: "2-digit" }));
      if (k === "ract" && f === "statut") { const r = el.closest("[data-st]"); if (r) r.dataset.st = v; if (el.dataset.rr) { chargerSuites(); render(); } }
      if (k === "tenue" && f === "date") render();
    } catch (err) { setEtat("Non enregistré : " + err.message, true); alertBox(err.message); }
  });
  return el._p;
}
async function bFlush() { const l = [...bTimers.entries()]; bTimers.clear(); for (const [el, h] of l) { clearTimeout(h); await bSave(el); } }

/* ---------- Changements, exports ---------- */
function bChangements(b) {
  const t = b.tenue, acts = b.actions.filter(a => !a.nouveau);
  const g = { regle: [], bloque: [], avance: [], sans: [] };
  acts.forEach(a => { const st = stOf(a, t); if (st === "fait") g.regle.push(a); else if (st === "bloque") g.bloque.push(a); else if (a.suivi && a.suivi.avancement) g.avance.push(a); else g.sans.push(a); });
  const nouv = b.actions.filter(a => a.nouveau);
  const bloc = (l, titre, cls) => `<div class="chg"><h3><span class="pill ${cls}">${l.length}</span> ${titre}</h3>${l.length ? `<ul>${l.map(a => `<li><strong>${esc(a.texte.length > 160 ? a.texte.slice(0, 157) + "…" : a.texte)}</strong><span class="small muted"> · ${esc(a.responsable || "sans responsable")}</span>${a.suivi && a.suivi.avancement ? `<div class="small">${esc(a.suivi.avancement)}</div>` : ""}</li>`).join("")}</ul>` : `<div class="small muted">Aucune.</div>`}</div>`;
  return `<h2>Changements depuis ${b.precedente ? "le " + fmtD(b.precedente.date) : "le début"}</h2>
   ${bloc(g.regle, "Réglées", "ok")}${bloc(g.avance, "Avancées", "lvl")}${bloc(g.bloque, "Bloquées", "bad")}${bloc(nouv, "Nouvelles", "warn")}${bloc(g.sans, "Sans changement", "neutral")}
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" type="button" data-act="close">Fermer</button></div>`;
}
function bMarkdown(b, obsidian) {
  const t = b.tenue, L = [], q = s => `"${String(s || "").replace(/"/g, "'")}"`;
  const tags = String(t.tags || "").split(/[,;]/).map(x => x.trim().replace(/\s+/g, "-")).filter(Boolean);
  if (obsidian) L.push("---", `titre: ${q(t.titre || b.serie.nom)}`, `date: ${t.date}`, `serie: ${q(b.serie.nom)}`, `lieu: ${q(t.lieu)}`, `projet: ${q(t.projet)}`, `redacteur: ${q(t.redacteur)}`, ...(t.prochaine ? [`prochaine: ${t.prochaine}`] : []), `tags: [${tags.join(", ")}]`, "---", "");
  L.push(`# ${t.titre || b.serie.nom} — ${fmtL(t.date)}`, "");
  const meta = [t.heureDebut || t.heureFin ? `**Heure** : ${t.heureDebut || ""}${t.heureFin ? " à " + t.heureFin : ""}` : "", t.lieu ? `**Lieu** : ${t.lieu}` : "", t.projet ? `**Projet** : ${t.projet}` : "", t.redacteur ? `**Rédacteur** : ${t.redacteur}` : "", t.prochaine ? `**Prochaine rencontre** : ${fmtL(t.prochaine)}` : ""].filter(Boolean);
  if (meta.length) L.push(meta.join("  \n"), "");
  if (lignes(t.presents).length) L.push(`**Présents** : ${lignes(t.presents).join(", ")}`);
  if (lignes(t.absents).length) L.push(`**Absents** : ${lignes(t.absents).join(", ")}`);
  L.push("");
  const act = (a, st, av, resp, ech) => { L.push(`- [${st === "fait" ? "x" : " "}] ${a.texte.replace(/\n+/g, " ")} — *${resp || "sans responsable"}*${ech ? `, échéance ${ech}` : ""} · **${BST[st]}**`); if (av) L.push(`  - Avancement : ${av.replace(/\n+/g, " ")}`); };
  const suivis = b.actions.filter(a => !a.nouveau);
  if (suivis.length) { L.push("## Suivi des actions", ""); suivis.forEach(a => act(a, stOf(a, t), a.suivi && a.suivi.avancement, a.suivi ? a.suivi.responsable : a.responsable, a.suivi ? a.suivi.echeance : a.echeance)); L.push(""); }
  if (b.points.length) L.push("## Points", "");
  b.points.forEach((p, i) => {
    L.push(`### ${i + 1}. ${p.sujet || "Sans titre"}${p.responsable ? ` (${p.responsable})` : ""}${p.dureeMin ? ` · ${p.dureeMin} min` : ""}`, "");
    if (p.objectif) L.push(`**Objectif** : ${p.objectif}`, "");
    if (p.discussion) L.push("**Discussion**", "", p.discussion, "");
    if (p.decisions) L.push("**Décisions**", "", p.decisions, "");
    const acts = b.actions.filter(a => a.nouveau && a.pointId === p.id);
    if (acts.length) { L.push("**Actions**", ""); acts.forEach(a => act(a, a.statut, null, a.responsable, a.echeance)); L.push(""); }
  });
  const autres = b.actions.filter(a => a.nouveau && !b.points.some(p => p.id === a.pointId));
  if (autres.length) { L.push("## Autres actions", ""); autres.forEach(a => act(a, a.statut, null, a.responsable, a.echeance)); L.push(""); }
  if (t.divers) L.push("## Divers", "", t.divers, "");
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}
function bPrintHtml(b) {
  const t = b.tenue, br = s => esc(s || "").replace(/\n/g, "<br>"), cfg = window.DMS_CONFIG || {};
  const actRow = (a, st, av, resp, ech) => `<tr><td>${br(a.texte)}${av ? `<div class="pr-av">${br(av)}</div>` : ""}</td><td>${esc(resp || "")}</td><td>${ech ? fmtD(ech) : ""}</td><td>${BST[st]}</td></tr>`;
  const suivis = b.actions.filter(a => !a.nouveau);
  return `<div class="pr-h"><div style="display:flex;align-items:center;gap:10px">${document.querySelector(".brand-logo") ? `<img src="${document.querySelector(".brand-logo").src}" alt="EBI Electric">` : "<strong>EBI Electric</strong>"}<span>Bilan de rencontre</span></div><div>${esc(b.serie.nom)}</div></div>
   <h1>${esc(t.titre || b.serie.nom)}</h1><div class="pr-m">${esc(fmtL(t.date))}${t.heureDebut ? ` · ${esc(t.heureDebut)}${t.heureFin ? "–" + esc(t.heureFin) : ""}` : ""}${t.lieu ? " · " + esc(t.lieu) : ""}${t.projet ? " · " + esc(t.projet) : ""}</div>
   <div class="pr-m">${[t.redacteur ? "Rédacteur : " + esc(t.redacteur) : "", t.prochaine ? "Prochaine rencontre : " + esc(fmtL(t.prochaine)) : ""].filter(Boolean).join(" · ")}</div>
   <p><strong>Présents :</strong> ${esc(lignes(t.presents).join(", "))}${lignes(t.absents).length ? `<br><strong>Absents :</strong> ${esc(lignes(t.absents).join(", "))}` : ""}</p>
   ${suivis.length ? `<h2>Suivi des actions</h2><table><thead><tr><th>Action et avancement</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${suivis.map(a => actRow(a, stOf(a, t), a.suivi && a.suivi.avancement, a.suivi ? a.suivi.responsable : a.responsable, a.suivi ? a.suivi.echeance : a.echeance)).join("")}</tbody></table>` : ""}
   ${b.points.length ? "<h2>Points</h2>" : ""}${b.points.map((p, i) => { const acts = b.actions.filter(a => a.nouveau && a.pointId === p.id);
     return `<div class="pr-pt"><h3>${i + 1}. ${esc(p.sujet || "Sans titre")}${p.responsable ? ` <span class="pr-r">(${esc(p.responsable)})</span>` : ""}</h3>${p.objectif ? `<p><strong>Objectif :</strong> ${br(p.objectif)}</p>` : ""}${p.discussion ? `<p><strong>Discussion :</strong><br>${br(p.discussion)}</p>` : ""}${p.decisions ? `<p><strong>Décisions :</strong><br>${br(p.decisions)}</p>` : ""}
       ${acts.length ? `<table><thead><tr><th>Action</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr></thead><tbody>${acts.map(a => actRow(a, a.statut, null, a.responsable, a.echeance)).join("")}</tbody></table>` : ""}</div>`; }).join("")}
   ${t.divers ? `<h2>Divers</h2><p>${br(t.divers)}</p>` : ""}
   <div class="pr-f">Portail DMS EBI v${esc(cfg.version || "")} · imprimé le ${new Date().toLocaleDateString("fr-CA", { day: "numeric", month: "long", year: "numeric" })}</div>`;
}
function bFichier(b) { return (b.tenue.date + " " + (b.serie.nom || "rencontre")).replace(/[\\/:*?"<>|]+/g, "-").trim() + ".md"; }

function bConfirm(titre, texte, fn) { BCONF = fn; modal(`<h2>${esc(titre)}</h2><p>${esc(texte)}</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="b-ok">Retirer</button></div>`); }

   <div class="full"><div class="small muted" style="margin-bottom:4px">Personnes invitées</div>${autres.length ? `<div class="collabs">${autres.map(p => `<label class="check" for="sp-p${p.id}"><input type="checkbox" class="sp-acc" value="${p.id}" id="sp-p${p.id}" ${(s.acces || []).some(x => x.id === p.id) ? "checked" : ""}>${esc(p.nom)}</label>`).join("")}</div>` : `<div class="small muted">Aucune autre personne n'est inscrite dans le DMS pour l'instant. Une personne ajoutée dans Administration pourra être invitée ici.</div>`}</div>
