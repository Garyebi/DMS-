<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail DMS EBI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Portail DMS EBI — bandeau marine, modules en onglets, état lu par bandes et pastilles. */
:root{
  --navy:#0b2545; --accent:#1f5fae; --accent-soft:#e6eef9;
  --paper:#f4f6f9; --surface:#ffffff; --ink:#16202e; --muted:#5b6778; --line:#d9dfe7;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fff2db; --bad:#c0392b; --bad-soft:#fde8e5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0a1a33; --accent:#6aa3ec; --accent-soft:#16294a;
    --paper:#0e1520; --surface:#162131; --ink:#e6ecf4; --muted:#9aa8ba; --line:#2a3a50;
    --ok:#4cc27f; --ok-soft:#13301f; --warn:#e7a43c; --warn-soft:#33260f; --bad:#ef6b5c; --bad-soft:#3a1814;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0a1a33; --accent:#6aa3ec; --accent-soft:#16294a;
  --paper:#0e1520; --surface:#162131; --ink:#e6ecf4; --muted:#9aa8ba; --line:#2a3a50;
  --ok:#4cc27f; --ok-soft:#13301f; --warn:#e7a43c; --warn-soft:#33260f; --bad:#ef6b5c; --bad-soft:#3a1814;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem} h3{font-size:1.12rem}
button,select,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
header.top .brand{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header.top .brand h1{font-size:1.55rem;color:#fff}
header.top .tag{font-size:.82rem;opacity:.8}
header.top .who{display:flex;gap:10px;align-items:center;font-size:.9rem}
header.top .who select{background:#13305a;color:#fff;border:1px solid #2d4f80;border-radius:6px;padding:4px 6px}
header.top .btn{color:var(--ink)}
.demo-band{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--warn);padding:5px 20px;font-size:.84rem}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--navy);padding:0 16px}
nav.tabs a{color:#c8d6ea;padding:10px 14px;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;text-decoration:none;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#7fb2f0}
nav.tabs a:hover{color:#fff}
main{padding:18px 20px 40px;max-width:1360px;margin:0 auto}
.loading{padding:40px;text-align:center;color:var(--muted)}
.error{padding:12px 14px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #7fb2f0;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--paper);color:var(--muted);border-color:var(--line)}
.sq{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:.9rem;flex:none}
:root[data-theme="dark"] .sq{background:#2d4f80}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.home .card h3{margin-bottom:8px}
.count{font-family:var(--display);font-size:2.2rem;font-weight:600;line-height:1}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list-plain li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}
.list-plain li:last-child{border-bottom:0}
.layout-meet{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.layout-meet{grid-template-columns:1fr}}
.meet-list .dept{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.meet-list .dept:first-child{margin-top:0}
.meet-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.meet-item:hover{border-left-color:var(--accent)}
.meet-item[aria-pressed="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.meet-item .n{font-weight:600}
.meet-item .f{font-size:.82rem;color:var(--muted)}
.meet-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.timer{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1}
.timer.over{color:var(--bad)}
.agenda{display:grid;gap:10px;margin-top:14px}
.ag{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ag > .ag-h{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.ag .ag-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:.85rem}
.ag.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ag.current .ag-n{background:var(--accent);color:#fff;border-color:var(--accent)}
.ag.done{opacity:.72}
.ag.done .ag-n{background:var(--ok);color:#fff;border-color:var(--ok)}
.ag .ag-b{padding:12px 14px}
.ag .ag-t{font-weight:600;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);border-top:4px solid var(--line)}
.kpi.ok{border-top-color:var(--ok)} .kpi.bad{border-top-color:var(--bad)} .kpi.warn{border-top-color:var(--warn)}
.kpi-click{cursor:pointer}
.kpi-click:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kpi .k-l{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.kpi .k-v{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.1}
.kpi .k-c{font-size:.78rem;color:var(--muted)}
.ecart{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.ecart .stripe{background:var(--line)}
.ecart.sev2 .stripe{background:var(--warn)} .ecart.sev3 .stripe{background:var(--bad)} .ecart.retour .stripe{background:var(--ok)}
.ecart .body{padding:9px 0}
.ecart .title{font-weight:600}
.ecart .acts{padding:9px 12px 9px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted);margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap;background:var(--surface)}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.overlay{position:fixed;inset:0;background:rgba(8,16,30,.55);display:flex;justify-content:center;align-items:flex-start;padding:4vh 12px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:min(780px,100%);padding:18px 20px;border-top:5px solid var(--navy)}
.modal h2{margin-bottom:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form .full{grid-column:1/-1}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.form label{display:grid;gap:3px;font-size:.86rem;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:.95rem}
.form textarea{min-height:64px;resize:vertical}
.check,.form label.check{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.9rem;font-weight:400}
.collabs{display:flex;flex-wrap:wrap;gap:6px 16px}
.section-t{font-family:var(--display);font-size:1.08rem;font-weight:600;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.form .form{margin:0}
.notice{border-radius:6px;padding:9px 12px;font-size:.9rem;border:1px solid}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)}
.preview-title{font-family:var(--display);font-size:1.15rem;font-weight:600;padding:7px 10px;border:1px dashed var(--line);border-radius:6px;background:var(--paper)}
.act-row{display:grid;grid-template-columns:70px 1fr 200px 150px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:700px){.act-row{grid-template-columns:1fr}}
.act-row input,.act-row select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;color:var(--ink)}
.timeline{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px;display:grid;gap:8px}
.timeline div{position:relative;font-size:.9rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px 56px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:18px;background:var(--paper);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.vital .fill{background:var(--navy)}
:root[data-theme="dark"] .bar.vital .fill{background:#8fb8ee}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.spark{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
footer{max-width:1360px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

<script>
/* Client de l'API du DMS.
   Les deux implémentations exposent exactement les mêmes fonctions (contrat : docs/API.md).
   - httpApi : appelle le serveur DMS (/api/...), authentifié par le compte Windows / Microsoft.
   - demoApi : simule le serveur dans le navigateur, avec des données fictives. */
"use strict";

function httpApi(base) {
  async function call(method, path, body) {
    const r = await fetch(base + path, {
      method, credentials: "include",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) {
      let msg = "Erreur " + r.status;
      try { const j = await r.json(); if (j.message) msg = j.message; } catch (e) {}
      throw new Error(msg);
    }
    return r.status === 204 ? null : r.json();
  }
  const qs = o => { const p = Object.entries(o || {}).filter(([, v]) => v !== "" && v != null); return p.length ? "?" + new URLSearchParams(p).toString() : ""; };
  return {
    mode: "api",
    moi: () => call("GET", "/moi"),
    referentiels: () => call("GET", "/referentiels"),
    ecarts: f => call("GET", "/ecarts" + qs(f)),
    ecart: id => call("GET", "/ecarts/" + id),
    creerEcart: d => call("POST", "/ecarts", d),
    creerEcartComplet: d => call("POST", "/ecarts", d),
    traiterEcart: (id, d) => call("POST", `/ecarts/${id}/traitement`, d),
    escalader: (id, d) => call("POST", `/ecarts/${id}/escalade`, d),
    regler: (id, d) => call("POST", `/ecarts/${id}/reglement`, d),
    retourLu: id => call("POST", `/ecarts/${id}/retour-lu`, {}),
    actions: f => call("GET", "/actions" + qs(f)),
    majAction: (id, d) => call("PATCH", "/actions/" + id, d),
    rencontres: () => call("GET", "/rencontres"),
    tenues: code => call("GET", `/rencontres/${code}/tenues?limite=3`),
    creerTenue: (code, d) => call("POST", `/rencontres/${code}/tenues`, d),
    sujets: code => call("GET", "/sujets" + qs({ rencontre: code })),
    creerSujet: d => call("POST", "/sujets", d),
    majSujet: (id, d) => call("PATCH", "/sujets/" + id, d),
    kpi: dept => call("GET", "/kpi" + qs({ dept })),
    majCible: (code, d) => call("PUT", `/kpi/${code}/cible`, d),
    saisirKpi: (code, d) => call("PUT", `/kpi/${code}/valeurs`, d),
    majBareme: d => call("PUT", "/admin/bareme", d),
    creerType: d => call("POST", "/admin/types", d),
    majType: (id, d) => call("PATCH", "/admin/types/" + id, d),
    exportCsvUrl: () => base + "/export/ecarts.csv"
  };
}

  };

  /* Calcul des KPI DMS sur une fenêtre de 7 jours finissant à `fin` */
  function kpiCalc(k, fin) {
    const deb = new Date(Date.parse(fin) - 7 * 864e5).toISOString().slice(0, 10);
    const inDept = e => e.dept === k.dept, inWin = e => e.dateEcart > deb && e.dateEcart <= fin;
    if (k.calc === "heures") return Math.round(S.ecarts.filter(e => inDept(e) && inWin(e)).reduce((s, e) => s + e.minutes, 0) / 6) / 10;
    if (k.calc === "quasi") return S.ecarts.filter(e => inDept(e) && inWin(e) && ["Quasi-accident", "Condition dangereuse"].includes(type(e.typeId).nom)).length;
    if (k.calc.startsWith("type:")) { const n = k.calc.slice(5); return S.ecarts.filter(e => inDept(e) && inWin(e) && type(e.typeId).nom === n).length; }
    if (k.calc === "jsa") { const b = S.ecarts.filter(e => inDept(e) && e.dateEcart <= fin && type(e.typeId).nom === "Blessure mineure").map(e => e.dateEcart).sort().pop(); return days(b || S.debutSuivi, fin); }

  const need = (cond, msg) => { if (!cond) throw new Error(msg); };

  load();
  const api = {

    ecarts: f => { f = f || {}; let l = S.ecarts.map(vEcart);

      if (f.q) { const q = f.q.toLowerCase(); l = l.filter(e => (e.no + " " + e.titre + " " + e.description + " " + (e.noFab || "")).toLowerCase().includes(q)); }

    majAction: (id, d) => { const a = S.actions.find(x => x.id === Number(id)); if (!a) return fail("Action introuvable"); a.statut = d.statut; save(); return wait(vAction(a)); },

/* Implémentation Supabase : lecture par les vues, écriture par les fonctions (RPC) qui appliquent les règles. */
function supabaseApi(cfg) {
  if (!window.supabase || !window.supabase.createClient) throw new Error("La librairie Supabase n'a pas pu être chargée (connexion Internet?).");
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const ok = ({ data, error }) => { if (error) throw new Error(error.message || "Erreur Supabase"); return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args || {}));
  const mapE = r => ({ id: r.id, no: r.no, dateEcart: r.date_ecart, equipeOrigine: r.equipe_origine, equipeCourante: r.equipe_courante, strateCourante: r.strate_courante, dept: r.dept, cat: r.cat, typeId: r.type_id, type: r.type, titre: r.titre, poste: r.poste, noFab: r.no_fab, minutes: r.minutes, cout: Number(r.cout) || 0, description: r.description, statut: r.statut, cause: r.cause, causeDetail: r.cause_detail, solution: r.solution, strateReglement: r.strate_reglement, dateReglement: r.date_reglement, procedureModifiee: r.procedure_modifiee, procedureNom: r.procedure_nom, dateRetourLu: r.date_retour_lu, ageJours: r.age_jours, nbActions: r.nb_actions, nbActionsOuvertes: r.nb_actions_ouvertes, collaborateurs: r.collaborateurs || [] });
  const mapA = r => ({ id: r.id, ecartId: r.ecart_id, sujetId: r.sujet_id, horizon: r.horizon, texte: r.texte, responsable: r.responsable, echeance: r.echeance, statut: r.statut, noEcart: r.no_ecart, dept: r.dept, enRetard: r.en_retard });
  const mapS = r => ({ id: r.id, rencontre: r.rencontre, titre: r.titre, responsable: r.responsable, statut: r.statut, prochaineRevue: r.prochaine_revue, notes: r.notes || [] });
  const mapT = r => ({ id: r.id, rencontre: r.rencontre, debut: r.debut, dureeMin: r.duree_min, decisions: r.decisions, animeePar: r.animee_par });
  const propre = q => String(q || "").replace(/[,()*%\\]/g, " ").trim();
  return {
    mode: "supabase",
    session: async () => ok(await sb.auth.getSession()).session,
    connexion: async (email, mdp) => ok(await sb.auth.signInWithPassword({ email, password: mdp })),
    deconnexion: async () => { await sb.auth.signOut(); },
    moi: () => rpc("moi"),
    referentiels: () => rpc("referentiels"),
    rencontres: () => rpc("rencontres"),
    ecarts: async f => { f = f || {}; let q = sb.from("v_ecart").select("*");
      if (f.dept) q = q.eq("dept", f.dept);
      if (f.statut === "actifs") q = q.neq("statut", "Ferme"); else if (f.statut) q = q.eq("statut", f.statut);
      if (f.strate) q = q.eq("strate_courante", Number(f.strate));
      if (f.equipe) q = q.eq("equipe_courante", f.equipe);
      if (f.cat) q = q.eq("cat", f.cat);
      if (f.depuis) q = q.gte("date_ecart", f.depuis);
      const t = propre(f.q); if (t) q = q.or(`titre.ilike.*${t}*,description.ilike.*${t}*,no.ilike.*${t}*,no_fab.ilike.*${t}*`);
      return ok(await q.order("date_ecart", { ascending: false }).order("id", { ascending: false }).limit(2000)).map(mapE); },
    ecart: async id => { id = Number(id);
      const [e, a, m] = await Promise.all([sb.from("v_ecart").select("*").eq("id", id).maybeSingle(), sb.from("v_action").select("*").eq("ecart_id", id).order("echeance"), sb.from("v_mouvement").select("*").eq("ecart_id", id).order("id")]);
      const r = ok(e); if (!r) throw new Error("Écart introuvable");
      return Object.assign(mapE(r), { actions: ok(a).map(mapA), mouvements: ok(m).map(x => ({ date: x.date, genre: x.genre, texte: x.texte, par: x.par })) }); },
    creerEcart: d => rpc("creer_ecart", { p: d }),
    creerEcartComplet: d => rpc("creer_ecart_complet", { p: d }),
    traiterEcart: (id, d) => rpc("traiter_ecart", { p_id: Number(id), p: d }),
    escalader: (id, d) => rpc("escalader_ecart", { p_id: Number(id), p_raison: d.raison, p_texte: d.texte }),
    regler: (id, d) => rpc("regler_ecart", { p_id: Number(id), p: d }),
    retourLu: id => rpc("retour_lu", { p_id: Number(id) }),
    actions: async f => { f = f || {}; let q = sb.from("v_action").select("*");
      if (f.responsable) q = q.eq("responsable", f.responsable);
      if (f.statut === "ouvertes") q = q.in("statut", ["AFaire", "EnCours"]); else if (f.statut === "retard") q = q.eq("en_retard", true);
      if (f.dept) q = q.eq("dept", f.dept);
      return ok(await q.order("echeance", { ascending: true }).limit(2000)).map(mapA); },
    majAction: (id, d) => rpc("maj_action", { p_id: Number(id), p_statut: d.statut }),
    tenues: async code => ok(await sb.from("v_tenue").select("*").eq("rencontre", code).order("debut", { ascending: false }).limit(3)).map(mapT),
    creerTenue: (code, d) => rpc("creer_tenue", { p_code: code, p_debut: d.debut || new Date().toISOString(), p_duree: d.dureeMin, p_decisions: d.decisions }),
    sujets: async code => { let q = sb.from("v_sujet").select("*"); if (code) q = q.eq("rencontre", code); return ok(await q.order("id")).map(mapS); },
    creerSujet: d => rpc("creer_sujet", { p: d }),
    majSujet: (id, d) => rpc("maj_sujet", { p_id: Number(id), p: d }),
    kpi: dept => rpc("kpi_liste", { p_dept: dept || null }),
    majCible: (code, d) => rpc("maj_cible", { p_code: code, p_cible: Number(d.cible) }),
    saisirKpi: (code, d) => rpc("saisir_kpi", { p_code: code, p_debut: d.date, p_valeur: d.valeur === null || d.valeur === "" ? null : Number(d.valeur) }),
    majBareme: d => rpc("maj_bareme", { p_min: Number(d.minutesMin), p_cout: Number(d.coutMin), p_secu: !!d.securiteToujours }),
    creerType: d => rpc("creer_type", { p_cat: d.cat, p_nom: d.nom }),
    majType: (id, d) => rpc("maj_type", { p_id: Number(id), p_actif: !!d.actif }),
    ajouterPersonne: d => rpc("ajouter_personne", { p: d }),
    purgerDemo: () => rpc("purger_demo"),
    journal: async f => { f = f || {}; let q = sb.from("v_journal").select("*");
      if (f.table) q = q.eq("table_nom", f.table);
      if (f.lignes) q = q.in("ligne", f.lignes.map(String));
      return ok(await q.order("le", { ascending: false }).limit(f.limite || 100)); },
    exportCsvUrl: () => null
  };
}

window.Api = (() => {
  const cfg = window.DMS_CONFIG || {};
  try {
    if (cfg.mode === "api") return httpApi(cfg.apiBase);
    if (cfg.mode === "supabase") return supabaseApi(cfg);
    return demoApi();
  } catch (err) { window.ApiErreur = err.message; return null; }
})();

<script>
/* Portail DMS EBI — interface. Toute donnée passe par window.Api (js/api.js). */

const $ = s => document.querySelector(s);

const isoToday = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d.toISOString().slice(0, 10); };
const isoPlus = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtD = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString("fr-CA", { day: "numeric", month: "short" }) : "";
const nf = (v, d = 1) => v == null ? "–" : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("fr-CA");
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const STATUT = { Ouvert: "Ouvert", RetourT1: "Retour au T1", Ferme: "Fermé", Annule: "Annulé" };
const ASTATUT = { AFaire: "À faire", EnCours: "En cours", Fait: "Fait", Annule: "Annulé" };
const SSTATUT = { ADecider: "À décider", Planifie: "Planifié", EnCours: "En cours", Termine: "Terminé" };

let renderSeq = 0;

const eq = c => REF.equipes.find(e => e.code === c);
const deptNom = c => (REF.departements.find(d => d.code === c) || {}).nom || "Direction";

const myDepts = () => { const t = myTeams().map(eq).filter(Boolean); if (t.some(x => x.strate >= 3)) return REF.departements.map(d => d.code); return [...new Set(t.flatMap(x => x.depts || [x.dept]))]; };
const inTeamScope = (e, t) => t.strate === 1 ? e.equipeOrigine === t.code : t.strate === 2 ? t.depts.includes(e.dept) : true;

const route = () => { const h = location.hash.slice(1); return ROUTES.some(r => r[0] === h) ? h : "accueil"; };

/* ---------- Démarrage ---------- */
async function boot() {
  if (!window.Api) { $("#app").innerHTML = `<div class="error">${esc(window.ApiErreur || "Le portail n'a pas pu démarrer.")}</div>`; return; }
  if (Api.mode === "supabase") {
    let s = null; try { s = await Api.session(); } catch (e) {}
    if (!s) { showLogin(); return; }
  }
  try {
    [ME, REF, RENC] = await Promise.all([Api.moi(), Api.referentiels(), Api.rencontres()]);
  } catch (err) {
    if (Api.mode === "supabase") { await Api.deconnexion(); showLogin(err.message); return; }
    $("#app").innerHTML = `<div class="error">Le portail n'arrive pas à joindre le serveur DMS : ${esc(err.message)}</div>`; return; }
  const cfg = window.DMS_CONFIG;
  $("#version").textContent = `v${cfg.version} · ${cfg.dateVersion}`;
  renderWho();
  if (!ui.meeting) ui.meeting = (RENC.find(r => myTeams().includes(r.equipe)) || RENC[0]).code;
  render();
}
function showLogin(msg) {
  $("#who").innerHTML = ""; $("#tabs").innerHTML = "";
  $("#app").innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h2 style="margin-bottom:6px">Connexion</h2><p class="small muted" style="margin-top:0">Utilisez le courriel et le mot de passe que l'administrateur du DMS vous a donnés.</p>
  <form id="f-login" class="form" style="grid-template-columns:1fr"><label for="l-mail">Courriel<input id="l-mail" type="email" autocomplete="username" required></label><label for="l-mdp">Mot de passe<input id="l-mdp" type="password" autocomplete="current-password" required></label>
  <div id="l-msg">${msg ? `<div class="notice bad">${esc(msg)}</div>` : ""}</div><button class="btn primary" type="submit">Se connecter</button></form></div>`;
  $("#f-login").addEventListener("submit", async ev => { ev.preventDefault();
    try { await Api.connexion($("#l-mail").value.trim(), $("#l-mdp").value); $("#app").innerHTML = ""; await boot(); }
    catch (err) { formErr("l-msg", /invalid/i.test(err.message) ? "Courriel ou mot de passe invalide." : err.message); } });
}
function renderWho() {
  const w = $("#who");
  if (Api.mode === "supabase") {
    const band = $("#demo-band"); band.hidden = false; band.textContent = "Prototype sur Supabase (Canada). Les données de démonstration se retirent dans Administration avant le pilote.";
    w.innerHTML = `<span>${esc(ME.nom)}</span><span class="tag">${esc(ME.role || "")}</span><button class="btn small" type="button" data-act="logout">Se déconnecter</button>`;
  } else if (Api.mode === "demo") {
    $("#demo-band").hidden = false;
    w.innerHTML = `<label for="demo-user" class="small">Connecté comme</label><select id="demo-user">${Api.personnesDemo().map(p => `<option value="${p.id}" ${p.id === ME.id ? "selected" : ""}>${esc(p.nom)}</option>`).join("")}</select><button class="btn small" type="button" data-act="reset">Réinitialiser</button>`;
  } else w.innerHTML = `<span>${esc(ME.nom)}</span><span class="tag">${esc(ME.role || "")}</span>`;
}
function renderTabs() {
  $("#tabs").innerHTML = ROUTES.filter(r => r[0] !== "admin" || ME.admin).map(([k, l]) => `<a href="#${k}" ${route() === k ? 'aria-current="page"' : ""}>${l}</a>`).join("");
}
async function render() {
  renderTabs();
  const seq = ++renderSeq; const app = $("#app");
  if (!app.innerHTML) app.innerHTML = `<div class="loading">Chargement…</div>`;
  try {
    const html = await ({ accueil: vAccueil, rencontres: vRencontres, ecarts: vEcarts, actions: vActions, tableaux: vTableaux, admin: vAdmin }[route()])();
    if (seq === renderSeq) app.innerHTML = html;
  } catch (err) { if (seq === renderSeq) app.innerHTML = `<div class="error">${esc(err.message)}</div>`; }
}

/* ---------- Accueil ---------- */
async function vAccueil() {
  const [ecarts, actions, kpi] = await Promise.all([Api.ecarts({ statut: "actifs" }), Api.actions({ statut: "ouvertes" }), Api.kpi("")]);
  const prenom = ME.prenom || ME.nom;
  const meets = RENC.filter(r => myTeams().includes(r.equipe));
  const teams = myTeams().map(eq).filter(Boolean);
  const aTraiter = teams.map(t => ({ t, n: ecarts.filter(e => e.equipeCourante === t.code && e.statut === "Ouvert").length, r: t.strate === 1 ? ecarts.filter(e => e.equipeOrigine === t.code && e.statut === "RetourT1").length : 0 }));
  const mine = actions.filter(a => a.responsable === ME.nom);
  const hors = kpi.filter(k => myDepts().includes(k.dept)).filter(k => kpiState(k) === "bad");
  const date = new Date().toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long" });
  return `<div class="row between" style="margin-bottom:14px"><div><h2>Bonjour ${esc(prenom)}</h2><div class="muted">${date} · ${esc(ME.role || "")}</div></div><button class="btn primary" type="button" data-act="new">+ Documenter un écart</button></div>
  <div class="home">
   <div class="card"><h3>Mes rencontres</h3>${meets.length ? `<ul class="list-plain">${meets.map(r => `<li><span><strong>${esc(r.nom)}</strong><br><span class="small muted">${esc(r.frequence)} · ${r.dureeMin} min</span></span><button class="btn small" type="button" data-act="goto-meet" data-code="${r.code}">Ouvrir</button></li>`).join("")}</ul>` : `<div class="empty">Aucune rencontre attitrée.</div>`}</div>
   <div class="card"><h3>À traiter dans mes équipes</h3>${aTraiter.length ? `<ul class="list-plain">${aTraiter.map(x => `<li><span><span class="pill lvl">T${x.t.strate}</span> ${esc(x.t.nom)}${x.r ? `<br><span class="small muted">${x.r} solution(s) à lire à l'équipe</span>` : ""}</span><span class="count num">${x.n}</span></li>`).join("")}</ul>` : `<div class="empty">Aucune équipe attitrée.</div>`}</div>
   <div class="card"><h3>Mes actions <span class="pill ${mine.some(a => a.enRetard) ? "bad" : "ok"}">${mine.filter(a => a.enRetard).length} en retard</span></h3>${mine.length ? `<ul class="list-plain">${mine.slice(0, 6).map(a => `<li><span>${esc(a.texte)}<br><span class="small muted">${a.noEcart || ""} · ${a.horizon}</span></span><span class="num small">${a.enRetard ? `<span class="pill bad">${fmtD(a.echeance)}</span>` : fmtD(a.echeance)}</span></li>`).join("")}</ul>` : `<div class="empty">Aucune action ouverte à votre nom.</div>`}</div>
   <div class="card"><h3>Indicateurs hors cible</h3>${hors.length ? `<ul class="list-plain">${hors.map(k => `<li><span><span class="sq">${k.cat}</span> ${esc(deptNom(k.dept))} · ${esc(k.nom)}</span><span class="num"><strong>${nf(last(k))}${unit(k)}</strong> <span class="small muted">cible ${k.sens === "+" ? "≥" : "≤"} ${nf(k.cible)}</span></span></li>`).join("")}</ul>` : `<div class="empty">Tous les indicateurs de vos départements sont dans la cible.</div>`}</div>
  </div>`;
}

/* ---------- Rencontres ---------- */
async function vRencontres() {
  const m = RENC.find(r => r.code === ui.meeting); const t = eq(m.equipe);
  const [ecarts, actions, sujets, tenues, kpi] = await Promise.all([Api.ecarts({}), Api.actions({ statut: "ouvertes" }), Api.sujets(m.code), Api.tenues(m.code), Api.kpi("")]);
  const groups = [["PAN", "Panneaux"], ["MOT", "Moteurs"], ["VIS", "Vision"], ["DES", "Dessin"], [null, "Direction"]];
  const list = groups.map(([g, l]) => `<div class="dept">${l}</div>` + RENC.filter(r => r.dept === g).map(r => `<button type="button" class="meet-item" data-act="meet" data-code="${r.code}" aria-pressed="${ui.meeting === r.code}"><span class="n">${esc(r.nom)}</span> <span class="pill lvl">T${eq(r.equipe).strate}</span><div class="f">${esc(r.frequence)} · ${r.dureeMin} min</div></button>`).join("")).join("");
  const run = ui.run && ui.run.code === m.code ? ui.run : null;
  const el = run ? Math.floor((Date.now() - run.start) / 1000) : 0;
  const ctx = { m, t, ecarts, actions, sujets, kpi };
  const head = `<div class="meet-head"><div><h2>${esc(m.nom)}</h2><div class="meta"><span>${esc(m.frequence)}</span><span>${m.dureeMin} min</span><span>Strate T${t.strate} : ${esc(t.nom)}</span></div><div class="meta"><span>Participants : ${esc(m.participants)}</span></div></div>
   <div class="row">${run ? `<div class="timer num ${el > m.dureeMin * 60 ? "over" : ""}" id="timer">${mmss(el)}</div><span class="muted small">/ ${m.dureeMin}:00</span><button class="btn" data-act="next" type="button">Point suivant</button><button class="btn primary" data-act="close-meet" type="button">Clore la rencontre</button>` : `<button class="btn primary" data-act="start-meet" type="button">Démarrer la rencontre</button>`}</div></div>`;
  const items = m.points.map((p, i) => { const cls = run ? (i < run.idx ? "done" : i === run.idx ? "current" : "") : "";
    return `<div class="ag ${cls}"><div class="ag-h"><span class="ag-n">${p.ordre}</span><span class="ag-t">${esc(p.titre)}</span><span class="muted small num">${p.dureeMin} min</span></div><div class="ag-b">${bloc(p.bloc, ctx)}</div></div>`; }).join("");
  const cr = tenues.length ? tenues.map(c => `<div class="small"><strong>${fmtD(c.debut)}</strong> · ${c.dureeMin} min · ${esc(c.animeePar || "")} · ${esc(c.decisions)}</div>`).join("") : `<div class="muted small">Aucun compte rendu pour l'instant.</div>`;
  return `<div class="layout-meet"><aside class="meet-list" aria-label="Structure des rencontres">${list}</aside><section>${head}<div class="agenda">${items}</div><div class="card" style="margin-top:14px"><h3>Derniers comptes rendus</h3><div class="grid" style="gap:6px;margin-top:6px">${cr}</div></div></section></div>`;
}
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function bloc(b, { m, t, ecarts, actions, sujets, kpi }) {
  const depts = t.strate === 1 ? [t.dept] : t.strate === 2 ? t.depts : REF.departements.map(d => d.code);
  const scope = ecarts.filter(e => inTeamScope(e, t));
  if (b === "kpi") return kpiTiles(kpi.filter(k => depts.includes(k.dept)), depts.length > 1);
  if (b === "securite") { const l = scope.filter(e => e.cat === "S" && e.statut !== "Ferme"); const jsa = kpi.filter(k => depts.includes(k.dept) && k.nom === "Jours sans accident");
    return `<div class="row" style="margin-bottom:8px">${jsa.map(k => `<span class="pill ${kpiState(k) === "ok" ? "ok" : "warn"}">${esc(deptNom(k.dept))} : ${nf(last(k), 0)} jours sans accident</span>`).join(" ")}</div>` + (l.length ? l.map(e => ecartCard(e, e.equipeCourante === t.code)).join("") : `<div class="empty">Aucun écart de sécurité ouvert.</div>`); }
  if (b === "ecarts") { const l = ecarts.filter(e => e.equipeCourante === t.code && e.statut === "Ouvert").sort((a, c) => sev(c) - sev(a));
    return `<div class="row between" style="margin-bottom:8px"><span class="muted small">${l.length} écart(s) à traiter à ce niveau, les plus graves d'abord.</span><button class="btn small" data-act="new" data-team="${t.strate === 1 ? t.code : ""}" type="button">+ Documenter un écart</button></div>` + (l.length ? l.map(e => ecartCard(e, true)).join("") : `<div class="empty">Rien à traiter à ce niveau.</div>`); }
  if (b === "retours") { const l = ecarts.filter(e => e.equipeOrigine === t.code && e.statut === "RetourT1");
    return l.length ? l.map(e => `<div class="ecart retour"><div class="stripe"></div><div class="body"><div class="title">${esc(e.titre)}</div><div class="meta"><span>${e.no}</span><span>Réglé au T${e.strateReglement}, le ${fmtD(e.dateReglement)}</span></div><div class="small" style="margin-top:4px"><strong>Solution :</strong> ${esc(e.solution)}${e.procedureModifiee ? ` <span class="pill warn">Procédure modifiée : ${esc(e.procedureNom)}</span>` : ""}</div></div><div class="acts"><button class="btn small primary" data-act="retour-lu" data-id="${e.id}" type="button">Lu à l'équipe</button></div></div>`).join("") : `<div class="empty">Aucune solution en attente de lecture.</div>`; }
  if (b === "actions") { const l = actions.filter(a => depts.includes(a.dept) && a.echeance <= isoPlus(7)); return l.length ? actionsTable(l) : `<div class="empty">Aucune action due cette semaine.</div>`; }
  if (b === "sujets") return `<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn small" data-act="new-sujet" data-code="${m.code}" type="button">+ Ajouter un sujet suivi</button></div>` + (sujets.length ? `<div class="scroll"><table class="t"><thead><tr><th>Sujet</th><th>Responsable</th><th>Statut</th><th>Prochaine revue</th><th>Dernière note</th><th></th></tr></thead><tbody>${sujets.map(s => `<tr><td>${esc(s.titre)}</td><td>${esc(s.responsable)}</td><td><span class="pill ${s.statut === "Termine" ? "ok" : s.statut === "ADecider" ? "warn" : "lvl"}">${SSTATUT[s.statut]}</span></td><td class="num">${fmtD(s.prochaineRevue)}</td><td class="small">${esc((s.notes.at(-1) || {}).texte || "")}</td><td><button class="btn small" data-act="edit-sujet" data-id="${s.id}" data-code="${m.code}" type="button">Mettre à jour</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Aucun sujet suivi.</div>`);
  if (b === "plan") { const p = (REF.plan || {})[t.code] || []; return `<ol style="margin:0;padding-left:20px">${p.map(x => `<li>${esc(x)}</li>`).join("")}</ol><div class="muted small" style="margin-top:6px">Tiré de la cédule du département.</div>`; }
  if (b === "charge") return `<p style="margin:0">${esc((REF.charge || {})[m.dept] || (REF.charge || {})["null"] || "")}</p><div class="muted small" style="margin-top:6px">Tiré du rapport de charge.</div>`;
  if (b === "pareto") return paretoBars(scope.filter(e => e.dateEcart >= isoPlus(-28)), "heures", 8);
  if (b === "apercu") return `<div class="scroll"><table class="t"><thead><tr><th>Strate et équipe</th><th>Écarts ouverts</th><th>Graves</th><th>Plus vieux (jours)</th></tr></thead><tbody>${REF.equipes.map(q => { const o = ecarts.filter(e => e.equipeCourante === q.code && e.statut === "Ouvert"); return `<tr><td><span class="pill lvl">T${q.strate}</span> ${esc(q.nom)}</td><td class="num">${o.length}</td><td class="num">${o.filter(e => sev(e) === 3).length}</td><td class="num">${o.length ? Math.max(...o.map(e => e.ageJours)) : "–"}</td></tr>`; }).join("")}</tbody></table></div>`;
  return "";
}

/* ---------- Pièces communes ---------- */
const last = k => (k.valeurs.at(-1) || {}).valeur;
const unit = k => k.unite === "%" ? " %" : k.unite === "h" ? " h" : k.unite === "j" ? " j" : "";
const kpiState = k => { const v = last(k); if (v == null || k.cible == null) return ""; return (k.sens === "+" ? v >= k.cible : v <= k.cible) ? "ok" : "bad"; };
function spark(vals, st) { const arr = vals.map(v => v.valeur).filter(v => v != null); if (arr.length < 2) return ""; const w = 84, h = 28, mn = Math.min(...arr), mx = Math.max(...arr), r = mx - mn || 1;
  const pts = arr.map((v, i) => [(i / (arr.length - 1)) * (w - 4) + 2, h - 3 - ((v - mn) / r) * (h - 6)]); const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const col = st === "bad" ? "var(--bad)" : st === "ok" ? "var(--ok)" : "var(--accent)"; const l = pts.at(-1);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="2,${h - 1} ${line} ${w - 2},${h - 1}" fill="${col}" fill-opacity=".12" stroke="none"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.6" fill="${col}"/></svg>`; }
const kpiManuelCourant = k => (k.saisies || []).some(x => x.date > isoPlus(-7) && x.date <= isoToday());
function kpiOrigine(k) { if (kpiManuelCourant(k)) return "saisie manuelle"; if (k.calcule) return "calculé (" + k.source + ")"; return (k.saisies || []).length ? "saisie à faire" : k.source + " (démo)"; }
function kpiTile(k) { const st = kpiState(k);
  return `<div class="kpi kpi-click ${st}" data-act="kpi" data-code="${esc(k.code)}" role="button" tabindex="0" title="Cliquer pour saisir une valeur"><div class="k-l"><span class="sq">${k.cat}</span>${esc(k.nom)}</div><div class="row between" style="align-items:flex-end"><div class="k-v num">${nf(last(k))}${unit(k)}</div>${spark(k.valeurs, st)}</div><div class="k-c">Cible ${k.sens === "+" ? "≥" : "≤"} ${nf(k.cible)}${unit(k)} · ${esc(kpiOrigine(k))}</div></div>`; }
async function openKpi(code) {
  const k = (await Api.kpi("")).find(x => x.code === code); if (!k) return;
  const st = kpiState(k);
  modal(`<div class="row between"><h2>${esc(k.nom)}</h2><span class="pill lvl">${esc(deptNom(k.dept))}</span></div>
  <div class="row between" style="align-items:flex-end;margin-bottom:10px"><div><div class="k-v num" style="font-family:var(--display);font-size:2.4rem;font-weight:600">${nf(last(k))}${unit(k)}</div><div class="small muted">Cible ${k.sens === "+" ? "≥" : "≤"} ${nf(k.cible)}${unit(k)} · ${esc(kpiOrigine(k))}</div></div>${spark(k.valeurs, st).replace('width="84" height="28"', 'width="220" height="56"')}</div>
  ${k.calcule ? `<div class="notice info" style="margin-bottom:10px">Ce KPI est calculé à partir des écarts. Une valeur saisie remplace le calcul pour sa semaine; effacez-la pour revenir au calcul.</div>` : ""}
  <form id="f-kpi" class="form"><label for="k-date">Date de la valeur<input id="k-date" type="date" value="${isoToday()}" max="${isoToday()}"></label>
  <label for="k-val">Valeur${k.unite ? " (" + esc(k.unite) + ")" : ""}<input id="k-val" type="number" step="any"></label>
  ${ME.admin ? `<label for="k-cible">Cible${k.unite ? " (" + esc(k.unite) + ")" : ""}<input id="k-cible" type="number" step="any" value="${k.cible}"></label><div></div>` : ""}
  <div class="full" id="k-msg"></div><div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Fermer</button><button class="btn primary" type="submit">Enregistrer</button></div></form>
  <div class="two" style="margin-top:12px"><div><h3 style="margin-bottom:6px">8 dernières semaines</h3><table class="t"><thead><tr><th>Semaine finissant le</th><th style="text-align:right">Valeur</th></tr></thead><tbody>${k.valeurs.slice().reverse().map(v => `<tr><td>${fmtD(v.debut)}</td><td class="num" style="text-align:right">${nf(v.valeur)}${v.valeur == null ? "" : unit(k)}</td></tr>`).join("")}</tbody></table></div>
  <div><h3 style="margin-bottom:6px">Saisies manuelles</h3>${(k.saisies || []).length ? `<table class="t"><thead><tr><th>Date</th><th>Valeur</th><th>Par</th><th></th></tr></thead><tbody>${k.saisies.map(x => `<tr><td>${fmtD(x.date)}</td><td class="num">${nf(x.valeur)}${unit(k)}</td><td>${esc(x.par)}</td><td><button class="btn small" type="button" data-act="kpi-effacer" data-code="${esc(k.code)}" data-date="${x.date}">Effacer</button></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Aucune saisie pour l'instant.</div>`}</div></div>`);
  $("#f-kpi").addEventListener("submit", async ev => { ev.preventDefault();
    try { const v = $("#k-val").value; const cibleChange = ME.admin && $("#k-cible") && Number($("#k-cible").value) !== Number(k.cible);
      if (v === "" && !cibleChange) { formErr("k-msg", "Inscrivez une valeur."); return; }
      if (v !== "") await Api.saisirKpi(k.code, { date: $("#k-date").value, valeur: Number(v) });
      if (ME.admin && $("#k-cible") && Number($("#k-cible").value) !== Number(k.cible)) await Api.majCible(k.code, { cible: Number($("#k-cible").value) });
      await openKpi(k.code); render(); } catch (err) { formErr("k-msg", err.message); } });
}
function kpiTiles(list, grouped) {
  if (!list.length) return `<div class="empty">Aucun KPI défini pour cette portée.</div>`;
  if (!grouped) return `<div class="kpis">${list.map(kpiTile).join("")}</div>`;
  const ds = [...new Set(list.map(k => k.dept))];
  return ds.map(d => `<div style="margin-bottom:10px"><div class="muted small" style="margin-bottom:4px">${esc(deptNom(d))}</div><div class="kpis">${list.filter(k => k.dept === d).map(kpiTile).join("")}</div></div>`).join("");
}
function ecartCard(e, withActs) { const t = eq(e.equipeCourante);
  return `<div class="ecart sev${sev(e)}"><div class="stripe"></div><div class="body"><div class="row" style="gap:8px"><span class="sq">${e.cat}</span><span class="title">${esc(e.titre)}</span>${e.equipeCourante !== e.equipeOrigine ? `<span class="pill lvl">Escaladé depuis ${esc(eq(e.equipeOrigine).nom)}</span>` : ""}</div>
  <div class="meta"><span>${e.no}</span><span>${fmtD(e.dateEcart)} (${e.ageJours} j)</span><span class="num">${e.minutes} min perdues</span>${e.cout ? `<span class="num">${e.cout.toLocaleString("fr-CA")} $</span>` : ""}<span>${esc(deptNom(e.dept))}</span>${e.nbActionsOuvertes ? `<span>${e.nbActionsOuvertes} action(s) ouverte(s)</span>` : ""}</div>
  <div class="small" style="margin-top:3px">${esc(e.description)}</div></div>
  <div class="acts">${withActs && e.statut === "Ouvert" ? `<button class="btn small primary" data-act="regler" data-id="${e.id}" type="button">Régler à ce niveau</button>${t.parent ? `<button class="btn small" data-act="escalader" data-id="${e.id}" type="button">Escalader au T${t.strate + 1}</button>` : ""}` : ""}<button class="btn small" data-act="detail" data-id="${e.id}" type="button">Ouvrir</button></div></div>`; }
function actionsTable(list) {

}
function paretoBars(list, mesure, max) {
  const agg = {}; list.forEach(e => { const a = agg[e.type] = agg[e.type] || { cat: e.cat, n: 0, h: 0, c: 0 }; a.n++; a.h += e.minutes / 60; a.c += e.cout; });
  const arr = Object.entries(agg).map(([k, a]) => ({ k, cat: a.cat, v: mesure === "nombre" ? a.n : mesure === "cout" ? a.c : a.h })).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, max || 99);
  const tot = arr.reduce((s, x) => s + x.v, 0); if (!tot) return `<div class="empty">Aucune donnée pour cette période.</div>`;
  const mx = arr[0].v, u = mesure === "nombre" ? "" : mesure === "cout" ? " $" : " h"; let cum = 0;
  return `<div class="bars">${arr.map(x => { const avant = cum; cum += x.v; return `<div class="bar ${avant / tot < 0.8 ? "vital" : ""}"><span><span class="sq" style="width:18px;height:18px;font-size:.75rem">${x.cat}</span> ${esc(x.k)}</span><span class="track"><span class="fill" style="width:${(x.v / mx * 100).toFixed(1)}%"></span></span><span class="num" style="text-align:right">${nf(x.v, mesure === "heures" ? 1 : 0)}${u}</span><span class="num muted" style="text-align:right">${Math.round(cum / tot * 100)} %</span></div>`; }).join("")}</div><div class="legend" style="margin-top:8px"><span>Barres foncées : les types qui font 80 % du total, à attaquer en premier.</span><span>Dernière colonne : pourcentage cumulé.</span></div>`;
}

const opt = (pairs, v) => pairs.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? "selected" : ""}>${esc(l)}</option>`).join("");

const JT = { ecart: "Écart", action: "Action", sujet_suivi: "Sujet suivi", sujet_note: "Note de sujet", rencontre_tenue: "Compte rendu", kpi: "KPI", kpi_valeur: "Valeur de KPI", type_ecart: "Type d'écart", personne: "Personne", equipe_membre: "Membre d'équipe", bareme: "Barème", ecart_collaborateur: "Collaborateur", rencontre_modele: "Rencontre", odj_point: "Ordre du jour" };
const JC = { statut: "statut", echeance: "échéance", date_fait: "date faite", equipe_courante: "équipe", cible: "cible", actif: "actif", prochaine_revue: "prochaine revue", responsable_id: "responsable", titre: "titre", texte: "texte", email: "courriel", admin: "administrateur", minutes_min: "minutes min.", cout_min: "coût min.", cause: "cause", cause_detail: "détail de la cause", solution: "solution", strate_reglement: "réglé au", date_reglement: "date de règlement", date_retour_lu: "retour lu le", procedure_modifiee: "procédure modifiée", procedure_nom: "procédure", decisions: "décisions", valeur: "valeur", nom: "nom", role: "rôle", horizon: "horizon", poste: "poste", minutes: "minutes perdues", cout: "coût", description: "description" };
const CACHES = ["regle_par", "saisi_le", "saisi_par", "par", "demo", "id"];
function jVal(k, v) {
  if (v == null || v === "") return "—";

}
function jSujet(j) { const r = j.apres || j.avant || {};
  if (j.table_nom === "ecart") return "E-" + String(r.id).padStart(5, "0");
  return r.titre || r.texte || r.nom || r.code || r.kpi || j.ligne; }
function jTexte(j) {

  return j.champs.filter(k => !CACHES.includes(k)).map(k => `${JC[k] || k} : ${esc(jVal(k, (j.avant || {})[k]))} → ${esc(jVal(k, (j.apres || {})[k]))}`).join(" · ");
}
const jDate = le => new Date(le).toLocaleString("fr-CA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function journalTable(list) {

function actRowHtml(h) {
  return `<div class="act-row"><select class="a-h" aria-label="Horizon">${opt([["CT", "CT"], ["MT", "MT"], ["LT", "LT"]], h)}</select><input class="a-t" placeholder="Action" aria-label="Action" maxlength="160"><select class="a-r" aria-label="Responsable">${REF.personnes.filter(p => p.actif !== false).map(p => `<option ${p.nom === ME.nom ? "selected" : ""}>${esc(p.nom)}</option>`).join("")}</select><input class="a-e" type="date" value="${isoPlus(7)}" aria-label="Échéance"></div>`;
}
function suiteHtml(t, defaut, nouveau) {
  const up = t && t.parent ? eq(t.parent) : null;
  const choix = [[nouveau ? "caucus" : "enregistrer", nouveau ? "Présenter au prochain kick-off de l'équipe" : `Enregistrer seulement (reste ouvert au T${t.strate})`], ["regler", `Régler maintenant au T${t ? t.strate : 1}`]];
  if (up) choix.push(["escalader", `Escalader au T${up.strate} : ${up.nom}`]);

  <div class="full grid" style="gap:6px">${choix.map(([v, l]) => `<label class="check" for="s-${v}"><input type="radio" name="suite" id="s-${v}" value="${v}" ${v === defaut ? "checked" : ""}>${esc(l)}</label>`).join("")}</div>
  <div class="full" id="z-regler" hidden><div class="form"><label class="full" for="d-sol">Solution retenue<input id="d-sol" maxlength="200"></label>
   <div class="full notice info">${t && t.strate > 1 ? "La solution redescendra au T1 qui a vu l'écart, qui confirmera l'avoir lue à l'équipe." : "Réglé au T1 : l'écart sera fermé."}</div></div></div>
  <div class="full" id="z-escalader" hidden><div class="form"><label for="d-raison">Pourquoi on escalade<select id="d-raison">${opt(REF.raisons.map(r => [r, r]), "")}</select></label><label for="d-texte">Ce que le niveau suivant doit décider<input id="d-texte" maxlength="200"></label></div></div>`;
}
function suiteActive() { const r = document.querySelector('input[name="suite"]:checked'); return r ? r.value : "caucus"; }
function majSuite(btn, nouveau) {
  const s = suiteActive(); $("#z-regler").hidden = s !== "regler"; $("#z-escalader").hidden = s !== "escalader";
  btn.textContent = s === "regler" ? (nouveau ? "Enregistrer et régler" : "Régler") : s === "escalader" ? (nouveau ? "Enregistrer et escalader" : "Escalader") : "Enregistrer";
}
function lireDetails() {
  return { cause: $("#d-cause").value, causeDetail: $("#d-cd").value.trim(), procedureModifiee: $("#d-proc").checked, procedureNom: $("#d-pn").value.trim(),
    collaborateurs: [...document.querySelectorAll(".d-col:checked:not(:disabled)")].map(x => x.value),
    actions: [...document.querySelectorAll("#d-acts .act-row")].map(r => ({ horizon: r.querySelector(".a-h").value, texte: r.querySelector(".a-t").value.trim(), responsable: r.querySelector(".a-r").value, echeance: r.querySelector(".a-e").value || isoPlus(7) })).filter(a => a.texte),
    suite: suiteActive(), solution: ($("#d-sol") || {}).value || "", raison: ($("#d-raison") || {}).value || "", texte: ($("#d-texte") || {}).value || "" };
}
function openNew(team) {
  const t1 = REF.equipes.filter(t => t.strate === 1); const def = team || (myTeams().find(c => eq(c) && eq(c).strate === 1)) || "T1-PAN";
  modal(`<h2>Documenter un écart</h2><form id="f-new" class="form">
  <label for="n-team">Équipe qui a vu l'écart<select id="n-team">${opt(t1.map(t => [t.code, t.nom]), def)}</select></label>
  <label for="n-date">Date<input id="n-date" type="date" value="${isoToday()}" max="${isoToday()}"></label>
  <label for="n-cat">Catégorie SQCDP<select id="n-cat">${opt(REF.categories.map(c => [c.code, c.code + " · " + c.nom]), "Q")}</select></label>
  <label for="n-type">Type d'écart (liste fermée)<select id="n-type"></select></label>
  <label for="n-poste">Poste, projet ou équipement<input id="n-poste" maxlength="60" placeholder="Ex. Projet 26-130, section 2" required></label>
  <label for="n-fab">No de FAB (facultatif)<input id="n-fab" maxlength="20" placeholder="Lien avec Fidelio"></label>
  <label for="n-min">Minutes perdues<input id="n-min" type="number" min="0" value="0"></label>
  <label for="n-cout">Coût direct ($)<input id="n-cout" type="number" min="0" value="0"></label>
  <label class="full" for="n-desc">Ce qui s'est passé (140 caractères max.)<input id="n-desc" maxlength="140" placeholder="Un fait observable, pas une opinion" required></label>
  <div class="full"><div class="small muted" style="margin-bottom:3px">Titre généré</div><div class="preview-title" id="n-prev">–</div></div>
  <div class="full" id="n-bareme"></div>
  ${detailsHtml(null)}
  <div class="full" id="n-suite"></div>
  <div class="full" id="n-msg"></div>
  <div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit" id="n-save">Enregistrer</button></div></form>`);
  const suite = () => { const cur = suiteActive(); $("#n-suite").innerHTML = `<div class="form">${suiteHtml(eq($("#n-team").value), document.querySelector('input[name="suite"]') ? cur : "caucus", true)}</div>`; majSuite($("#n-save"), true); };
  const upd = () => { const cat = $("#n-cat").value, sel = $("#n-type"), cur = sel.value;
    sel.innerHTML = REF.types.filter(t => t.cat === cat && t.actif).map(t => `<option value="${t.id}" ${String(t.id) === cur ? "selected" : ""}>${esc(t.nom)}</option>`).join("");
    const tn = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : ""; $("#n-prev").textContent = tn + " · " + ($("#n-poste").value.trim() || "…");
    const b = REF.bareme, ok = (cat === "S" && b.securiteToujours) || Number($("#n-min").value) >= b.minutesMin || Number($("#n-cout").value) >= b.coutMin;
    $("#n-bareme").innerHTML = ok ? `<div class="notice ok">Au barème : l'écart se documente.</div>` : `<div class="notice warn">Sous le barème (${b.minutesMin} min ou ${b.coutMin} $) : réglez-le sur place, sans fiche.</div>`;
    $("#n-save").disabled = !ok; };
  ["n-cat", "n-type", "n-poste", "n-min", "n-cout"].forEach(id => document.getElementById(id).addEventListener("input", upd));
  $("#n-team").addEventListener("change", suite); $("#n-suite").addEventListener("change", () => majSuite($("#n-save"), true));
  upd(); suite();
  $("#f-new").addEventListener("submit", async ev => { ev.preventDefault();
    try { await Api.creerEcartComplet(Object.assign({ equipeOrigine: $("#n-team").value, dateEcart: $("#n-date").value, typeId: Number($("#n-type").value), poste: $("#n-poste").value, noFab: $("#n-fab").value.trim() || null, minutes: Number($("#n-min").value) || 0, cout: Number($("#n-cout").value) || 0, description: $("#n-desc").value }, lireDetails()));
      closeModal(); render(); } catch (err) { formErr("n-msg", err.message); } });
}
async function openTraiter(id, suite) {
  const e = await Api.ecart(id); const t = eq(e.equipeCourante);
  modal(`<h2>Traiter au T${t.strate} : ${esc(e.titre)}</h2><p class="small muted" style="margin-top:0">${e.no} · ${fmtD(e.dateEcart)} · ${e.minutes} min perdues${e.cout ? " · " + e.cout.toLocaleString("fr-CA") + " $" : ""} · ${esc(e.description)}</p>
  <form id="f-tr" class="form">${detailsHtml(e)}${suiteHtml(t, suite || "regler", false)}<div class="full" id="t-msg"></div>
  <div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit" id="t-save">Enregistrer</button></div></form>`);
  $("#f-tr").addEventListener("change", ev => { if (ev.target.name === "suite") majSuite($("#t-save"), false); }); majSuite($("#t-save"), false);
  $("#f-tr").addEventListener("submit", async ev => { ev.preventDefault();
    try { const d = lireDetails(); await Api.traiterEcart(id, d); if (ui.run && d.suite !== "enregistrer") ui.run.traites++; closeModal(); render(); } catch (err) { formErr("t-msg", err.message); } });
}
async function openDetail(id) {
  const e = await Api.ecart(id); const t = eq(e.equipeCourante);
  modal(`<div class="row between"><h2>${esc(e.titre)}</h2>${statutPill(e)}</div>
  <div class="meta" style="margin-bottom:10px"><span>${e.no}</span><span><span class="sq">${e.cat}</span> ${esc((REF.categories.find(c => c.code === e.cat) || {}).nom)}</span><span>${esc(deptNom(e.dept))}</span><span>Vu par ${esc(eq(e.equipeOrigine).nom)}</span><span>Maintenant au T${t.strate}</span><span class="num">${e.minutes} min perdues</span>${e.cout ? `<span class="num">${e.cout.toLocaleString("fr-CA")} $</span>` : ""}${e.noFab ? `<span>FAB ${esc(e.noFab)}</span>` : ""}</div>
  <p style="margin:0 0 10px">${esc(e.description)}</p>
  ${e.solution ? `<div class="card" style="margin-bottom:10px"><div class="small"><strong>Cause :</strong> ${esc(e.cause)} · ${esc(e.causeDetail)}</div><div class="small"><strong>Solution :</strong> ${esc(e.solution)}</div>${e.procedureModifiee ? `<div class="small"><strong>Procédure modifiée :</strong> ${esc(e.procedureNom)}</div>` : ""}${e.collaborateurs.length ? `<div class="small"><strong>Collaborateurs :</strong> ${e.collaborateurs.map(esc).join(", ")}</div>` : ""}</div>` : ""}
  ${e.actions.length ? `<h3>Actions</h3>${actionsTable(e.actions)}` : ""}
  <h3 style="margin-top:10px">Historique</h3><div class="timeline">${e.mouvements.map(m => `<div><span class="muted num">${fmtD(m.date)}</span> · ${esc(m.texte)} <span class="muted small">(${esc(m.par)})</span></div>`).join("")}</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">${e.statut === "Ouvert" ? `${t.parent ? `<button class="btn" data-act="escalader" data-id="${e.id}" type="button">Escalader</button>` : ""}<button class="btn primary" data-act="regler" data-id="${e.id}" type="button">Régler</button>` : ""}<button class="btn" data-act="close" type="button">Fermer</button></div>`);
}
async function openCsv() {
  const url = Api.exportCsvUrl(); if (url) { location.href = url; return; }
  const l = await Api.ecarts({}); const cols = ["no", "date", "departement", "equipe_origine", "strate_courante", "statut", "categorie", "type", "poste_projet", "no_fab", "titre", "minutes_perdues", "cout", "cause_6M", "strate_reglement", "date_reglement", "procedure_modifiee", "procedure", "actions_total", "actions_ouvertes", "description"];
  const q = v => { const s = String(v ?? ""); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.join(","), ...l.map(e => [e.no, e.dateEcart, deptNom(e.dept), eq(e.equipeOrigine).nom, "T" + e.strateCourante, STATUT[e.statut], e.cat, e.type, e.poste, e.noFab, e.titre, e.minutes, e.cout, e.cause, e.strateReglement ? "T" + e.strateReglement : "", e.dateReglement, e.procedureModifiee ? "oui" : "non", e.procedureNom, e.nbActions, e.nbActionsOuvertes, e.description].map(q).join(","))].join("\n");
  modal(`<h2>Export des écarts (CSV)</h2><p class="small muted" style="margin-top:0">Une ligne par écart, colonnes structurées. Sur le serveur, ce bouton télécharge directement le fichier.</p><textarea id="csv" readonly style="width:100%;min-height:260px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:8px">${esc(csv)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><span class="small muted" id="csv-msg"></span><button class="btn primary" type="button" data-act="copy-csv">Copier</button><button class="btn" type="button" data-act="close">Fermer</button></div>`);
}
async function openSujet(code, id) {
  const s = id ? (await Api.sujets(code)).find(x => x.id === Number(id)) : null;
  const hist = s && Api.journal ? await Api.journal({ table: "sujet_suivi", lignes: [s.id], limite: 50 }) : null;
  modal(`<h2>${s ? "Mettre à jour le sujet" : "Nouveau sujet suivi"}</h2><form id="f-suj" class="form">
  <label class="full" for="sj-t">Sujet<input id="sj-t" maxlength="100" value="${esc(s ? s.titre : "")}" required></label>
  <label for="sj-r">Responsable<select id="sj-r">${opt(REF.personnes.map(p => [p.nom, p.nom]), s ? s.responsable : ME.nom)}</select></label>
  <label for="sj-s">Statut<select id="sj-s">${opt(Object.entries(SSTATUT), s ? s.statut : "ADecider")}</select></label>
  <label for="sj-p">Prochaine revue<input id="sj-p" type="date" value="${s ? s.prochaineRevue : isoPlus(7)}"></label>
  <label for="sj-n">Note de cette rencontre<input id="sj-n" maxlength="200"></label><div class="full" id="sj-msg"></div>
  ${s ? `<div class="full"><h3 style="margin:4px 0 6px">Historique du sujet</h3><div class="timeline">${s.notes.map(n => `<div><span class="muted num">${fmtD(n.date)}</span> · ${esc(n.texte)}</div>`).join("")}</div>${hist ? `<div style="margin-top:8px">${journalTable(hist)}</div>` : ""}</div>` : ""}
  <div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);
  $("#f-suj").addEventListener("submit", async ev => { ev.preventDefault(); const d = { rencontre: code, titre: $("#sj-t").value, responsable: $("#sj-r").value, statut: $("#sj-s").value, prochaineRevue: $("#sj-p").value, note: $("#sj-n").value.trim() };
    try { s ? await Api.majSujet(s.id, d) : await Api.creerSujet(d); closeModal(); render(); } catch (err) { formErr("sj-msg", err.message); } });
}
function openClose() {
  const m = RENC.find(r => r.code === ui.run.code); const dur = Math.max(1, Math.round((Date.now() - ui.run.start) / 60000));
  modal(`<h2>Clore : ${esc(m.nom)}</h2><form id="f-cr" class="form"><label class="full" for="cr-d">Décisions et messages à retenir<textarea id="cr-d" maxlength="1000"></textarea></label>
  <div class="full small muted">Durée : ${dur} min sur ${m.dureeMin} prévues · ${ui.run.traites} écart(s) traité(s).</div>
  <div class="full row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Continuer la rencontre</button><button class="btn primary" type="submit">Enregistrer et clore</button></div></form>`);
  $("#f-cr").addEventListener("submit", async ev => { ev.preventDefault(); await Api.creerTenue(m.code, { debut: new Date(ui.run.start).toISOString(), dureeMin: dur, decisions: $("#cr-d").value.trim() }); ui.run = null; closeModal(); render(); });
}

/* ---------- Événements ---------- */
document.addEventListener("click", async ev => {
  const a = ev.target.closest("[data-act]"); if (!a) return; const act = a.dataset.act;
  if (act === "overlay") { if (ev.target === a) closeModal(); return; }
  if (a.tagName === "SELECT" || a.type === "checkbox" || a.type === "number") return;
  try {
    if (act === "close") closeModal();
    else if (act === "new") openNew(a.dataset.team || "");
    else if (act === "detail") await openDetail(a.dataset.id);
    else if (act === "regler") await openTraiter(a.dataset.id, "regler");
    else if (act === "escalader") await openTraiter(a.dataset.id, "escalader");
    else if (act === "kpi") await openKpi(a.dataset.code);
    else if (act === "kpi-effacer") { await Api.saisirKpi(a.dataset.code, { date: a.dataset.date, valeur: null }); await openKpi(a.dataset.code); render(); }
    else if (act === "add-act") $("#d-acts").insertAdjacentHTML("beforeend", actRowHtml("MT"));
    else if (act === "retour-lu") { await Api.retourLu(a.dataset.id); render(); }
    else if (act === "csv") await openCsv();
    else if (act === "copy-csv") { const ta = $("#csv"), msg = $("#csv-msg"); try { await navigator.clipboard.writeText(ta.value); msg.textContent = "Copié."; } catch (e) { ta.select(); msg.textContent = "Sélectionné : faites Ctrl+C."; } }
    else if (act === "meet") { if (ui.run && ui.run.code !== a.dataset.code) ui.run = null; ui.meeting = a.dataset.code; render(); }
    else if (act === "goto-meet") { ui.meeting = a.dataset.code; location.hash = "rencontres"; }
    else if (act === "start-meet") { ui.run = { code: ui.meeting, start: Date.now(), idx: 0, traites: 0 }; render(); }
    else if (act === "next") { const m = RENC.find(r => r.code === ui.run.code); ui.run.idx = Math.min(ui.run.idx + 1, m.points.length); render(); }
    else if (act === "close-meet") openClose();
    else if (act === "new-sujet") await openSujet(a.dataset.code, null);
    else if (act === "edit-sujet") await openSujet(a.dataset.code, a.dataset.id);
    else if (act === "reset") { Api.reset(); ui.run = null; await boot(); }
    else if (act === "logout") { await Api.deconnexion(); ui.run = null; showLogin(); }
    else if (act === "purge") modal(`<h2>Retirer les données de démonstration?</h2><p>Les écarts, sujets suivis et comptes rendus fictifs seront supprimés. Les écarts réels restent.</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="purge-ok">Retirer</button></div>`);
    else if (act === "purge-ok") { const n = await Api.purgerDemo(); closeModal(); modal(`<h2>C'est fait</h2><p>${n} écart(s) de démonstration retiré(s).</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Fermer</button></div>`); render(); }
  } catch (err) { modal(`<h2>Erreur</h2><div class="notice bad">${esc(err.message)}</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="close" type="button">Fermer</button></div>`); }
});
document.addEventListener("change", async ev => {
  const el = ev.target; const id = el.id;
  try {
    if (el.dataset.act === "act-statut") { await Api.majAction(el.dataset.id, { statut: el.value }); render(); return; }
    if (el.dataset.act === "type-actif") { await Api.majType(el.dataset.id, { actif: el.checked }); REF = await Api.referentiels(); return; }
    if (el.dataset.act === "cible") { await Api.majCible(el.dataset.code, { cible: Number(el.value) }); return; }
    if (id === "demo-user") { Api.setDemoUser(Number(el.value)); ui.meeting = null; ui.run = null; await boot(); return; }
    const fe = { "fe-dept": "dept", "fe-statut": "statut", "fe-strate": "strate", "fe-cat": "cat" }; if (fe[id]) { ui.fE[fe[id]] = el.value; render(); return; }
    if (id === "fa-resp") { ui.fA.responsable = el.value; render(); return; } if (id === "fa-statut") { ui.fA.statut = el.value; render(); return; }
    if (id === "tb-dept") { ui.tbDept = el.value; render(); return; } if (id === "tb-jours") { ui.tbJours = Number(el.value); render(); return; } if (id === "tb-mesure") { ui.tbMesure = el.value; render(); return; }
  } catch (err) { modal(`<h2>Erreur</h2><div class="notice bad">${esc(err.message)}</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="close" type="button">Fermer</button></div>`); }
});
let qTimer = null;
document.addEventListener("input", ev => { if (ev.target.id !== "fe-q") return; ui.fE.q = ev.target.value; clearTimeout(qTimer);
  qTimer = setTimeout(async () => { const pos = ev.target.selectionStart; await render(); const i = $("#fe-q"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} } }, 250); });
document.addEventListener("submit", async ev => {
  if (ev.target.id === "f-bareme") { ev.preventDefault(); try { await Api.majBareme({ minutesMin: Number($("#b-min").value), coutMin: Number($("#b-cout").value), securiteToujours: $("#b-s").checked }); REF = await Api.referentiels(); render(); } catch (err) { alertBox(err.message); } }
  if (ev.target.id === "f-pers") { ev.preventDefault(); try { await Api.ajouterPersonne({ nom: $("#np-nom").value, prenom: $("#np-prenom").value, role: $("#np-role").value, email: $("#np-mail").value, admin: $("#np-admin").checked, equipes: [...document.querySelectorAll(".np-eq:checked")].map(x => x.value) }); REF = await Api.referentiels(); render(); } catch (err) { alertBox(err.message); } }
  if (ev.target.id === "f-type") { ev.preventDefault(); try { await Api.creerType({ cat: $("#nt-cat").value, nom: $("#nt-nom").value }); REF = await Api.referentiels(); render(); } catch (err) { alertBox(err.message); } }
});
const alertBox = m => modal(`<h2>Erreur</h2><div class="notice bad">${esc(m)}</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="close" type="button">Fermer</button></div>`);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $(".overlay")) closeModal();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches('[data-act="kpi"]')) { ev.preventDefault(); ev.target.click(); } });
window.addEventListener("hashchange", render);
setInterval(() => { if (!ui.run || route() !== "rencontres") return; const el = $("#timer"); if (!el) return; const m = RENC.find(r => r.code === ui.run.code); const s = Math.floor((Date.now() - ui.run.start) / 1000); el.textContent = mmss(s); el.classList.toggle("over", s > m.dureeMin * 60); }, 1000);
boot();

</script>
